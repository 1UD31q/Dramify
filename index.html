  } catch(e) { console.error(e); }

  try {
    const storedSheetUrls = await storeGet('app:sheetUrls', SHARED);
    if(storedSheetUrls){
      // Миграция: старый плоский {op,to} → per-month
      if(typeof storedSheetUrls.op === 'string' || typeof storedSheetUrls.to === 'string'){
        if(storedSheetUrls.op) setSheetUrl('op', activeMonth, storedSheetUrls.op);
        if(storedSheetUrls.to) setSheetUrl('to', activeMonth, storedSheetUrls.to);
      } else {
        sheetUrls = storedSheetUrls;
      }
    }
  } catch(e) { console.error(e); }

  try {
    const storedSalesScriptUrl = await storeGet('app:salesScriptUrl', SHARED);
    if(storedSalesScriptUrl) salesScriptUrl = storedSalesScriptUrl;
  } catch(e) { console.error(e); }

  try {
    const storedSchedules = await storeGet('app:schedules', SHARED);
    if(storedSchedules) schedules = storedSchedules;
  } catch(e) { console.error(e); }

  try {
    const storedPlanOv = await storeGet('app:planOverrides', SHARED);
    if(storedPlanOv && typeof storedPlanOv === 'object') planOverrides = storedPlanOv;
  } catch(e) { console.error(e); }

  try {
    const storedLedger = await storeGet('app:ledgerTotals', SHARED);
    if(storedLedger){
      const good = cacheRead('app:ledgerTotals');
      if(!ledgerHasNumbers(storedLedger) && good !== undefined && ledgerHasNumbers(good)){
        console.warn('В базе нули — восстанавливаю итоги из локальной копии');
        ledgerTotals = good; needsHeal.push('app:ledgerTotals');
      } else { ledgerTotals = storedLedger; }
    }
  } catch(e) { console.error(e); }

  try {
    const storedTrackerUrls = await storeGet('app:trackerUrls', SHARED);
    if(storedTrackerUrls) trackerUrls = storedTrackerUrls;
    else {
      // миграция: старый одиночный trackerUrl
      const oldUrl = await storeGet('app:trackerUrl', SHARED);
      if(oldUrl) trackerUrls[activeMonth] = oldUrl;
    }
    const storedCashUrls = await storeGet('app:cashUrls', SHARED);
    if(storedCashUrls) cashUrls = storedCashUrls;
    const storedCashTotals = await storeGet('app:cashTotals', SHARED);
    if(storedCashTotals){
      const good = cacheRead('app:cashTotals');
      if(!cashHasNumbers(storedCashTotals) && good !== undefined && cashHasNumbers(good)){
        console.warn('В базе нули — восстанавливаю кассу из локальной копии');
        cashTotals = good; needsHeal.push('app:cashTotals');
      } else { cashTotals = storedCashTotals; }
    }
    const storedTrackerData = await storeGet('app:trackerData', SHARED);
    if(storedTrackerData){

      if(storedTrackerData.effectivePlan !== undefined){

  // Делаем это после установки stateLoaded, поэтому откладываем на init().
  pendingHeal = needsHeal;
}

// Ключи, восстановленные из локальной копии и ждущие записи обратно в базу
let pendingHeal = [];
async function flushHeal(){
  if(!pendingHeal.length || !stateLoaded) return;
  const map = {
    'app:kpiData': ()=>kpiData,
    'app:ledgerTotals': ()=>ledgerTotals,
    'app:trackerData': ()=>trackerData,
    'app:cashTotals': ()=>cashTotals,
  };
  for(const key of pendingHeal){
    if(map[key]) await storeSet(key, map[key](), SHARED);
  }
  showToast('Цифры восстановлены из локальной копии', 'success');
  pendingHeal = [];
}

function ensureMonth(monthKey){
  if(!monthKey) return;
  if(!kpiData[monthKey]) kpiData[monthKey] = {};
  employees.forEach(e=>{
    if(e && !kpiData[monthKey][e.id]) kpiData[monthKey][e.id] = zeroKpi(e.department);
  });
}

function getKpi(empId, monthKey){
  const emp = employees.find(e=>e.id===empId);
  ensureMonth(monthKey);
  return (kpiData[monthKey] && kpiData[monthKey][empId]) || zeroKpi(emp ? emp.department : 'op');
}

// ── Slot machine animation ──
// Wraps each char of a .value element in an animated span with staggered delay
// ── Slot machine: JS counter animation ──
// Rapidly cycles through random digits then eases into the real value
// ── Анимация чисел ─────────────────────────────────────────────────────────
// Раньше при каждом обновлении (и раз в 5 минут при фоновой синхронизации)
// цифры KPI 0,9 с мелькали случайными значениями, а полоски плана сбрасывались
// в ноль и росли заново — на деньгах это выглядело как сбой.
// Теперь: число плавно перетекает от прежнего значения к новому и только если
// оно изменилось; при первом показе — без анимации (карточка просто проявляется).
const shownValues = {};   // ключ показателя -> последнее показанное число
const shownBars = {};     // ключ полоски -> последняя ширина, %
function valueKey(el, idx, kind){
  const box = el.closest('.kpi-box, .finance-box, .card');
  const label = box ? (box.querySelector('.label, h2') || {}).textContent || '' : '';
  return kind + ':' + currentViewKey() + ':' + label.trim() + ':' + idx;
}
function slotRoll(container) {
  if (!container) return;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fmt = (n) => new Intl.NumberFormat('ru-RU').format(Math.round(n));
  container.querySelectorAll('.kpi-box .value, .finance-box .value').forEach((el, idx) => {
    const finalText = el.textContent.trim();
    const match = finalText.match(/^(.*?)(\d(?:[\d\s]{0,18}\d)?)(.*)$/);
    if (!match) return;
    const target = parseInt(match[2].replace(/\s/g, ''), 10);
    if (isNaN(target)) return;
    const key = valueKey(el, idx, 'v');
    const prev = shownValues[key];
    shownValues[key] = target;
    if (reduce || prev === undefined || prev === target) return;
    const DURATION = 600, start = performance.now();
    const tick = (now) => {
      const t = Math.min((now - start) / DURATION, 1);
      const ease = 1 - Math.pow(1 - t, 3);
      el.textContent = match[1] + fmt(prev + (target - prev) * ease) + match[3];
      if (t < 1) requestAnimationFrame(tick); else el.textContent = finalText;
    };
    requestAnimationFrame(tick);
  });
  animatePlanBarsIn(container);
}

// Полоски выполнения плана: плавно от прежней ширины к новой, только если изменилась
function animatePlanBarsIn(container) {
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  (container || document).querySelectorAll('.plan-bar-fill').forEach((bar, idx) => {
    const target = parseFloat(bar.style.width) || 0;
    const key = valueKey(bar, idx, 'b');
    const prev = shownBars[key];
    shownBars[key] = target;
    if (reduce || prev === undefined || prev === target) return;
    bar.style.transition = 'none';
    bar.style.width = prev + '%';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      bar.style.transition = 'width .6s cubic-bezier(.22,.61,.36,1)';
      bar.style.width = target + '%';
    }));
  });
}


function fmtDateTime(ts){ const d=new Date(ts); return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'}) + ' ' + fmtTime(ts); }

function lastLogFor(empId){
  const list = logs.filter(l=>l.empId===empId).sort((a,b)=>b.ts-a.ts);
  return list[0] || null;

function isCheckedIn(empId){ const last = lastLogFor(empId); return last && last.type === 'in'; }
function todayHoursFor(empId){
  const todays = logs.filter(l=>l.empId===empId && isToday(l.ts)).sort((a,b)=>a.ts-b.ts);
  let total = 0, openIn = null;
  todays.forEach(l=>{

    else if(l.type==='out' && openIn!==null){ total += (l.ts-openIn); openIn=null; }
  });
  if(openIn!==null) total += (Date.now()-openIn);
  return total;
}
function fmtDuration(ms){
  const h = Math.floor(ms/3600000), m = Math.floor((ms%3600000)/60000);
  return (h>0? h+'ч ' : '') + m + 'м';
}

// ── Хранение отметок ──────────────────────────────────────────────────────
// Каждая отметка — отдельная строка в базе: att:ГГГГ-ММ:<empId>:<ts>.
// Раньше все отметки лежали одним списком, и любой мог переписать его целиком.
// Теперь база (security.sql) пропускает только новую отметку самого сотрудника
// и только с текущим временем; править и удалять отметки может лишь админ.
// Читаем текущий и прошлый месяц + старый общий список (история до переезда).
function attKey(l){ return `att:${saleZoned(l.ts).mk}:${l.empId}:${l.ts}`; }
function prevMonthKey(mk){
  const [y,m] = mk.split('-').map(Number);
  return m===1 ? `${y-1}-12` : `${y}-${String(m-1).padStart(2,'0')}`;
}
async function fetchAttMonth(m){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/kv_store?key=like.${encodeURIComponent('att:'+m+':')}*&select=value&limit=20000`, {
    headers: await sbHeaders()
  });
  if(res.status === 401) authOnUnauthorized();
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return (await res.json()).map(r=>{ try{ return JSON.parse(r.value); }catch(e){ return null; } }).filter(Boolean);
}
async function loadAttendance(){
  const mk = saleZoned(Date.now()).mk;
  const fetchMonth = fetchAttMonth;
  try{
    const [cur, prev, legacy] = await Promise.all([fetchMonth(mk), fetchMonth(prevMonthKey(mk)), storeGet('attendance:log', SHARED)]);
    const seen = {}, out = [];
    [].concat(Array.isArray(legacy) ? legacy : [], prev, cur).forEach(l=>{
      if(!l || !l.empId || !l.ts) return;
      const id = l.empId + ':' + l.ts + ':' + l.type;
      if(seen[id]) return;
      seen[id] = true; out.push(l);
    });
    return out.sort((a,b)=>a.ts-b.ts);
  }catch(e){
    console.error('loadAttendance failed', e);
    storeReadFailed = true;
    return null;
  }
}

// ── Отметки за конкретный день ────────────────────────────────────────────
// Текущий и прошлый месяц уже в logs; более старые месяцы догружаем по запросу.
let attDay = null;            // 'ГГГГ-ММ-ДД' — выбранный день; null = сегодня
let attMonthExtra = {};       // mk -> [отметки] для старых месяцев
let attMonthLoading = {};
function localDayStr(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function attDayValue(){ return attDay || localDayStr(new Date()); }
function shiftAttDay(delta){
  const [y,m,d] = attDayValue().split('-').map(Number);
  const nd = new Date(y, m-1, d + delta);
  if(nd > new Date()) return; // в будущее не листаем
  attDay = localDayStr(nd);
}
function ensureAttMonth(mk){
  const cur = saleZoned(Date.now()).mk;
  if(mk===cur || mk===prevMonthKey(cur) || attMonthExtra[mk] || attMonthLoading[mk]) return;
  attMonthLoading[mk] = true;
  fetchAttMonth(mk).then(list=>{ attMonthExtra[mk] = list; })
    .catch(e=>{ console.error('att month load failed', e); attMonthExtra[mk] = []; })
    .finally(()=>{ attMonthLoading[mk] = false; renderNow(); });
}
function attDayStats(empId, dayStr){
  const [y,m,d] = dayStr.split('-').map(Number);
  const from = new Date(y, m-1, d).getTime(), to = new Date(y, m-1, d+1).getTime();
  const seen = {};
  const list = [].concat(logs, ...Object.values(attMonthExtra))
    .filter(l=> l.empId===empId && l.ts>=from && l.ts<to)
    .filter(l=>{ const id = l.ts+':'+l.type; if(seen[id]) return false; seen[id]=true; return true; })
    .sort((a,b)=>a.ts-b.ts);
  let total = 0, openIn = null;
  list.forEach(l=>{
    if(l.type==='in'){ if(openIn===null) openIn = l.ts; }
    else if(openIn!==null){ total += l.ts-openIn; openIn = null; }
  });
  const open = openIn!==null && dayStr===localDayStr(new Date());
  if(open) total += Math.max(0, Date.now()-openIn);
  const firstIn = list.find(l=>l.type==='in');
  const outs = list.filter(l=>l.type==='out');
  const start = shiftStartFor(empId, dayStr.slice(0,7), d);
  let late = null;
  if(start && firstIn){
    const diff = Math.round((firstIn.ts - new Date(y, m-1, d, ...start.split(':').map(Number)).getTime()) / 60000);
    if(diff > LATE_GRACE_MIN) late = diff;
  }
  return { list, total, open, firstIn: firstIn ? firstIn.ts : null, lastOut: outs.length ? outs[outs.length-1] : null,
           off: isOffDay(empId, dayStr.slice(0,7), d), start, late };
}
// Пунктуальность за месяц: опоздания и среднее время прихода.
// Берём рабочие дни (не выходные) до сегодняшнего включительно, где был приход.
function monthPunctuality(empList, mk){
  const [y,m] = mk.split('-').map(Number);
  const total = daysInMonthOf(mk);
  const lastDay = mk===currentMonthKey() ? new Date().getDate() : (mk > currentMonthKey() ? 0 : total);
  return empList.map(e=>{
    let days = 0, lateDays = 0, lateMin = 0, arrSum = 0, maxLate = 0, withStart = 0;
    for(let d=1; d<=lastDay; d++){
      if(isOffDay(e.id, mk, d)) continue;
      const st = attDayStats(e.id, `${mk}-${String(d).padStart(2,'0')}`);
      if(!st.firstIn) continue;
      days++;
      const t = new Date(st.firstIn);
      arrSum += t.getHours()*60 + t.getMinutes();
      if(st.start) withStart++;
      if(st.late){ lateDays++; lateMin += st.late; maxLate = Math.max(maxLate, st.late); }
    }
    return { e, days, lateDays, lateMin, maxLate, withStart,
             avgArrival: days ? minToHHMM(arrSum/days) : null, start: shiftDefault(e.id) };
  });
}
function renderPunctualityCard(empList, mk){
  ensureAttMonth(mk);
  const rows = monthPunctuality(empList, mk)
    .sort((a,b)=> b.lateDays-a.lateDays || b.lateMin-a.lateMin || (a.avgArrival||'99').localeCompare(b.avgArrival||'99'));
  const noStart = rows.filter(r=>!r.start).length;
  const body = rows.map((r,i)=>`
    <div class="pun-row">
      <span class="pun-rank${r.lateDays && i<3 ? ' hot' : ''}">${i+1}</span>
      <span class="pun-name">${escapeHtml(r.e.name)}<small>${r.start ? 'смена с ' + r.start : 'начало смены не задано'}</small></span>
      <span class="pun-late">${r.lateDays ? `<b>${r.lateDays}</b> ${r.lateDays===1?'опоздание':r.lateDays<5?'опоздания':'опозданий'}<small>всего ${fmtLate(r.lateMin)} · макс. ${fmtLate(r.maxLate)}</small>` : (r.withStart ? '<span class="pun-ok">без опозданий</span>' : '<span class="pun-na">—</span>')}</span>
      <span class="pun-avg mono">${r.avgArrival || '—'}<small>${r.days ? r.days + ' дн.' : 'нет приходов'}</small></span>
    </div>`).join('');
  return `<div class="card">
    <h2>Пунктуальность · ${monthLabel(mk)}</h2>
    <div class="pun-head"><span></span><span>Сотрудник</span><span>Опоздания</span><span>Средний приход</span></div>
    ${body || '<div class="empty">Нет сотрудников</div>'}
    <div class="hint" style="margin-top:8px;">Опоздание — приход позже начала смены больше чем на ${LATE_GRACE_MIN} мин. Считаются рабочие дни по графику.${noStart ? ' Начало смены задаётся в календаре сотрудника.' : ''}</div>
  </div>`;
}

      <div class="att-main"><span class="att-name">${escapeHtml(e.name)}</span><span class="att-times">${status}</span><span class="att-hours mono">${st.total ? fmtDuration(st.total) : '—'}</span></div>
      ${chips}
    </div>`;
  }).join('');
  return `<div class="card">
    <h2>${title} <span class="log-count">${withPunch} из ${empList.length}</span></h2>
    <div class="att-nav">
      <button class="att-btn" data-attshift="-1" aria-label="Предыдущий день">‹</button>
      <input type="date" id="attDayInput" value="${day}" max="${localDayStr(new Date())}">
      <button class="att-btn" data-attshift="1" aria-label="Следующий день" ${isTodaySel?'disabled':''}>›</button>
      ${isTodaySel ? '' : '<button class="att-btn" data-atttoday>Сегодня</button>'}
    </div>
    <div class="att-date">${dateLabel}${attMonthLoading[mk] ? ' · загружаю…' : ''}</div>
    ${body || '<div class="empty">Нет сотрудников</div>'}
  </div>`;
}

let punchInFlight = false;
async function punch(empId){
  if(punchInFlight) return; // защита от повторного/двойного нажатия
  punchInFlight = true;
  try{
    // подтягиваем самые свежие логи перед записью, чтобы снизить риск
    // перезаписи данных, если сотрудник отмечался с другого устройства
    const fresh = await loadAttendance();
    if(Array.isArray(fresh)) logs = fresh;
    const rec = {empId, type: isCheckedIn(empId) ? 'out' : 'in', ts: Date.now()};
    const ok = await storeSet(attKey(rec), rec, SHARED);
    if(ok) logs.push(rec);
    else showToast('Отметка не сохранилась. Проверьте связь и время на телефоне, затем нажмите ещё раз', 'error');
  } finally {
    punchInFlight = false;
  }
  renderNow();
}

// ── Автозакрытие забытых смен ──────────────────────────────────────────────
// Смена, которую не закрыли, закрывается сама в 23:00 того дня, когда она началась
// (а если её начали уже после 23:00 — в ближайшие следующие 23:00).
// Время уходит в журнал именно как 23:00, а не как момент обнаружения, поэтому
// отработанные часы не раздуваются, даже если приложение открыли только утром.
// Время берётся с устройства (для команды в одном часовом поясе это то же самое).
const AUTO_CLOSE_HOUR = 23;
function autoCloseCutoffAfter(ts){
  const d = new Date(ts);
  d.setHours(AUTO_CLOSE_HOUR, 0, 0, 0);
  if(d.getTime() <= ts) d.setDate(d.getDate() + 1);
  return d.getTime();
}
function staleOpenShifts(now){
  const lastByEmp = {};
  logs.forEach(l=>{
    const p = lastByEmp[l.empId];
    if(!p || l.ts >= p.ts) lastByEmp[l.empId] = l;
  });
  const res = [];
  Object.keys(lastByEmp).forEach(empId=>{
    const l = lastByEmp[empId];
    if(l.type === 'in'){
      const cutoff = autoCloseCutoffAfter(l.ts);
      if(cutoff <= now) res.push({empId, ts: cutoff});
    }
  });
  return res;
}
let autoCloseInFlight = false;
async function autoCloseStaleShifts(){
  if(autoCloseInFlight || !stateLoaded) return;
  if(!staleOpenShifts(Date.now()).length) return;   // быстрая проверка без сети
  autoCloseInFlight = true;
  try{
    // Перед записью берём самые свежие логи: смену мог закрыть другой экран.
    // Если прочитать не удалось — ничего не пишем, чтобы не затереть данные.
    const fresh = await loadAttendance();
    if(!Array.isArray(fresh)) return;
    logs = fresh;
    const stale = staleOpenShifts(Date.now());
    if(!stale.length) return;
    for(const x of stale){
      const rec = {empId:x.empId, type:'out', ts:x.ts, auto:true};
      if(await storeSet(attKey(rec), rec, SHARED)) logs.push(rec);
    }
    if(myEmployeeId && stale.some(x=>x.empId===myEmployeeId)){
      showToast('Смена закрыта автоматически в 23:00. Не забывайте нажимать END', 'error');
    }
    renderNow();
  } finally {
    autoCloseInFlight = false;
  }
}

function parseCSV(text, keepEmpty){
  const rows = []; let row = []; let field=''; let inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQuotes=false; }
      else field+=c;
    } else {
      if(c==='"') inQuotes=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c==='\r'){ /* skip */ }
      else field+=c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  if(keepEmpty){
    // пустые строки оставляем, чтобы номер в массиве = номер строки в таблице; хвост срезаем
    while(rows.length && !rows[rows.length-1].some(c=>c.trim()!=='')) rows.pop();
    return rows;
  }
  return rows.filter(r=> r.some(c=>c.trim()!==''));
}

function parseNum(s){
  if(s===null || s===undefined) return 0;
  let t = String(s).replace(/[^\d.,\-]/g,'');
  if(t==='') return 0;
  // «1.500.000» или «1,500,000» — несколько одинаковых разделителей = разряды
  if((t.match(/\./g)||[]).length > 1 && !t.includes(',')) t = t.replace(/\./g,'');
  if((t.match(/,/g)||[]).length > 1 && !t.includes('.')) t = t.replace(/,/g,'');
  if(t.includes(',') && t.includes('.')){
    if(t.lastIndexOf(',') > t.lastIndexOf('.')){ t = t.replace(/\./g,'').replace(',', '.'); }
    else { t = t.replace(/,/g,''); }
  } else if(t.includes(',')){
    t = t.replace(',', '.');
  }
  const n = parseFloat(t);
  return isNaN(n) ? 0 : Math.round(n);
}

// Конвертирует любую ссылку на Google Sheets в gviz JSON URL (надёжнее CSV).
// Поддерживает: ссылки на редактирование (/d/ID/edit), опубликованные (/d/e/2PACX.../pub),
// и уже готовые gviz-ссылки.
function toGvizUrl(url, sheetName){
  url = (url||'').trim();
  const gidMatch = url.match(/gid=([0-9]+)/);
  const gid = gidMatch ? gidMatch[1] : null;

  // Обычная ссылка на редактирование: .../spreadsheets/d/ID/edit
  const editMatch = url.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
  if(editMatch){
    const id = editMatch[1];
    let q = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:json`;
    if(sheetName) q += `&sheet=${encodeURIComponent(sheetName)}`;
    else if(gid) q += `&gid=${gid}`;
    return q;
  }

  // Опубликованная ссылка .../d/e/2PACX.../pub — извлекаем ID документа через отдельный fetch невозможен,
  // поэтому для таких ссылок оставляем CSV как fallback
  return null;
}

// Конвертирует ссылку в CSV URL (fallback для опубликованных ссылок)
function toCsvUrl(url){
  url = (url||'').trim();
  const gidMatch = url.match(/gid=([0-9]+)/);
  const gid = gidMatch ? gidMatch[1] : '0';
  const editMatch = url.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)\/edit/);
  if(editMatch){
    return `https://docs.google.com/spreadsheets/d/${editMatch[1]}/export?format=csv&gid=${gid}`;
  }
  const pubMatch = url.match(/\/spreadsheets\/d\/e\/([a-zA-Z0-9-_]+)/);
  if(pubMatch){
    return `https://docs.google.com/spreadsheets/d/e/${pubMatch[1]}/pub?gid=${gid}&single=true&output=csv`;
  }
  return url;
}

// Парсит ответ gviz JSON в массив строк (аналог parseCSV)
function parseGvizJson(text){
  // Google оборачивает JSON в /*O_o*/\ngoogle.visualization.Query.setResponse({...});
  const m = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
  if(!m) throw new Error('Неверный формат ответа Google Sheets');
  const data = JSON.parse(m[1]);
  const table = data.table;
  if(!table || !table.cols) throw new Error('Таблица пустая');

  // Заголовки
  const header = table.cols.map(c => (c.label || c.id || '').trim());
  const rows = [header];

  // Строки данных
  for(const row of (table.rows||[])){
    const cells = (row.c||[]).map(cell => {
      if(!cell || cell.v === null || cell.v === undefined) return '';
      // Даты Google возвращает как Date(year,month,day) — month 0-based
      if(typeof cell.v === 'string' && cell.v.startsWith('Date(')){
        const dm = cell.v.match(/Date\((\d+),(\d+),(\d+)\)/);
        if(dm){
          const d = String(dm[3]).padStart(2,'0');
          const mo = String(Number(dm[2])+1).padStart(2,'0');
          return `${d}.${mo}.${dm[1]}`;
        }
      }
      // Форматированное значение предпочтительнее сырого (сохраняет ₸ и пробелы)
      return cell.f !== undefined && cell.f !== null ? String(cell.f) : String(cell.v);
    });
    rows.push(cells);
  }
  return rows;
}

// Универсальный fetch: сначала пробует gviz JSON, при неудаче — CSV.
// forceCsv=true для «дашборд»-листов (трекер): там нет шапки таблицы,
// подписи разбросаны по ячейкам, и gviz съедает первую строку как заголовок.
async function fetchSheetRows(url, forceCsv, keepEmpty){
  if(!forceCsv){
    const gvizUrl = toGvizUrl(url);
    if(gvizUrl){
      try{
        const res = await fetch(gvizUrl, {cache:'no-store'});
        if(!res.ok) throw new Error('HTTP ' + res.status);
        const text = await res.text();
        return parseGvizJson(text);
      }catch(e){
        console.warn('gviz failed, falling back to CSV:', e.message);
      }
    }
  }
  // Fallback / принудительный путь: CSV — он отдаёт сетку ячеек как есть
  const csvUrl = toCsvUrl(url);
  const text = await fetchCsvWithRetry(csvUrl);
  return parseCSV(text, keepEmpty);
}

// Проверка, относится ли строка таблицы к нужному месяцу по колонке даты.
// Если дата пустая — строка не отбрасывается (так было и раньше).
// Месяц ('ГГГГ-ММ') из даты в ячейке. Понимает 05.10.2026, 5.10.26, 05/10/2026,
// 05-10-2026 и 2026-10-05. Не распознали — null.
function sheetDateMonth(str){
  const t = String(str||'').trim();
  if(!t) return null;
  let m = t.match(/^(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
  if(m) return Number(m[2])>=1 && Number(m[2])<=12 ? m[1] + '-' + String(Number(m[2])).padStart(2,'0') : null;
  m = t.match(/^(\d{1,2})\s*[.\-\/]\s*(\d{1,2})\s*[.\-\/]\s*(\d{2,4})/);
  if(!m) return null;
  const mo = Number(m[2]); if(mo<1 || mo>12) return null;
  const y = m[3].length===2 ? '20' + m[3] : m[3];
  return y + '-' + String(mo).padStart(2,'0');
}
// Строка относится к месяцу по колонке даты. Строку без даты считаем только
// в текущем месяце (раньше она попадала во ВСЕ месяцы сразу и раздувала цифры).
function rowInMonth(row, dateCol, targetMonth){
  if(dateCol<0) return true;
  const raw = String(row[dateCol]||'').trim();
  if(!raw) return targetMonth === currentMonthKey();
  return sheetDateMonth(raw) === targetMonth;
}
// Сравнение имени из таблицы с именем сотрудника: регистр, ё/е, лишние пробелы,
// точки («Алишер А.» = «Алишер А»), латинские буквы-двойники (A, E, O, C…).
const LAT2CYR = {a:'а',b:'в',c:'с',e:'е',h:'н',k:'к',m:'м',o:'о',p:'р',t:'т',x:'х',y:'у'};
function normName(s){
  let t = String(s||'').toLowerCase().replace(/ё/g,'е').replace(/[.\u00a0]/g,' ').replace(/\s+/g,' ').trim();
  // латиницу заменяем только в «смешанных» именах — чисто латинские не трогаем
  if(/[а-я]/.test(t) && /[a-z]/.test(t)) t = t.replace(/[a-z]/g, ch => LAT2CYR[ch] || ch);
  return t;
}
// Своя ли вкладка у месяца. Если ссылка (таблица + вкладка gid) указана только
// для этого месяца — вкладка и есть месяц: считаем ВСЕ её строки, даты не смотрим.
// Раньше строки сентябрьской вкладки со сдачей/датой в октябре выпадали из
// сентября, а в октябре их тоже не было — октябрь читается из своей вкладки.
// Даты нужны, только если одна и та же вкладка указана для нескольких месяцев.
function sheetTabKey(url){
  const u = String(url||'');
  const id = (u.match(/\/spreadsheets\/d\/(?:e\/)?([a-zA-Z0-9-_]+)/)||[])[1];
  if(!id) return u.trim();
  return id + '#' + ((u.match(/gid=([0-9]+)/)||[])[1] || '0');
}
function isDedicatedTab(dept, mk){
  const key = sheetTabKey(getSheetUrl(dept, mk));
  if(!key) return false;
  return !Object.keys(sheetUrls).some(m=> m!==mk && ['op','to'].some(d=> sheetTabKey(getSheetUrl(d, m))===key));
}
// Отменённые и возвратные заказы в личные продажи и заказы не идут
function isCancelledStatus(st){ return /отмен|возврат|отказ/.test(String(st||'').toLowerCase()); }
// Месяц, к которому относится заказ ТО: месяц сдачи (дедлайна), а если его нет —
// месяц оформления. Раньше заказ мог посчитаться и там и там — дважды.
function toOrderMonth(row, dateCol, deadlineCol){
  const dl = deadlineCol>=0 ? sheetDateMonth(row[deadlineCol]) : null;
  if(dl) return dl;
  if(dateCol<0) return currentMonthKey();
  const raw = String(row[dateCol]||'').trim();
  return raw ? sheetDateMonth(raw) : currentMonthKey();
}

// ---------------------------------------------------------------------
// Трекер тенденции — не список сделок, а «дашборд»-таблица с готовыми
// подписанными ячейками (Цель месяца, Тенденция, Дата сегодня, Раб дней…).
// Ищем нужные значения по подписям, а не по фиксированным координатам,
// чтобы не сломаться при небольших правках макета таблицы.
function findLabelCell(grid, label){
  const target = label.toLowerCase();
  for(let r=0;r<grid.length;r++){
    for(let c=0;c<grid[r].length;c++){
      if((grid[r][c]||'').toLowerCase().trim().startsWith(target)) return {r,c};
    }
  }
  return null;
}

function parseTrackerGrid(grid){
  const result = {};

  const goalPos = findLabelCell(grid, 'цель месяца');
  if(goalPos) result.monthGoal = parseNum(grid[goalPos.r][goalPos.c+1]);

  // Блок: Дата сегодня | Месяц | Остаток дней | План | Сейчас сумма | Должно быть сейчас | Тенденция | Разница
  const todayPos = findLabelCell(grid, 'дата сегодня');
  if(todayPos){
    const headerRow = grid[todayPos.r].map(h=>(h||'').toLowerCase());
    const dataRow = grid[todayPos.r+1] || [];
    const col = (label)=> headerRow.findIndex(h=>h.includes(label));
    const get = (label)=>{ const i = col(label); return i>=0 ? dataRow[i] : ''; };
    result.dayToday = parseNum(get('дата сегодня'));
    result.daysLeft = parseNum(get('остаток дней'));
    result.plan = parseNum(get('план'));
    result.currentSum = parseNum(get('сейчас сумма'));
    result.shouldBeNow = parseNum(get('должно быть'));
    result.trendPct = parseNum(get('тенденция'));
    result.diff = parseNum(get('разница'));
  }

  // Блок: Сумма (сколько осталось) | Раб дней | В день нужно делать
  const workPos = findLabelCell(grid, 'раб дней');
  if(workPos){
    const headerRow = grid[workPos.r].map(h=>(h||'').toLowerCase());
    const dataRow = grid[workPos.r+1] || [];
    const col = (label)=> headerRow.findIndex(h=>h.includes(label));
    const get = (label)=>{ const i = col(label); return i>=0 ? dataRow[i] : ''; };
    result.remainingToPlan = parseNum(get('сумма'));
    result.workDaysLeft = parseNum(get('раб дней'));
    result.dailyTargetNeeded = parseNum(get('в день'));
  }

  const hasCore = result.plan>0 && (todayPos!==null);
  if(!hasCore) return null;

  const effectivePlan = result.monthGoal || result.plan;
  // Прогноз к концу месяца — берём готовый % тенденции из таблицы, а не считаем сами
  result.forecastTotal = effectivePlan>0 ? Math.round(effectivePlan * (result.trendPct/100)) : 0;
  result.forecastPct = result.trendPct;
  result.effectivePlan = effectivePlan;
  return result;
}

// ---------------------------------------------------------------------
// Лист «Касса»: никакой логики — просто складываем колонку G (чистая касса)
// и колонку H (висит остаток) по всем строкам листа.
// ---------------------------------------------------------------------
async function syncCashSheet(mk, silent){
  mk = mk || editingMonth;
  const rawUrl = (cashUrls[mk]||'').trim();
  if(!rawUrl){ if(!silent){ cashStatus[mk] = 'Сначала вставьте ссылку на лист'; showToast(cashStatus[mk],'error'); } return; }
  if(!silent){ cashSyncing[mk] = true; cashStatus[mk] = ''; render(); }
  try{
    const rows = await fetchSheetRows(rawUrl, true); // CSV — сетка как есть, без домыслов про шапку
    if(!rows.length) throw new Error('Лист пустой или не найден');

    // По умолчанию — колонки G и H (7-я и 8-я). Если в шапке есть
    // «Предоплата» и «Остаток» — берём их, так надёжнее при сдвиге колонок.
    let prepaidIdx = 6, pendingIdx = 7;
    const header = (rows[0]||[]).map(h=>String(h||'').trim().toLowerCase());
    const findIdx = (p)=> header.findIndex(h=>h.includes(p));
    const pIdx = findIdx('предоплат'), oIdx = findIdx('остаток');
    if(pIdx>=0) prepaidIdx = pIdx;
    if(oIdx>=0) pendingIdx = oIdx;

    // ИСПРАВЛЕНО: String.fromCharCode(65+i) ломался на колонке 27+ (выдавал «[», «\\»…)
    const colLetter = (i)=>{ let s='', n=i; while(n>=0){ s=String.fromCharCode(65+(n%26))+s; n=Math.floor(n/26)-1; } return s; };
    let prepaid = 0, pending = 0, counted = 0;
    for(let r=1;r<rows.length;r++){
      const row = rows[r] || [];
      const p = parseNum(row[prepaidIdx]);
      const o = parseNum(row[pendingIdx]);
      if(p===0 && o===0) continue;
      prepaid += p; pending += o; counted++;
    }

    // Защита от обнуления: пустой ответ не затирает прошлые цифры
    const prev = cashTotals[mk];
    if(counted===0 && prev && (prev.prepaid>0 || prev.pending>0)){
      if(!silent){ cashStatus[mk] = 'Лист вернулся пустым — оставил прошлые цифры'; showToast(cashStatus[mk],'error'); cashSyncing[mk]=false; render(); }
      return;
    }

    cashTotals[mk] = {
      prepaid, pending, rows: counted,
      prepaidLabel: `${colLetter(prepaidIdx)}${header[prepaidIdx]?` («${rows[0][prepaidIdx]}»)`:''}`,
      pendingLabel: `${colLetter(pendingIdx)}${header[pendingIdx]?` («${rows[0][pendingIdx]}»)`:''}`,
    };
    { const m = await saveMerged('app:cashTotals', cashTotals, [[mk]]); if(m) cashTotals = Object.assign({}, cashTotals, m); }
    // ссылку здесь больше не пишем: она сохраняется при вводе — иначе старая копия затирала чужие ссылки
    lastCashSyncAt[mk] = Date.now();
    if(!silent){ cashStatus[mk] = `Посчитано по ${counted} строк(-е)`; showToast(cashStatus[mk],'success'); }
  } catch(err){
    if(!silent){ cashStatus[mk] = 'Не получилось: ' + err.message; showToast(cashStatus[mk],'error'); }
  }
  if(!silent){ cashSyncing[mk] = false; render(); }
  else render();
}

async function syncTracker(mk, silent){
  mk = mk || editingMonth;
  const rawUrl = (trackerUrls[mk]||'').trim();
  if(!rawUrl){ if(!silent){ trackerStatus[mk] = 'Сначала вставьте ссылку на трекер'; showToast(trackerStatus[mk], 'error'); } return; }
  if(!silent){ trackerSyncing[mk] = true; trackerStatus[mk] = ''; render(); }
  try{
    const rows = await fetchSheetRows(rawUrl, true); // трекер — сетка ячеек, читаем через CSV
    if(rows.length < 2) throw new Error('Таблица пустая или не найдена');
    const grid = rows.map(r=>r.map(c=>String(c||'').trim()));
    const parsed = parseTrackerGrid(grid);
    if(!parsed) throw new Error('Не нашёл нужные подписи в таблице (Цель месяца / Дата сегодня)');
    // Защита от обнуления: пустой разбор не должен затирать последние хорошие цифры
    const prevTd = trackerData[mk];
    const parsedEmpty = !parsed.effectivePlan && !parsed.currentSum;
    if(parsedEmpty && prevTd && (prevTd.effectivePlan || prevTd.currentSum)){
      if(!silent){ trackerStatus[mk] = 'Трекер вернулся пустым — оставил прошлые цифры'; showToast(trackerStatus[mk], 'error'); trackerSyncing[mk] = false; render(); }
      return;
    }
    trackerData[mk] = parsed;
    { const m = await saveMerged('app:trackerData', trackerData, [[mk]]); if(m) trackerData = m; }
    lastTrackerSyncAt[mk] = Date.now();
    if(!silent){ trackerStatus[mk] = 'Данные обновлены'; showToast(trackerStatus[mk], 'success'); }
  } catch(err){
    const hint = /failed to fetch/i.test(err.message)
      ? ' — проверьте, что таблица открыта для просмотра (Настройки доступа → Все у кого есть ссылка) и ссылка вставлена целиком'
      : '';
    if(!silent){ trackerStatus[mk] = 'Не получилось: ' + err.message + hint; showToast(trackerStatus[mk], 'error'); }
  }
  if(!silent){ trackerSyncing[mk] = false; render(); }
  else if(mode==='employee'){
    render();
    setTimeout(() => slotRoll(document.getElementById('main')), 80);
  }
}

// Публичный CSV-экспорт гугл-таблиц иногда отвечает ошибкой без видимой причины
// (не наша ошибка, а особенность самого Google) — поэтому пробуем ещё пару раз
// с небольшой паузой, прежде чем показать ошибку пользователю.
async function fetchCsvWithRetry(url, attempts){
  attempts = attempts || 3;
  let lastErr;
  for(let i=0;i<attempts;i++){
    try{
      const res = await fetch(url, {cache:'no-store'});
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      if(!text || !text.trim()) throw new Error('Пустой ответ');
      return text;
    }catch(err){
      lastErr = err;
      if(i<attempts-1) await new Promise(r=>setTimeout(r, 700*(i+1)));
    }
  }
  throw lastErr;
}

// Чтение листа продаж/заказов. Сначала CSV-выгрузка: она отдаёт ячейки как есть.
// Прежний способ (gviz) сам угадывает тип колонки и молча отдаёт ПУСТЫМИ ячейки
// «не того» типа — например, суммы, набранные текстом («15 000 тг») в колонке,
// где остальные — числа. Так терялись суммы и даты. gviz — запасной вариант.
// Плюс ищем строку шапки в первых 15 строках: над ней бывает название или пустая строка.
const LEDGER_HEAD_KEYS = ['кто продал','кто делает','сумма','статус','дата','имя'];
async function fetchLedgerRows(url){
  let rows = null, via = 'csv';
  try{
    rows = await fetchSheetRows(url, true, true);
    if(rows && rows.length && /^\s*</.test(String((rows[0]||[])[0]||''))) rows = null; // вместо таблицы пришла страница входа
  }catch(e){ rows = null; }
  if(!rows || rows.length < 2){ via = 'gviz'; rows = await fetchSheetRows(url); }
  let best = 0, bestScore = -1;
  for(let i=0; i<Math.min(rows.length, 15); i++){
    const sc = (rows[i]||[]).reduce((a,c)=> a + (LEDGER_HEAD_KEYS.some(k=>String(c||'').toLowerCase().includes(k)) ? 1 : 0), 0);
    if(sc > bestScore){ bestScore = sc; best = i; }
  }
  const out = rows.slice(best).map(r=> (r||[]).map(c=> String(c==null ? '' : c)));
  // rowOffset: сколько строк над шапкой. Номер строки в таблице = r + rowOffset + 1.
  // Номер заказа строим от него же — при шапке в первой строке он совпадает с прежним,
  // поэтому паузы, комментарии и статусы сотрудников остаются на своих заказах.
  out.headerRow = best + 1; out.rowOffset = best; out.via = via;
  return out;
}

async function syncFromGoogleSheet(dept, targetMonth, silent){
  targetMonth = targetMonth || editingMonth;
  const key = dept + '_' + targetMonth;
  const rawUrl = getSheetUrl(dept, targetMonth);
  if(!rawUrl){ if(!silent) syncStatus[key] = 'Сначала вставьте ссылку на таблицу'; return; }
  if(!silent){ syncing[key] = true; syncStatus[key] = ''; render(); }
  try{
    const rows = await fetchLedgerRows(rawUrl);
    if(rows.length < 2) throw new Error('Таблица пустая или не найдена');

    const header = rows[0].map(h=>h.trim());
    const hl = header.map(h=>h.toLowerCase());
    // ИСПРАВЛЕНО: раньше искали первую КОЛОНКУ, подходящую под ЛЮБОЙ шаблон.
    // Из-за этого findCol(['дата оформления','дата']) мог поймать «Дата сдачи»,
    // если она стоит в таблице левее «Даты оформления» — и весь месяц считался не по той дате.
    // Теперь шаблоны перебираются по приоритету: сначала ищем точный, потом общий.
    const findCol = (patterns)=>{
      for(const p of patterns){
        const i = hl.findIndex(h=> h.includes(p));
        if(i>=0) return i;
      }
      return -1;
    };

    const sellerCol = findCol(['кто продал']);
    const doerCol = findCol(['кто делает']);
    const statusCol = findCol(['статус']);
    const grossCol = findCol(['сумма общая','сумма']);
    const prepayCol = findCol(['предоплат']);
    const netCol = findCol(['заработок']);
    const pendingCol = findCol(['остаток']);
    const dateCol = findCol(['дата оформления','дата']);
    const isRawLedger = sellerCol>=0 || doerCol>=0;
    // Своя вкладка у месяца — все строки этого месяца; общая — по датам (см. isDedicatedTab)
    const wholeTab = isDedicatedTab(dept, targetMonth);
    const inThisMonth = row => wholeTab || rowInMonth(row, dateCol, targetMonth);

    ensureMonth(targetMonth);
    const deptEmployees = employees.filter(e=>e.department===dept);
    let matched = 0;

    const colLetter = (idx)=>{ if(idx<0) return null; let s='', n=idx; while(n>=0){ s=String.fromCharCode(65+(n%26))+s; n=Math.floor(n/26)-1; } return s; };
    const colInfo = (idx)=> idx<0 ? 'не найдена' : `«${header[idx]}» (кол. ${colLetter(idx)})`;

    if(isRawLedger){
      const actorCol = dept==='op' ? sellerCol : doerCol;
      if(actorCol<0) throw new Error('Не нашёл колонку «' + (dept==='op'?'Кто продал':'Кто делает') + '»');

      // Диагностика: какие колонки реально нашлись — чтобы можно было проверить,
      // не перепутала ли программа колонку, не открывая саму таблицу.
      const diag = {
        actorLabel: dept==='op' ? 'исполнитель (Кто продал)' : 'исполнитель (Кто делает)',
        actor: colInfo(actorCol),
        status: colInfo(statusCol),
        gross: colInfo(grossCol),
        pending: colInfo(pendingCol),
        date: colInfo(dateCol),
        totalRowsInSheet: rows.length-1,
      };

      // Касса компании считается напрямую по колонкам таблицы, по всей таблице целиком:
      // «Сумма общая» → грязная касса; «Сумма общая» при статусе «успешно завершено» → чистая;
      // готовая колонка «Остаток» → остаток (ещё войдёт). Ничего дополнительно не выводим.
      let ledgerGross = 0, ledgerNet = 0, ledgerPending = 0, ledgerCount = 0, ledgerUnmatched = 0;
      let ledgerPrepaid = 0; // «Предоплата» — деньги, которые реально зашли
      // Итоги по ВСЕЙ таблице за месяц, без привязки к исполнителю:
      // касса компании должна видеть все строки, даже те, где мультфильм ещё никому не отдан.
      let allPrepaid = 0, allPending = 0, allGross = 0, allRows = 0;
      const unmatchedNames = new Set();
      for(let r=1;r<rows.length;r++){
        const row = rows[r];
        if(!inThisMonth(row)) continue;

        const grossVal = grossCol>=0 ? parseNum(row[grossCol]) : 0;
        const pendingVal = pendingCol>=0 ? parseNum(row[pendingCol]) : 0;
        const prepayVal = prepayCol>=0 ? parseNum(row[prepayCol]) : 0;

        // Строка считается «живой», если в ней есть хоть какие-то деньги
        if(grossVal>0 || prepayVal>0 || pendingVal>0){
          allGross += grossVal; allPrepaid += prepayVal; allPending += pendingVal; allRows++;
        }

        const actor = normName(row[actorCol]);
        if(!actor || actor==='-' || actor==='—' || actor==='–' || actor==='n/a') continue; // строка вообще не про этот отдел (исполнитель не указан) — не считаем её сюда
        const statusText = statusCol>=0 ? (row[statusCol]||'').toLowerCase() : '';
        const isDone = statusText.includes('успешно');
        ledgerGross += grossVal;
        if(isDone) ledgerNet += grossVal;
        ledgerPending += pendingVal;
        ledgerPrepaid += prepayVal;
        ledgerCount++;
        if(!deptEmployees.some(e=>normName(e.name)===actor)){
          ledgerUnmatched++;
          if(unmatchedNames.size<5) unmatchedNames.add((row[actorCol]||'').trim());
        }
      }
      diag.prepay = colInfo(prepayCol);
      diag.rowsInMonth = ledgerCount;
      diag.unmatchedNames = Array.from(unmatchedNames);

      // Защита от обнуления: если таблица за этот месяц вернулась пустой,
      // а раньше данные были — оставляем прошлые цифры, а не затираем нулями.
      const prevEntry = (ledgerTotals[targetMonth]||{})[dept];
      if(allRows===0 && prevEntry && (prevEntry.allGross>0 || prevEntry.gross>0)){
        if(!silent) syncStatus[key] = 'Таблица вернулась пустой — оставил прошлые цифры';
        if(!silent){ syncing[key] = false; render(); }
        return;
      }

      if(!ledgerTotals[targetMonth]) ledgerTotals[targetMonth] = {};
      ledgerTotals[targetMonth][dept] = {
        net: ledgerNet, pending: ledgerPending, gross: ledgerGross, prepaid: ledgerPrepaid,
        allPrepaid, allPending, allGross, allRows,
        count: ledgerCount, unmatched: ledgerUnmatched, diag
      };

      // deadlineCol уже объявлен ниже в блоке парсинга ordersData — объявляем здесь заранее для ТО KPI
      const _deadlineColForKpi = dept==='to' ? findCol(['дата сдачи','дедлайн','срок']) : -1;

      for(const emp of deptEmployees){
        const nameLc = normName(emp.name);
        let orders=0, completed=0, netAmount=0, pending=0, revenue=0, deals=0, actualCash=0;
        for(let r=1;r<rows.length;r++){
          const row = rows[r];
          if(normName(row[actorCol]) !== nameLc) continue;
          // Своя вкладка месяца — все строки; общая на несколько месяцев — по датам:
          // ОП по дате оформления, ТО по месяцу сдачи (или оформления, если срока нет)
          const rowBelongsToMonth = wholeTab || (dept==='to'
            ? toOrderMonth(row, dateCol, _deadlineColForKpi) === targetMonth
            : rowInMonth(row, dateCol, targetMonth));
          if(!rowBelongsToMonth) continue;

          const statusText = statusCol>=0 ? (row[statusCol]||'').toLowerCase() : '';
          if(isCancelledStatus(statusText)) continue;
          const isDone = statusText.includes('успешно');
          const grossVal = grossCol>=0 ? parseNum(row[grossCol]) : 0;
          if(dept==='to'){
            orders++;
            if(isDone){
              completed++;
              netAmount += grossVal; // чистая касса — «Сумма общая» только по успешно завершённым
            } else {
              pending += grossVal; // остаток — «Сумма общая» по НЕ завершённым (по статусу)
            }
          } else {
            deals++;
            revenue += grossVal; // выручка ОП — вся «Сумма общая», без учёта статуса
            if(isDone) actualCash += grossVal; // касса по факту — только успешно завершённые
          }
        }
        const values = getKpi(emp.id, targetMonth);
        // Раньше здесь была «защита»: если по сотруднику не нашлось строк, оставлялись
        // старые цифры. Из-за неё после переименования или переноса строк сотрудник
        // навсегда зависал со старыми цифрами. Пустая таблица целиком уже отсекается выше.
        if(dept==='to'){
          values.orders = orders; values.completed = completed; values.netAmount = netAmount;
          values.pending = pending; values.avgCheck = completed>0 ? Math.round(netAmount/completed) : 0;
        } else {
          values.deals = deals; values.revenue = revenue; values.actualCash = actualCash;
        }
        kpiData[targetMonth][emp.id] = values;
        if(orders>0 || deals>0) matched++;
      }

      // ---- Парсим активные заказы для блока «Текущие заказы» (только ТО) ----
      if(dept === 'to'){
        // Дополнительные колонки из таблицы
        const nameCol     = findCol(['имя','name']);
        const clientCol   = nameCol >= 0 ? nameCol : 0; // Имя клиента — первая колонка
        const deadlineCol = findCol(['дата сдачи','дедлайн','срок']);
        const payMethodCol= findCol(['метод оплаты','способ оплаты','оплата']);
        const prepayCol   = findCol(['предоплат']);
        const contactPlaceCol = findCol(['место общения','мессенджер','канал связи','платформа']);
        const notesCol    = findCol(['примечани','заметк']);
        const phoneCol    = findCol(['телефон','номер телефона','phone','номер для связи']);
        const durationCol = findCol(['\u0434\u043b\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0441\u0442']);

        const newOrdersData = {};
        for(const emp of deptEmployees){
          const nameLc = normName(emp.name);
          const empOrders = [];
          for(let r=1;r<rows.length;r++){
            const row = rows[r];
            if(normName(row[actorCol]) !== nameLc) continue;
            const statusRaw = statusCol>=0 ? (row[statusCol]||'').trim() : '';
            const isDone = statusRaw.toLowerCase().includes('успешно');
            const deadlineStr= deadlineCol>=0 ? (row[deadlineCol]||'').trim() : '';
            const dateCreated= dateCol>=0 ? (row[dateCol]||'').trim() : '';

            // Для активных заказов: показываем строку если:
            // 1) Заказ создан в этом месяце (targetMonth), ИЛИ
            // 2) Заказ ещё не завершён И срок сдачи (deadline) попадает в targetMonth или позже
            const createdInMonth = inThisMonth(row);
            const deadlineInMonthOrLater = (() => {
              const deadlineMk = sheetDateMonth(deadlineStr);
              return !!deadlineMk && deadlineMk >= targetMonth;
            })();
            if(!createdInMonth && !(deadlineInMonthOrLater && !isDone)) continue;

            const clientName = clientCol>=0 ? (row[clientCol]||'').trim() : '';
            const grossVal   = grossCol>=0  ? parseNum(row[grossCol])  : 0;
            const pendingVal = pendingCol>=0 ? parseNum(row[pendingCol]): 0;
            const prepayVal  = prepayCol>=0  ? parseNum(row[prepayCol]) : 0;
            const payMethod  = payMethodCol>=0 ? (row[payMethodCol]||'').trim() : '';
            const contactPlace = contactPlaceCol>=0 ? (row[contactPlaceCol]||'').trim() : '';
            const notes      = notesCol>=0 ? (row[notesCol]||'').trim() : '';
            const phone      = phoneCol>=0 ? (row[phoneCol]||'').trim() : '';
            const duration   = durationCol>=0 ? (row[durationCol]||'').trim() : '';

            // Уникальный ID заказа: строка в таблице (r) + имя клиента
            const orderId = `r${r + (rows.rowOffset||0)}-${emp.id}`;

            // statusSince: берём из существующего ordersData если статус не изменился,
            // иначе — сейчас (точное время неизвестно из CSV)
            const existing = ((ordersData[targetMonth]&&ordersData[targetMonth][emp.id])||[]).find(o=>o.id===orderId);
            const statusSince = (existing && existing.status === statusRaw)
              ? existing.statusSince
              : Date.now();

            empOrders.push({
              id: orderId,
              client: clientName,
              status: statusRaw,
              statusSince,
              gross: grossVal,
              pending: pendingVal,
              prepay: prepayVal,
              payMethod,
              deadline: deadlineStr,
              dateCreated,
              isDone,
              contactPlace,
              notes,
              phone,
              duration,
            });
          }
          newOrdersData[emp.id] = empOrders;
        }
        // Мёрджим: обновляем ordersData[targetMonth] данными из CSV
        if(!ordersData[targetMonth]) ordersData[targetMonth] = {};
        Object.assign(ordersData[targetMonth], newOrdersData);
        { const m = await saveMerged('app:ordersData', ordersData, deptEmployees.map(e=>[targetMonth, e.id])); if(m) ordersData = m; }
      }

    } else {
      const nameIdx = header.findIndex(h=>/имя|name/i.test(h));
      const idx = nameIdx>=0 ? nameIdx : 0;
      const fieldCols = {};
      DEPARTMENTS[dept].fields.filter(f=>!f.computed).forEach(f=>{
        const colIndex = header.findIndex((h,ci)=>{
          if(ci===idx) return false;
          const hlow = h.toLowerCase();
          const m = f.match.some(mm=>hlow.includes(mm));
          const ex = (f.exclude||[]).some(mm=>hlow.includes(mm));
          return m && !ex;
        });
        if(colIndex>=0) fieldCols[f.key] = colIndex;
      });
      for(let r=1;r<rows.length;r++){
        const row = rows[r];
        const name = (row[idx]||'').trim();
        if(!name) continue;
        const emp = deptEmployees.find(e=>normName(e.name)===normName(name));
        if(!emp) continue;
        const values = getKpi(emp.id, targetMonth);
        Object.keys(fieldCols).forEach(fk=>{
          const raw = row[fieldCols[fk]];
          const fieldDef = DEPARTMENTS[dept].fields.find(f=>f.key===fk);
          values[fk] = fieldDef.type==='number' ? parseNum(raw) : (raw||'').trim();
        });
        kpiData[targetMonth][emp.id] = values;
        matched++;
      }
    }

    // ---- Парсим активные заказы для блока «Текущие заказы» (ОП) ----
    // Логика идентична ТО: перебираем сотрудников ОП, для каждого ищем строки
    // где «Кто продал» (sellerCol) совпадает с именем сотрудника
    if(dept === 'op'){
      // sellerCol уже объявлен выше: findCol(['кто продал'])
      // Дополнительные колонки
      const opClientCol      = findCol(['имя','name']);
      const opClientColFinal = opClientCol >= 0 ? opClientCol : 0;
      const opContactCol     = findCol(['место общения','примечани','платформа','мессенджер','канал']);
      const opPhoneCol       = findCol(['номер для связи','телефон','номер телефона','phone']);
      const opPrepayCol      = findCol(['предоплат']);
      const opToWorkerCol    = findCol(['кто делает']);
      const opDurationCol    = findCol(['длительност']);
      const opPayMethodCol   = findCol(['метод оплаты','способ оплаты','оплата']);
      const opEarningCol     = findCol(['заработок']);
      const opDeadlineCol    = findCol(['дата сдачи','дедлайн','срок']);

      const newOrdersData = {};
      for(const emp of deptEmployees){
        const nameLc = normName(emp.name);
        const empOrders = [];
        for(let r=1; r<rows.length; r++){
          const row = rows[r];
          // Фильтр по колонке «Кто продал» — то же правило сравнения имён, что и в KPI
          if(normName(row[sellerCol]) !== nameLc) continue;
          // ОП: строго по дате оформления — каждый месяц считается отдельно
          if(!inThisMonth(row)) continue;

          const deadlineStr = opDeadlineCol>=0  ? (row[opDeadlineCol]||'').trim()      : '';
          const statusRaw   = statusCol>=0      ? (row[statusCol]||'').trim()         : '';
          const isDoneOp    = statusRaw.toLowerCase().includes('успешно');

          const clientName  =                     (row[opClientColFinal]||'').trim();
          const grossVal    = grossCol>=0       ? parseNum(row[grossCol])               : 0;
          const prepayVal   = opPrepayCol>=0    ? parseNum(row[opPrepayCol])            : 0;
          const pendingVal  = pendingCol>=0     ? parseNum(row[pendingCol])             : 0;
          const toWorker    = opToWorkerCol>=0  ? (row[opToWorkerCol]||'').trim()      : '';
          const duration    = opDurationCol>=0  ? (row[opDurationCol]||'').trim()      : '';
          const payMethod   = opPayMethodCol>=0 ? (row[opPayMethodCol]||'').trim()     : '';
          const earning     = opEarningCol>=0   ? parseNum(row[opEarningCol])           : 0;
          const contactPlace= opContactCol>=0   ? (row[opContactCol]||'').trim()       : '';
          const phone       = opPhoneCol>=0     ? (row[opPhoneCol]||'').trim()         : '';
          const dateCreated = dateCol>=0        ? (row[dateCol]||'').trim()            : '';

          const orderId = `r${r + (rows.rowOffset||0)}-${emp.id}`;
          const existing = ((ordersData[targetMonth]&&ordersData[targetMonth][emp.id])||[]).find(o=>o.id===orderId);
          const statusSince = (existing && existing.status === statusRaw)
            ? existing.statusSince : Date.now();

          empOrders.push({
            id: orderId,
            client: clientName,
            status: statusRaw,
            statusSince,
            gross: grossVal,
            prepay: prepayVal,
            pending: pendingVal,
            toWorker,
            duration,
            payMethod,
            deadline: deadlineStr,
            earning,
            contactPlace,
            phone,
            dateCreated,
            isDone: isDoneOp,
          });
        }
        newOrdersData[emp.id] = empOrders;
      }
      if(!ordersData[targetMonth]) ordersData[targetMonth] = {};
      Object.assign(ordersData[targetMonth], newOrdersData);
      { const m = await saveMerged('app:ordersData', ordersData, deptEmployees.map(e=>[targetMonth, e.id])); if(m) ordersData = m; }
    }

    // Пишем только этот месяц этого отдела — чужие месяцы и ссылки не трогаем
    { const m = await saveMerged('app:kpiData', kpiData, deptEmployees.map(e=>[targetMonth, e.id])); if(m) kpiData = m; }
    if(ledgerTotals[targetMonth] && ledgerTotals[targetMonth][dept]){
      const m = await saveMerged('app:ledgerTotals', ledgerTotals, [[targetMonth, dept]]); if(m) ledgerTotals = m;
    }
    lastSheetSyncAt[key] = Date.now();
    if(!silent){
      const lt = ledgerTotals[targetMonth] && ledgerTotals[targetMonth][dept];
      const sampleNames = (lt && lt.diag && lt.diag.unmatchedNames && lt.diag.unmatchedNames.length)
        ? ` Например: ${lt.diag.unmatchedNames.map(n=>'«'+n+'»').join(', ')}.`
        : '';
      const unmatchedNote = (lt && lt.unmatched>0) ? ` (${lt.unmatched} строк не сопоставлено с сотрудниками — на кассу компании это не влияет.${sampleNames})` : '';
      syncStatus[key] = matched>0
        ? `Обновлено ${matched} из ${deptEmployees.length} сотрудников${unmatchedNote}`
        : 'Никто не найден — проверьте, что имена в таблице совпадают с именами в приложении' + unmatchedNote;
      showToast(syncStatus[key], matched>0 ? 'success' : 'error');
    }
  } catch(err){
    const hint = /failed to fetch/i.test(err.message)
      ? ' — проверьте, что таблица открыта для просмотра (Настройки доступа → Все у кого есть ссылка) и ссылка вставлена целиком'
      : '';
    if(!silent){ syncStatus[key] = 'Не получилось: ' + err.message + hint; showToast(syncStatus[key], 'error'); }
  }
  if(!silent){ syncing[key] = false; render(); }
  else if(mode==='employee'){
    render();
    // тихое обновление данных — прогоняем слот-машину без смены экрана
    setTimeout(() => slotRoll(document.getElementById('main')), 80);
  }
}

async function silentAutoSync(){
  if(!stateLoaded) return; // нет связи с базой — не пишем ничего
  if(document.visibilityState === 'hidden' || appOutdated) return; // фоновая вкладка: данные в ней могут быть устаревшими
  try{
    if(getSheetUrl('op', activeMonth)) await syncFromGoogleSheet('op', activeMonth, true);
    if(getSheetUrl('to', activeMonth)) await syncFromGoogleSheet('to', activeMonth, true);
    if((trackerUrls[activeMonth]||'').trim()) await syncTracker(activeMonth, true);
    if((cashUrls[activeMonth]||'').trim()) await syncCashSheet(activeMonth, true);
    if(employees.some(e=>e.department==='os')) await syncOsData(activeMonth, true);
  }catch(e){ console.error('auto-sync failed', e); }
  syncHistoryMonths();
}

// Прошлые месяцы для «Истории по месяцам». Раньше автоматически пересчитывался
// только текущий месяц, а прошлые жили с цифрами последней ручной синхронизации —
// часто посчитанными ещё старой логикой или не посчитанными вовсе. Теперь при
// открытии приложения пересчитываем их из своих таблиц (раз в 6 часов на месяц).
const HISTORY_MONTHS = 6;
const HISTORY_RESYNC_MS = 6*60*60*1000;
let historySyncedAt = {};
let historySyncing = false;
function historyMonths(){
  const cur = currentMonthKey();
  return Object.keys(kpiData).filter(mk=> /^\d{4}-\d{2}$/.test(mk) && mk <= cur).sort().slice(-HISTORY_MONTHS);
}
async function syncHistoryMonths(){
  if(historySyncing || !stateLoaded || appOutdated || document.visibilityState === 'hidden') return;
  const todo = historyMonths().filter(mk=> mk !== activeMonth
    && (Date.now() - (historySyncedAt[mk]||0)) > HISTORY_RESYNC_MS
    && (getSheetUrl('op', mk) || getSheetUrl('to', mk) || (trackerUrls[mk]||'').trim() || (cashUrls[mk]||'').trim()));
  if(!todo.length) return;
  historySyncing = true;
  render();
  try{
    for(const mk of todo){
      try{
        // трекер и касса — раньше листов отделов: от них зависит план и выручка ОП (база плана ТО)
        if((trackerUrls[mk]||'').trim()) await syncTracker(mk, true);
        if((cashUrls[mk]||'').trim()) await syncCashSheet(mk, true);
        if(getSheetUrl('op', mk)) await syncFromGoogleSheet('op', mk, true);
        if(getSheetUrl('to', mk)) await syncFromGoogleSheet('to', mk, true);
        historySyncedAt[mk] = Date.now();
      }catch(e){ console.error('history sync failed', mk, e); }
    }
  } finally {
    historySyncing = false;
    render();
  }
}

function escapeHtml(str){
  return String(str==null?'':str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

let mainEl = null; // элемент #main кэшируется один раз, а не ищется на каждый чих
let lastViewKey = null; // сигнатура текущего «экрана» — нужна, чтобы не переигрывать анимацию появления по каждому чиху
let _renderScheduled = false; // дебаунс: несколько render() подряд схлопываются в один

function currentViewKey(){
  // Ключ отражает только то, какой ЭКРАН показан, а не что на нём меняется
  // (ввод PIN, ввод KPI и т.п.) — иначе анимация появления будет
  // переигрываться на каждое нажатие клавиши и выглядеть как тряска.
  if(viewEmpId && (mode==='admin' || mode==='team')) return 'view-emp:'+viewEmpId;
  if(mode==='team') return 'team-view';
  if(mode==='employee'){
    if(myEmployeeId) return 'emp-dashboard:'+myEmployeeId;
    if(selectingEmpId) return 'emp-pingate';
    return 'emp-list';
  }
  // ИСПРАВЛЕНО: вкладка «Продажа» отдавала тот же ключ, что и админка, поэтому
  // при переключении вкладок не срабатывали ни прокрутка вверх, ни анимация появления.
  if(mode==='sales') return 'sales-view';
  return adminUnlocked ? 'admin-view' : 'admin-pingate';
}

(function(){ let t; window.addEventListener('scroll', function(){ clearTimeout(t); t = setTimeout(function(){ try{ sessionStorage.setItem('dramify-scroll', JSON.stringify({k:lastViewKey, y:window.scrollY})); }catch(e){} }, 150); }, {passive:true}); })();

function render(){
  // Дебаунс: если уже запланирован рендер — не дублируем.
  // Исключение: прямые вызовы из UI-событий (клики) — они выполняются сразу,
  // а накопленные фоновые синхронизации схлопываются в один проход.
  if(_renderScheduled) return;
  _renderScheduled = true;
  Promise.resolve().then(_doRender);
}

// Немедленный рендер для UI-событий (клики, смена вкладки) — без дебаунса
function renderNow(){
  _renderScheduled = false;
  _doRender();
}

function _doRender(){
  _renderScheduled = false;
  if(!authSession) return;   // пока не вошли — экран входа не трогаем
  const main = mainEl || (mainEl = document.getElementById('main'));
  if(!main) return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.mode===mode));
  main.classList.remove('anim-in'); // сначала снимаем класс — иначе только что вставленные карточки
                                     // унаследуют его и будут переигрывать анимацию на каждый рендер
  // Показываем вкладку «Продажа» только для сотрудников ОП
  const salesTabEl = document.getElementById('salesTab');
  if(salesTabEl){
    const emp = employees.find(e=>e.id===myEmployeeId);
    salesTabEl.style.display = (emp && emp.department==='op') ? '' : 'none';
  }
  renderTopUser();
  const teamTabEl = document.getElementById('teamTab');
  if(teamTabEl){ const me = employees.find(e=>e.id===myEmployeeId); teamTabEl.style.display = (me && me.role==='teamlead') ? '' : 'none'; }
  const viewKey = currentViewKey();
  const scrollY = window.scrollY; // запоминаем позицию до перезаписи DOM

  // Запоминаем то, что админ уже набрал в полях ссылок, но ещё не сохранил.
  // Без этого фоновая синхронизация перерисовывала экран и стирала вставку.
  const pendingInputs = [];
  document.querySelectorAll('.sheet-url-input, .tracker-url-input, .cash-url-input, .ossales-url-input, .ups-url-input, .react-url-input').forEach(inp=>{
    pendingInputs.push({
      cls: ['sheet-url-input','cash-url-input','ossales-url-input','ups-url-input','react-url-input','tracker-url-input'].find(c=>inp.classList.contains(c)),
      month: inp.dataset.month, dept: inp.dataset.dept || '', value: inp.value,
    });
  });

  let html;
  if(viewEmpId && (mode==='admin' || mode==='team')) html = renderViewedCard();
  else if(mode==='employee')  html = renderEmployeeArea();
  else if(mode==='sales')     html = renderSalesView();
  else if(mode==='team')      html = renderTeamView();
  else                         html = renderAdminView();
  // Ничего не изменилось — DOM не трогаем: не сбрасываются прокрутка, фокус и раскрытые блоки
  if(html === _lastHtml && viewKey === lastViewKey) return;
  _lastHtml = html;
  // Запоминаем прокрутку внутренних блоков и раскрытые <details>
  const innerScroll = {}, cnt = {};
  main.querySelectorAll('*').forEach(n=>{
    const c = (n.className && n.className.baseVal===undefined ? String(n.className) : '') || n.tagName;
    cnt[c] = (cnt[c]||0) + 1;
    if(n.scrollTop > 0 && n.scrollHeight > n.clientHeight) innerScroll[c+'#'+cnt[c]] = n.scrollTop;
  });
  const openDetails = Array.from(main.querySelectorAll('details')).map(d=>d.open);
  main.innerHTML = html;

  // Возвращаем несохранённый ввод обратно в поля
  pendingInputs.forEach(p=>{
    const sel = p.dept
      ? `.${p.cls}[data-month="${p.month}"][data-dept="${p.dept}"]`
      : `.${p.cls}[data-month="${p.month}"]`;
    const el = main.querySelector(sel);
    if(el && el.value !== p.value && p.value) el.value = p.value;
  });
  // Включаем split-scroll только для дашборда сотрудника на десктопе
  const isEmpDash = (mode==='employee' && myEmployeeId && employees.find(e=>e.id===myEmployeeId)) || (viewEmpId && (mode==='admin'||mode==='team'));
  const isDesktop = window.innerWidth >= 900;
  main.classList.toggle('emp-split-view', !!(isEmpDash && isDesktop));
  const isAdminView = mode !== 'employee' && mode !== 'sales' && mode !== 'team' && !viewEmpId && adminUnlocked;
  main.classList.toggle('admin-split-view', !!(isAdminView && isDesktop));
  // анимацию «появления» включаем только когда реально сменился экран, а не на каждый рендер
  // (иначе ввод PIN или KPI подёргивался бы при каждой цифре/символе)
  let savedY = 0;
  try{ const sv = JSON.parse(sessionStorage.getItem('dramify-scroll')||'null'); if(sv && sv.k===viewKey && lastViewKey===null) savedY = sv.y||0; }catch(e){}
  if(viewKey !== lastViewKey){
    window.scrollTo({top:savedY,behavior:'instant'}); // наверх — только при смене экрана (при перезагрузке возвращаем место)
    void main.offsetWidth;
    main.classList.add('anim-in');
    lastViewKey = viewKey;
    setTimeout(() => slotRoll(main), 120);
  } else {
    window.scrollTo({top: scrollY, behavior: 'instant'}); // восстанавливаем позицию
    const cnt2 = {};
    main.querySelectorAll('*').forEach(n=>{
      const c = (n.className && n.className.baseVal===undefined ? String(n.className) : '') || n.tagName;
      cnt2[c] = (cnt2[c]||0) + 1;
      const v = innerScroll[c+'#'+cnt2[c]]; if(v) n.scrollTop = v;
    });
    main.querySelectorAll('details').forEach((d,i)=>{ if(openDetails[i]) d.open = true; });
  }
  // обработчики событий навешаны один раз через делегирование (см. attachDelegatedHandlers),
  // поэтому после каждого render() их не нужно перевешивать заново — это и есть оптимизация
}

// Инициалы считаются один раз на сотрудника и кэшируются на самом объекте —
// раньше split/join выполнялись заново при каждом render(), даже если имя не менялось.
// ИСПРАВЛЕНО: кэш писался прямо в объект сотрудника (e._initials, e._initialsSrc),
// а объект целиком уходил в Supabase — мусорные поля копились в общем хранилище.
// Теперь кэш живёт отдельно, в памяти вкладки.
const _initialsCache = new Map(); // id -> {src, val}
function initialsFor(e){
  const hit = _initialsCache.get(e.id);
  if(hit && hit.src === e.name) return hit.val;
  const val = e.name.trim().split(/\s+/).filter(Boolean).map(p=>p[0]).slice(0,2).join('').toUpperCase() || '?';
  _initialsCache.set(e.id, {src: e.name, val});
  return val;
}





function renderEmployeeDashboard(forId){
  const emp = employees.find(e=>e.id===(forId||myEmployeeId));
  if(!emp){ if(!forId) myEmployeeId = null; return forId ? '<div class="card"><div class="empty">Сотрудник не найден</div></div>' : renderNotLinked(); }
  const dept = DEPARTMENTS[emp.department] || DEPARTMENTS.op; // ИСПРАВЛЕНО: страховка от неизвестного отдела
  const checkedIn = isCheckedIn(emp.id);
  const todays = logs.filter(l=>l.empId===emp.id && isToday(l.ts)).sort((a,b)=>a.ts-b.ts);

  // Месяц для просмотра: если не выбран или не существует — показываем активный
  const availMonths = Object.keys(kpiData).sort().reverse();
  if(!empViewMonth || !availMonths.includes(empViewMonth)) empViewMonth = activeMonth;
  const viewMonth = empViewMonth;
  const isCurrentMonth = viewMonth === activeMonth;

  const k = getKpi(emp.id, viewMonth);
  const autoPlan = planFor(emp, viewMonth);
  // у ОС нет плана и доли — num/den = 0, плитки ставок и полоса плана не показываются
  const num = dept.ratio ? (Number(k[dept.ratio.num])||0) : 0;
  const den = !dept.ratio ? 0 : (dept.ratio.den==='plan' && autoPlan!=null) ? autoPlan : (Number(k[dept.ratio.den])||0);
  const ratioPct = den>0 ? Math.min(100, Math.round(num/den*100)) : 0;

  const kpiBoxes = dept.fields.map(f=>{
    let val = k[f.key];
    if(f.computed && f.key==='avgCheck' && emp.department==='op'){
      val = (Number(k.deals)>0) ? (Number(k.revenue)/Number(k.deals)) : 0;
    }
    if(f.key==='plan' && autoPlan!=null) val = autoPlan;
    const display = f.type==='number' ? (f.money ? fmtMoney(val) : val) : (escapeHtml(val) || '—');
    const wideClass = (f.key==='avgCheck' && emp.department==='op') ? ' wide' : '';
    return `<div class="kpi-box${wideClass}"><div class="label">${f.label}</div><div class="value">${display}</div></div>`;
  }).join('') + opPlanBoxes() + toRateBoxes();

  // ТО, текущий месяц: ставка сейчас, сколько до следующей ставки, ставка по тенденции.
  // Пересчитывается при каждой перерисовке — а она идёт при новых данных (опрос базы,
  // синхронизация таблицы). План — тот же planFor, что и в сводке отдела.
  function toRateBoxes(){
    if(emp.department!=='to' || viewMonth!==currentMonthKey()) return '';
    const fixed = empFixedRate(emp);
    const hasPlan = den>0;
    const syncedAt = lastSheetSyncAt['to_' + viewMonth];
    const refresh = `<div class="kpi-refresh"><span>${toRefreshBusy ? 'Обновляю…' : (syncedAt ? 'обновлено в ' + fmtTime(syncedAt) : 'ещё не обновлялось с открытия')}</span>
      <button class="att-btn" id="toRefreshBtn" ${toRefreshBusy?'disabled':''}>Обновить сейчас</button></div>`;
    if(!hasPlan && fixed==null) return `<div class="kpi-box wide"><div class="label">Ставка сейчас</div><div class="value">—</div><div class="sub">план на месяц не задан — ставку посчитать не от чего</div></div>` + refresh;
    const pctRaw = hasPlan ? num/den*100 : null;
    const pctShow = pctRaw!=null ? (Math.round(pctRaw*10)/10).toLocaleString('ru-RU') : null;
    const rate = currentRateFor(emp, num, den);
    const nowBox = `<div class="kpi-box"><div class="label">Ставка сейчас</div><div class="value">${rate}%${fixed!=null?' <span class="kpi-tag">фикс.</span>':''}</div><div class="sub">${pctShow!=null ? 'выполнено ' + pctShow + '% плана' : 'фиксированная ставка'}</div></div>`;
    let nextBox;
    if(fixed!=null) nextBox = `<div class="kpi-box"><div class="label">До следующей ставки</div><div class="value">—</div><div class="sub">ставка фиксированная</div></div>`;
    else {
      const st = nextRateStep(num, den);
      nextBox = st.max
        ? `<div class="kpi-box"><div class="label">До следующей ставки</div><div class="value">${st.rate}%</div><div class="sub">максимальная ставка</div></div>`
        : `<div class="kpi-box"><div class="label">До ставки ${st.rate}%</div><div class="value">${fmtMoney(st.need)}</div><div class="sub">не хватает до ${st.label} плана</div></div>`;
    }
    let trendBox = '';
    if(hasPlan){
      const trend = personalTrend(emp.id, viewMonth, num, den);
      if(trend){
        const tRate = trendRateFor(emp, trend);
        // третья плитка в ряду одна — растягиваем на всю ширину
        trendBox = `<div class="kpi-box span-all"><div class="label">По тенденции</div><div class="value">${tRate}%</div><div class="sub">${fixed!=null ? 'фикс. · ' : ''}темп ${trend.pct}% плана</div></div>`;
      }
    }
    return nowBox + nextBox + trendBox + refresh;
  }

  // ОП, текущий месяц: сколько делать в день до плана и ставка по тенденции
  function opPlanBoxes(){
    if(emp.department!=='op' || !(den>0)) return '';
    const need = dailyNeed(emp.id, viewMonth, num, den);
    if(!need) return '';
    const trend = personalTrend(emp.id, viewMonth, num, den);
    const tRate = trendRateFor(emp, trend);
    const needBox = need.perDay>0
      ? `<div class="kpi-box"><div class="label">Нужно в день</div><div class="value">${fmtMoney(need.perDay)}</div><div class="sub">до плана ${fmtMoney(need.remaining)} · ${need.daysLeft} раб. дн.</div></div>`
      : `<div class="kpi-box"><div class="label">Нужно в день</div><div class="value">${fmtMoney(0)}</div><div class="sub">план выполнен</div></div>`;
    const rateBox = `<div class="kpi-box"><div class="label">% по тенденции</div><div class="value">${tRate!=null ? tRate+'%' : '—'}</div><div class="sub">${empFixedRate(emp)!=null ? 'фиксированная ставка' : trend ? `темп ${trend.pct}% плана` : 'нет рабочих дней'}</div></div>`;
    return needBox + rateBox;
  }

  const monthOptions = availMonths.map(mk=>
    `<option value="${mk}" ${mk===viewMonth?'selected':''}>${monthLabel(mk)}${mk===activeMonth?' ✦':''}</option>`
  ).join('');

  const monthBar = `
    <div class="emp-month-bar">
      <select id="empMonthSelect">${monthOptions}</select>
      ${isCurrentMonth ? '<span class="emp-month-badge">текущий</span>' : ''}
    </div>`;

  return `${forId ? '<div class="ro-bar"><button class="btn small secondary" id="viewBackBtn">← Назад</button><span>Карточка сотрудника · только просмотр</span></div>' : ''}
    <div class="emp-dashboard-grid${forId ? ' ro-view' : ''}">
      <div class="emp-col-left">
        <div class="card">
          <div class="punch-wrap">
            <div class="status-pill"><span class="dot ${checkedIn?'in':'out'}"></span>${escapeHtml(emp.name)}${empRoleLabel(emp)?' · '+escapeHtml(empRoleLabel(emp)):''} · ${checkedIn?'на смене':'не на смене'}</div>
            <div class="punch-ring ${checkedIn?'on-shift':''}">
              <button class="punch-btn ${checkedIn?'ready-out':'ready-in'}" id="punchBtn">
                ${checkedIn?'END':'START'}
                <span class="sub" id="punchClock">${fmtTime(Date.now())}</span>
              </button>
            </div>
            <div class="elapsed">Сегодня отработано: <span id="elapsedText">${fmtDuration(todayHoursFor(emp.id))}</span></div>
            ${(()=>{
              const n = new Date(), mk = localDayStr(n).slice(0,7), d = n.getDate();
              if(isOffDay(emp.id, mk, d)) return '<div class="shift-today">Сегодня по графику выходной</div>';
              const st = shiftStartFor(emp.id, mk, d), unusual = st !== shiftDefault(emp.id);
              return `<div class="shift-today${unusual?' unusual':''}">Смена сегодня с <b>${st}</b>${unusual ? ' — не как обычно' : ''}</div>`;
            })()}
            <div class="switch-user" id="switchUser">Выйти</div>
          </div>
        </div>

        <div class="card">
          <h2>${dept.workOnly ? 'Показатели' : 'KPI'} · ${monthLabel(viewMonth)}</h2>
          ${monthBar}
          ${dept.workOnly ? `${renderOsCard(emp, viewMonth)}` : `
          <div class="kpi-grid">${kpiBoxes}</div>
          <div class="plan-bar-wrap">
            <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);"><span>${dept.ratio.label}</span><span>${ratioPct}%</span></div>
            <div class="plan-bar-track"><div class="plan-bar-fill" style="width:${ratioPct}%"></div></div>
          </div>`}
        </div>

        ${renderHistoryCard(emp)}
        ${forId && (emp.department==='op' || emp.department==='to') ? renderSheetCheck(emp, viewMonth) : ''}

            <span><span class="sw off"></span>Выходной</span>

        ${emp.department === 'to' ? renderOrdersBlock(emp.id, viewMonth) : ''}

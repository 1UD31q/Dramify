// ---------------------------------------------------------------------
// Делегирование событий: раньше на каждый render() заново вешались
// обработчики на все найденные элементы (querySelectorAll + forEach).
// При росте списка сотрудников/логов это лишняя работа на каждый чих —
// клик по вкладке, ввод PIN-кода, тик таймера раз в минуту и т.д.
// Здесь обработчики навешиваются ОДИН РАЗ на весь документ и определяют
// нужное действие по клику через closest(), что дешевле и не требует
// повторного прохода по DOM после каждого render().
// ---------------------------------------------------------------------

let asyncActionInFlight = false;
async function runOnce(fn){
  if(asyncActionInFlight) return;
  asyncActionInFlight = true;
  try { await fn(); } finally { asyncActionInFlight = false; }
}

function attachDelegatedHandlers(){
  document.addEventListener('click', async (ev)=>{
    // ---- Вкладки админки ----
    const tabEl = ev.target.closest('[data-admin-tab]');
    if(tabEl){ adminTab = tabEl.dataset.adminTab; renderNow(); return; }

    const el = ev.target;

    const tab = el.closest('.tab');
    if(tab){ mode = tab.dataset.mode; viewEmpId = null; renderNow(); return; }

    const vBtn = el.closest('[data-view-emp]');
    if(vBtn){ viewEmpId = vBtn.dataset.viewEmp; renderNow(); return; }
    if(el.closest('#viewBackBtn')){ viewEmpId = null; renderNow(); return; }
    // В режиме просмотра чужой карточки действия отключены
    if(viewEmpId && el.closest('#punchBtn, [data-order-pause], [data-order-resume], [data-order-status]')) return;

    // Скрытый режим удаления отметок времени: 5 быстрых нажатий по заголовку карточки
    if(el.closest('#saleTimesTitle')){
      saleTimesTitleClicks++;
      clearTimeout(saleTimesTitleTimer);
      saleTimesTitleTimer = setTimeout(()=>{ saleTimesTitleClicks = 0; }, 1500);
      if(saleTimesTitleClicks >= 5){
        saleTimesTitleClicks = 0;
        saleTimesManage = !saleTimesManage;
        renderNow();
        showToast(saleTimesManage ? 'Режим удаления записей включён' : 'Режим удаления выключен', saleTimesManage ? 'error' : 'success');
      }
      return;
    }
    if(el.closest('#saleTimesManageClose')){ saleTimesManage = false; renderNow(); return; }
    const stDelBtn = el.closest('[data-saletime-del]');
    if(stDelBtn){
      const id = stDelBtn.dataset.saletimeDel, mk = stDelBtn.dataset.mk;
      const rec = (saleTimes[mk]||[]).find(r=>r.id===id);
      const okConfirm = await showConfirm('Удалить отметку времени?', (rec ? `«${rec.client||'без имени'}» в ${rec.time}. ` : '') + 'Строка в Google Таблице останется — её нужно удалить вручную.', 'Удалить');
      if(!okConfirm) return;
      stDelBtn.disabled = true;
      const ok = await deleteSaleTime(mk, id);
      renderNow();
      showToast(ok ? 'Запись удалена' : 'Не удалось удалить — нет связи с базой', ok ? 'success' : 'error');
      return;
    }

    if(el.closest('#punchBtn')){ await runOnce(()=>punch(myEmployeeId)); return; }

    if(el.closest('#authOpenAdminBtn')){ if(authIsAdmin()){ mode = 'admin'; renderNow(); } return; }
    if(el.closest('#switchUser') || el.closest('#authLogoutBtn') || el.closest('#topLogoutBtn')){ await authSignOut(); return; }

    if(el.closest('#lockAdminBtn')){ mode = 'employee'; renderNow(); return; }

    if(el.closest('#addMonthBtn')){
      const now = new Date();
      const next = new Date(now.getFullYear(), now.getMonth()+1, 1);
      const suggested = next.getFullYear() + '-' + String(next.getMonth()+1).padStart(2,'0');
      const val = prompt('Новый месяц в формате ГГГГ-ММ:', suggested);
      if(val) addMonth(val.trim());
      return;
    }

    if(el.closest('#activateBtn')){ activateMonth(editingMonth); return; }

    if(el.closest('#toggleLogsBtn')){ logsExpanded = !logsExpanded; renderNow(); return; }
    if(el.closest('#sheetsAuditBtn')){ runSheetsAudit(); return; }
    if(el.closest('#toRefreshBtn')){ refreshCurrentMonthNow(); return; }
    if(el.closest('[data-sheetcheck]')){
      const b = el.closest('[data-sheetcheck]');
      const emp = employees.find(e=>e.id===b.dataset.sheetcheck);
      if(emp) runSheetCheck(emp, b.dataset.sheetcheckMk);
      return;
    }
    if(el.closest('[data-calmode]')){ calMode = el.closest('[data-calmode]').dataset.calmode; renderNow(); return; }
    if(el.closest('[data-attshift]')){ shiftAttDay(Number(el.closest('[data-attshift]').dataset.attshift)); renderNow(); return; }
    if(el.closest('[data-atttoday]')){ attDay = null; renderNow(); return; }

    if(el.closest('#saveKpiBtn')){
      await runOnce(async ()=>{
        const inputs = document.querySelectorAll('[data-emp]');
        const grouped = {};
        inputs.forEach(i=>{ grouped[i.dataset.emp] = grouped[i.dataset.emp] || {}; grouped[i.dataset.emp][i.dataset.field] = i.value; });
        for(const empId in grouped){
          const emp = employees.find(e=>e.id===empId);
          if(!emp) continue;
          const dept = DEPARTMENTS[emp.department];
          if(!dept) continue; // ИСПРАВЛЕНО: неизвестный отдел больше не роняет сохранение
          const values = {};
          const prev = getKpi(empId, editingMonth);
          dept.fields.forEach(f=>{
            if(f.computed) return;
            const raw = grouped[empId][f.key];
            if(raw===undefined){ values[f.key] = prev[f.key]; return; } // поля нет в форме (план) — не затираем
            values[f.key] = f.type==='number' ? (Number(raw)||0) : (raw||'');
          });
          await saveKpiForMonth(editingMonth, empId, values);
        }
        // Ручной план: пусто — снова авто, число — фиксируем
        const ovInputs = document.querySelectorAll('[data-planover]');
        if(ovInputs.length){
          const m = Object.assign({}, planOverrides[editingMonth]||{});
          ovInputs.forEach(i=>{
            const raw = String(i.value).trim();
            if(raw==='' || isNaN(Number(raw)) || Number(raw)<0) delete m[i.dataset.planover];
            else m[i.dataset.planover] = Math.round(Number(raw));
          });
          planOverrides = Object.assign({}, planOverrides, {[editingMonth]: m});
          const merged = await saveMerged('app:planOverrides', planOverrides, Array.from(ovInputs).map(i=>[editingMonth, i.dataset.planover]));
          if(merged) planOverrides = merged;
          const ok = !!merged;
          showToast(ok===false ? 'Не удалось сохранить план' : 'Сохранено, план отдела пересчитан', ok===false ? 'error' : 'success');
        }
        renderNow();
      });
      return;
    }

    if(el.closest('#savePinsBtn')){
      await runOnce(async ()=>{
        document.querySelectorAll('[data-nameemp]').forEach(i=>{
          const emp = employees.find(e=>e.id===i.dataset.nameemp);
          const val = i.value.trim();
          if(emp && val) emp.name = val;
        });
        // Почта для входа. Должна быть корректной и не повторяться у разных людей.
        const seenEmails = {};
        let emailProblem = '';
        document.querySelectorAll('[data-emailemp]').forEach(i=>{
          const emp = employees.find(e=>e.id===i.dataset.emailemp);
          if(!emp) return;
          const v = i.value.trim().toLowerCase();
          if(v && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){ emailProblem = 'Некорректная почта у «' + emp.name + '»'; return; }
          if(v && seenEmails[v]){ emailProblem = 'Почта ' + v + ' указана у двух сотрудников'; return; }
          if(v) seenEmails[v] = true;
          emp.email = v;
        });
        if(emailProblem){ showToast(emailProblem, 'error'); return; }
        // Роль и фиксированная ставка. Пустая роль сохраняется явно (''), чтобы
        // автоправило для Алихана больше не срабатывало.
        document.querySelectorAll('[data-roleemp]').forEach(i=>{
          const emp = employees.find(e=>e.id===i.dataset.roleemp);
          if(emp) emp.role = i.value;
        });
        document.querySelectorAll('[data-fixedemp]').forEach(i=>{
          const emp = employees.find(e=>e.id===i.dataset.fixedemp);
          if(!emp) return;
          const v = i.value.trim();
          emp.fixedRate = (v==='' || isNaN(Number(v))) ? null : Number(v);
        });
        await storeSet('app:employees', employees, SHARED);
        renderNow();
      });
      return;
    }

    if(el.closest('#tmSaveEmailsBtn')){ await runOnce(teamSaveEmails); return; }
    if(el.closest('#tmAddBtn')){ await runOnce(teamAddEmployee); return; }

    if(el.closest('#addEmpBtn')){
      await runOnce(async ()=>{
        const name = document.getElementById('newEmpName').value.trim();
        const dept = document.getElementById('newEmpDept').value;
        const email = document.getElementById('newEmpEmail').value.trim().toLowerCase();
        if(!name || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ showToast('Укажите имя и корректную почту', 'error'); return; }
        if(employees.some(e=>(e.email||'').toLowerCase()===email)){ showToast('Сотрудник с такой почтой уже есть', 'error'); return; }
        const id = 'e' + Date.now();
        await saveEmployee({id, name, department:dept, email});
        renderNow();
      });
      return;
    }

    const delBtn = el.closest('[data-delemp]');
    if(delBtn){
      const emp = employees.find(e=>e.id===delBtn.dataset.delemp);
      if(!emp) return;
      const ok = await showConfirm('Удалить сотрудника?', `«${emp.name}» и его профиль исчезнут из приложения. Это действие нельзя отменить.`, 'Удалить');
      if(!ok) return;
      await runOnce(async ()=>{
        employees = employees.filter(e=>e.id!==emp.id);
        await storeSet('app:employees', employees, SHARED);
        renderNow();
        showToast('Сотрудник удалён', 'success');
      });
      return;
    }

    const calCell = el.closest('[data-caltoggle]');
    if(calCell){
      await runOnce(async ()=>{
        if(calMode==='time') await toggleShiftDay(calCell.dataset.caltoggle, calCell.dataset.calmonth, calCell.dataset.calday, calModeTime);
        else await toggleOffDay(calCell.dataset.caltoggle, calCell.dataset.calmonth, calCell.dataset.calday);
        renderNow();
      });
      return;
    }

    if(el.closest('.sheet-sync-btn')){
      const btn = el.closest('.sheet-sync-btn');
      const mk = btn.dataset.month;
      const dept = btn.dataset.dept;
      const input = document.querySelector(`.sheet-url-input[data-month="${mk}"][data-dept="${dept}"]`);
      if(input) setSheetUrl(dept, mk, input.value.trim());
      { const m = await saveMerged('app:sheetUrls', sheetUrls, [[mk, dept]]); if(m) sheetUrls = m; }
      await syncFromGoogleSheet(dept, mk);
      return;
    }
    if(el.closest('.os-link-btn')){
      const btn = el.closest('.os-link-btn'), mk = btn.dataset.month, K = osKinds()[btn.dataset.kind];
      const input = document.querySelector(`.${K.cls}[data-month="${mk}"]`);
      const store = K.get();
      if(input) store[mk] = input.value.trim();
      { const m = await saveMerged(K.key, store, [[mk]]); if(m) K.set(m); else showToast('Ссылка не сохранилась — проверьте связь и права', 'error'); }
      await syncOsData(mk === '*' ? activeMonth : mk);
      return;
    }
    if(el.closest('#osRefreshBtn')){ await syncOsData(el.closest('#osRefreshBtn').dataset.month); return; }
    if(el.closest('.cash-sync-btn')){
      const btn = el.closest('.cash-sync-btn');
      const mk = btn.dataset.month;
      const input = document.querySelector(`.cash-url-input[data-month="${mk}"]`);
      if(input) cashUrls[mk] = input.value.trim();
      { const m = await saveMerged('app:cashUrls', cashUrls, [[mk]]); if(m) cashUrls = m; }
      await syncCashSheet(mk);
      return;
    }
    if(el.closest('.tracker-sync-btn')){
      const btn = el.closest('.tracker-sync-btn');
      const mk = btn.dataset.month;
      const input = document.querySelector(`.tracker-url-input[data-month="${mk}"]`);
      if(input) trackerUrls[mk] = input.value.trim();
      { const m = await saveMerged('app:trackerUrls', trackerUrls, [[mk]]); if(m) trackerUrls = m; }
      await syncTracker(mk);
      return;
    }

    // ---- Отчёт продаж: сохранить URL скрипта ----
    if(el.closest('#saveSalesScriptBtn')){
      const inp = document.getElementById('salesScriptUrlInput');
      if(inp){ salesScriptUrl = inp.value.trim(); await storeSet('app:salesScriptUrl', salesScriptUrl, SHARED); showToast('URL скрипта сохранён','success'); renderNow(); }
      return;
    }

    // ---- Форма продажи: отправить ----
    if(el.closest('#salesSubmitBtn')){ await submitSalesForm(); return; }

    // ---- Заказы: сворачивание/разворачивание секции ----
    const toggleSec = el.closest('[data-orders-toggle]');
    if(toggleSec){
      const secId = toggleSec.dataset.ordersToggle;
      ordersCollapsed[secId] = !ordersCollapsed[secId];
      // Мгновенно обновляем DOM без полного рендера
      toggleSec.classList.toggle('collapsed', ordersCollapsed[secId]);
      const body = document.getElementById('orders-sec-body-' + secId);
      if(body) body.style.display = ordersCollapsed[secId] ? 'none' : '';
      return;
    }

    // ---- Заказы: поставить на паузу ----
    const pauseBtn = el.closest('[data-order-pause]');
    if(pauseBtn){
      const orderId = pauseBtn.dataset.orderPause;
      const empId   = pauseBtn.dataset.empId;
      const reason  = await showPauseModal(empId, orderId);
      if(!reason) return;
      if(!ordersOverlay[orderId]) ordersOverlay[orderId] = {};
      ordersOverlay[orderId].paused      = true;
      ordersOverlay[orderId].pauseReason = reason;
      ordersOverlay[orderId].pausedAt    = Date.now();
      // сохраняем statusSince для корректного таймера
      const empListP = (ordersData[empViewMonth||activeMonth]&&ordersData[empViewMonth||activeMonth][empId]) || [];
      const ordP = empListP.find(o => o.id === orderId);
      if(ordP && !ordersOverlay[orderId].statusSince) ordersOverlay[orderId].statusSince = ordP.statusSince;
      await saveOverlay(orderId);
      renderNow();
      showToast('Заказ на паузе: ' + reason, 'success');
      return;
    }

    // ---- Заказы: возобновить ----
    const resumeBtn = el.closest('[data-order-resume]');
    if(resumeBtn){
      const orderId = resumeBtn.dataset.orderResume;
      const empId   = resumeBtn.dataset.empId;
      const ov = ordersOverlay[orderId] || {};
      const empListR = (ordersData[empViewMonth||activeMonth]&&ordersData[empViewMonth||activeMonth][empId]) || [];
      const ordR = empListR.find(o => o.id === orderId);
      const baseSince = ordR ? (ordR.statusSince||Date.now()) : Date.now();
      const pausedDuration = ov.pausedAt ? (ov.pausedAt - baseSince) : 0;
      ordersOverlay[orderId] = Object.assign(ov, {
        paused: false,
        pauseReason: '',
        pausedAt: null,
        statusSince: Date.now() - pausedDuration,
      });
      await saveOverlay(orderId);
      renderNow();
      showToast('Заказ возобновлён', 'success');
      return;
    }

    // ---- Заказы: сменить статус ----
    const statusBtn = el.closest('[data-order-status]');
    if(statusBtn){
      const orderId = statusBtn.dataset.orderStatus;
      const empId   = statusBtn.dataset.empId;
      const empListS = (ordersData[empViewMonth||activeMonth]&&ordersData[empViewMonth||activeMonth][empId]) || [];
      const ordS = empListS.find(o => o.id === orderId);
      const curStatus = (ordersOverlay[orderId]||{}).status || (ordS||{}).status || '';
      const newStatus = await showStatusModal(curStatus);
      if(!newStatus || newStatus === curStatus) return;
      if(!ordersOverlay[orderId]) ordersOverlay[orderId] = {};
      // Сохраняем финальное время выполнения при переходе в "Ждём оплату" или завершённый статус
      const isFinalStatus = newStatus.toLowerCase().includes('оплат') || newStatus.toLowerCase().includes('успешно') || newStatus === 'Выполнен';
      const wasFinal = curStatus.toLowerCase().includes('оплат') || curStatus.toLowerCase().includes('успешно') || curStatus === 'Выполнен';
      if(isFinalStatus && !wasFinal){
        const curOv = ordersOverlay[orderId] || {};
        const baseOrder = ((ordersData[empViewMonth||activeMonth]&&ordersData[empViewMonth||activeMonth][empId])||[]).find(o=>o.id===orderId) || {};
        const sinceMs = curOv.statusSince || baseOrder.statusSince || Date.now();
        const elapsed = curOv.paused
          ? (curOv.pausedAt||Date.now()) - sinceMs
          : Date.now() - sinceMs;
        ordersOverlay[orderId].finalTime = Math.max(0, elapsed);
      }
      ordersOverlay[orderId].status      = newStatus;
      ordersOverlay[orderId].statusSince = Date.now();
      ordersOverlay[orderId].paused      = false;
      ordersOverlay[orderId].pauseReason = '';
      ordersOverlay[orderId].pausedAt    = null;
      await saveOverlay(orderId);
      renderNow();
      showToast('Статус: ' + newStatus, 'success');
      return;
    }
  });

  document.addEventListener('change', async (ev)=>{
    if(mode==='sales' && ev.target.id && SALES_FIELDS[ev.target.id]){
      salesForm[SALES_FIELDS[ev.target.id]] = ev.target.value;
    }
    if(ev.target.id === 'monthSelect'){ editingMonth = ev.target.value; renderNow(); }
    if(ev.target.id === 'teamSchedSelect'){ teamSchedEmpId = ev.target.value; renderNow(); }
    if(ev.target.id === 'calModeTime'){ if(validHHMM(ev.target.value)) calModeTime = ev.target.value; renderNow(); }
    if(ev.target.dataset && ev.target.dataset.shiftdefault){
      const ok = await setShiftDefault(ev.target.dataset.shiftdefault, ev.target.value);
      showToast(ok ? 'Начало смены сохранено' : 'Не удалось сохранить', ok ? 'success' : 'error');
      renderNow();
    }
    if(ev.target.id === 'attDayInput'){ const v = ev.target.value; attDay = (v && v <= localDayStr(new Date())) ? v : null; renderNow(); }
    if(ev.target.id === 'scheduleEmpSelect'){ scheduleEmpId = ev.target.value; renderNow(); }
    if(ev.target.id === 'kpiEmpSelect'){ kpiEditEmpId = ev.target.value; renderNow(); }
    if(ev.target.id === 'saleTimesEmpSelect'){ saleTimesEmpFilter = ev.target.value; ev.target.blur(); renderNow(); }
    if(ev.target.id === 'empMonthSelect'){ empViewMonth = ev.target.value; renderNow(); }

    // Ссылки на листы сохраняются сразу, как только поле потеряло фокус —
    // не дожидаясь нажатия «Обновить». Иначе фоновая синхронизация могла
    // перерисовать экран и стереть вставленную, но ещё не сохранённую ссылку.
    if(ev.target.classList.contains('sheet-url-input')){
      const mk = ev.target.dataset.month, dept = ev.target.dataset.dept;
      setSheetUrl(dept, mk, ev.target.value.trim());
      try{ const m = await saveMerged('app:sheetUrls', sheetUrls, [[mk, dept]]); if(m) sheetUrls = m; else showToast('Ссылка не сохранилась — проверьте связь', 'error'); }catch(e){ console.error(e); }
      return;
    }
    if(ev.target.classList.contains('tracker-url-input')){
      const mk = ev.target.dataset.month;
      trackerUrls[mk] = ev.target.value.trim();
      try{ const m = await saveMerged('app:trackerUrls', trackerUrls, [[mk]]); if(m) trackerUrls = m; else showToast('Ссылка не сохранилась — проверьте связь', 'error'); }catch(e){ console.error(e); }
      return;
    }
    { const K = Object.values(osKinds()).find(k=> ev.target.classList.contains(k.cls));
      if(K){
        const mk = ev.target.dataset.month, store = K.get();
        store[mk] = ev.target.value.trim();
        try{ const m = await saveMerged(K.key, store, [[mk]]); if(m) K.set(m); else showToast('Ссылка не сохранилась — проверьте связь и права', 'error'); }catch(e){ showToast('Ссылка не сохранилась', 'error'); }
        return;
      } }
    if(ev.target.classList.contains('cash-url-input')){
      const mk = ev.target.dataset.month;
      cashUrls[mk] = ev.target.value.trim();
      try{ const m = await saveMerged('app:cashUrls', cashUrls, [[mk]]); if(m) cashUrls = m; else showToast('Ссылка не сохранилась — проверьте связь', 'error'); }catch(e){ console.error(e); }
      return;
    }
  });

  // Автосохранение комментариев к заказам (debounce 800ms)
  const commentSaveTimers = {};
  document.addEventListener('input', (ev)=>{
    // Форма продажи: любое изменение сразу запоминаем, чтобы фоновый рендер его не стёр
    if(mode==='sales' && ev.target.id && SALES_FIELDS[ev.target.id]){
      salesForm[SALES_FIELDS[ev.target.id]] = ev.target.value;
      if(ev.target.id==='sf_total' || ev.target.id==='sf_prepayment'){
        const total = parseFloat(salesForm.total)||0;
        const prep  = parseFloat(salesForm.prepayment)||0;
        const rem = document.getElementById('sf_remainder_display');
        if(rem) rem.value = '₸' + Math.max(0,total-prep).toLocaleString('ru-RU');
      }
    }
    const ta = ev.target.closest('[data-order-comment]');
    if(!ta) return;
    const orderId = ta.dataset.orderComment;
    const empId   = ta.dataset.empId;
    clearTimeout(commentSaveTimers[orderId]);
    commentSaveTimers[orderId] = setTimeout(async ()=>{
      if(!ordersOverlay[orderId]) ordersOverlay[orderId] = {};
      ordersOverlay[orderId].comment = ta.value;
      await saveOverlay(orderId);
      const saved = document.getElementById('saved-' + empId + '-' + orderId);
      if(saved){ saved.classList.add('show'); setTimeout(()=>saved.classList.remove('show'), 1800); }
    }, 800);
  });

}

let sheetSyncTimer = null;

let orderTimerHandle = null;

(async function init(){
  attachDelegatedHandlers();
  attachAuthHandlers();
  const authOk = await authBoot();
  if(!authOk) return;                       // показан экран входа
  document.body.classList.remove('auth-out');
  storeReadFailed = false;
  await loadAll();
  linkAuthIdentity(true);
  await loadOrders();

  // Разрешаем запись в общее хранилище только если чтение прошло без ошибок.
  // Иначе работаем в режиме «только чтение»: показываем, что есть, но ничего
  // не сохраняем — чтобы не затереть живые цифры пустыми.
  stateLoaded = !storeReadFailed;
  if(!stateLoaded){
    showToast('Нет связи с базой — данные не сохраняются. Пробую переподключиться…', 'error');
  } else {
    await flushHeal(); // если что-то восстановили из локальной копии — вернём в базу
  }

  renderNow();
  // ИСПРАВЛЕНО: в снимке не хватало cashUrls/cashTotals — набор ключей не совпадал
  // с pollSharedData, поэтому первый фоновый опрос всегда считал данные изменившимися.
  lastSyncSnapshot = JSON.stringify({freshEmployees:employees, freshKpi:kpiData, freshLogs:logs, freshActiveMonth:activeMonth, freshAdminPin:adminPin, freshSheetUrls:sheetUrls, freshSchedules:schedules, freshLedger:ledgerTotals, freshTrackerUrl:trackerUrls, freshTrackerData:trackerData, freshOrdersCsv:ordersData, freshOrdersOv:ordersOverlay, freshCashUrls:cashUrls, freshCashTotals:cashTotals});
  timerHandle = setInterval(tickEmployeeClock, 15000);
  orderTimerHandle = setInterval(tickOrderTimers, 30000);
  if(getSheetUrl('op', activeMonth) || getSheetUrl('to', activeMonth) || (trackerUrls[activeMonth]||'').trim() || (cashUrls[activeMonth]||'').trim()){
    silentAutoSync();
    sheetSyncTimer = setInterval(silentAutoSync, 5*60000);
  } else {
    syncHistoryMonths(); // даже если у текущего месяца ссылок нет — прошлые месяцы истории
  }
  startBackgroundSync();
  autoCloseStaleShifts();   // закрыть смены, которые остались открытыми с прошлых дней
  // Вкладку открыли снова — сразу свежие данные и проверка версии
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState !== 'visible') return;
    checkAppVersion().then(()=>{ pollSharedData(); });
  });
  setInterval(checkAppVersion, 10*60000);
})();

// Подчищаем все таймеры при уходе со страницы — без этого при частых
// программных перезагрузках (например, в webview) они бы копились.
window.addEventListener('pagehide', ()=>{
  if(timerHandle) clearInterval(timerHandle);
  if(sheetSyncTimer) clearInterval(sheetSyncTimer);
  if(orderTimerHandle) clearInterval(orderTimerHandle);
  stopBackgroundSync();
});

// ── Переключатель темы ──
(function(){
  const html = document.documentElement;
  const btn = document.getElementById('themeBtn');
  if(!btn) return;

  // Определяем системную тему
  const prefersDark = () => window.matchMedia('(prefers-color-scheme: dark)').matches;

  // Читаем сохранённое значение: 'dark' | 'light' | null (= системная)
  let saved = localStorage.getItem('dramify-theme');

  function apply(theme) {
    html.classList.remove('dark', 'light');
    if(theme === 'dark') {
      html.classList.add('dark');
      btn.textContent = '☀️';
    } else if(theme === 'light') {
      html.classList.add('light');
      btn.textContent = '🌙';
    } else {
      // авто — следуем системной
      btn.textContent = prefersDark() ? '☀️' : '🌙';
    }
  }

  apply(saved);

  btn.addEventListener('click', () => {
    // Цикл: системная → light → dark → light → dark...
    const isDark = html.classList.contains('dark') || (!html.classList.contains('light') && prefersDark());
    saved = isDark ? 'light' : 'dark';
    localStorage.setItem('dramify-theme', saved);
    apply(saved);
  });

  // Реагируем на смену системной темы (если нет ручного выбора)
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    const current = localStorage.getItem('dramify-theme');
    if(!current) apply(null);
  });
})();

// ── Secret admin access ──
(function(){
  // --- 5 taps on logo (mobile) ---
  let tapCount = 0, tapTimer = null;
  const logo = document.getElementById('brandLogo');
  if(logo){
    logo.addEventListener('click', function(){
      tapCount++;
      clearTimeout(tapTimer);
      tapTimer = setTimeout(function(){ tapCount = 0; }, 2000);
      if(tapCount >= 5){
        tapCount = 0;
        if(!authIsAdmin()) return;
        mode = 'admin';
        renderNow();
      }
    });
  }

  // --- Shift + CapsLock + A (desktop) ---
  // Tracks whether Shift is held and CapsLock is active
  document.addEventListener('keydown', function(e){
    // e.key === 'A' (uppercase) means Shift is held AND the key is A
    // e.getModifierState('CapsLock') checks CapsLock state
    // ИСПРАВЛЕНО: при включённом CapsLock + Shift браузер отдаёт e.key === 'a'
    // (регистр инвертируется), поэтому проверка на 'A' почти никогда не срабатывала.
    // Сверяемся с физической клавишей через e.code.
    if(
      e.shiftKey &&
      e.getModifierState('CapsLock') &&
      e.code === 'KeyA'
    ){
      e.preventDefault();
      if(!authIsAdmin()) return;
      mode = 'admin';
      renderNow();
    }
  });
})();

// ── Scroll-to-top button ──
(function(){
  const btn = document.getElementById('scrollTopBtn');
  if(!btn) return;
  window.addEventListener('scroll', () => {
    btn.classList.toggle('visible', window.scrollY > 300);
  }, {passive: true});
})();

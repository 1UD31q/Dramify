  .auth-or::before,.auth-or::after{content:'';flex:1;height:1px;background:var(--line);}
  .ro-bar{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:13px;color:var(--ink3);}
  .ro-view #punchBtn,.ro-view [data-order-pause],.ro-view [data-order-resume],.ro-view [data-order-status],.ro-view textarea,.ro-view #switchUser{pointer-events:none;opacity:.5;}
  .ro-view #switchUser{display:none;}
  .tm-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 0;border-bottom:1px solid var(--bg2);}
  .tm-row:last-child{border-bottom:none;}
  .tm-name{flex:1 1 160px;font-weight:600;display:flex;align-items:center;gap:8px;}
  .tm-meta{flex:2 1 260px;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink3);}
  .card{margin-bottom:16px;}
  .log-fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;}
  .log-fold>summary::-webkit-details-marker{display:none;}
  .log-fold>summary h2{margin:0;display:flex;align-items:center;gap:10px;width:100%;}
  .log-fold>summary h2::after{content:'';margin-left:auto;width:8px;height:8px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:rotate(45deg);transition:transform .2s;}
  .log-fold[open]>summary h2::after{transform:rotate(-135deg);}
  .log-fold[open]>summary{margin-bottom:10px;}
  .log-count{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--bg2);color:var(--ink3);}

  /* ── Сотрудники и доступ: карточка с подписями вместо тесной строки ── */
  .emp-access-card{border:1px solid var(--bg3);border-radius:var(--radius-md);padding:14px;margin-top:12px;}
  .emp-access-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;}
  .emp-access-badges{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .emp-access-dept{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);
    background:var(--bg2);border-radius:20px;padding:3px 9px;}
  .emp-access-role{font-size:11px;font-weight:600;color:var(--p6);background:var(--p1);border-radius:20px;padding:3px 9px;}
  .emp-access-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .emp-access-grid .full{grid-column:1 / -1;}
  .emp-access-grid .fld{min-width:0;}
  .emp-access-grid label.field-label{margin-bottom:6px;}
  .emp-save-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;}

  .emp-del{min-height:34px !important;padding:5px 12px !important;font-size:13px;}

  /* ── Тимлид: доступ сотрудников отдела ── */
  .tm-acc-row{padding:12px 0;border-bottom:1px solid var(--bg2);}
  .tm-acc-name{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;margin-bottom:8px;}
  .tm-acc-mail{font-size:14px;color:var(--ink3);word-break:break-all;}
  .tm-add{margin-top:18px;padding-top:16px;border-top:1px solid var(--bg3);}
  .tm-add h3{font-size:13px;font-weight:700;margin-bottom:12px;}
  .tm-name .role-tag, .tm-acc-name .role-tag{font-size:10px;font-weight:600;color:var(--p6);background:var(--p1);border-radius:20px;padding:2px 8px;white-space:nowrap;}

  /* ═══ Верхняя панель вместо боковой (только широкий экран; телефон не меняется) ═══ */
  .top-user{display:none;}
  @media (min-width: 900px){
    header.cover{
      width:auto;min-width:0;right:0;bottom:auto;height:60px;min-height:0;
      flex-direction:row;align-items:center;gap:28px;padding:0 32px;
      background:#131317;box-shadow:none;border-bottom:1px solid rgba(255,255,255,.07);
      overflow:visible;
    }
    header.cover::before, header.cover::after{display:none;}
    .brand{margin:0;flex:none;}
    .brand-banner{height:30px;}
    .tabs{flex-direction:row;align-items:center;align-self:stretch;gap:4px;background:none;border:0;border-radius:0;padding:0;backdrop-filter:none;}
    .tab{position:relative;height:36px;min-height:0;padding:0 14px;border-radius:8px;font-size:14px;font-weight:500;
         letter-spacing:0;color:rgba(255,255,255,.6);box-shadow:none;}
    .tab::before{display:none;}
    .tab:hover:not(.active){background:rgba(255,255,255,.06);color:#fff;}
    .tab.active{background:transparent;color:#fff;box-shadow:none;}
    .tab.active::after{content:'';position:absolute;left:14px;right:14px;bottom:-12px;height:2px;border-radius:2px 2px 0 0;background:var(--p4);}

    .top-user{display:flex;align-items:center;gap:12px;margin-left:auto;min-width:0;}
    .top-user:empty{display:none;}
    .tu-ava{width:32px;height:32px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
            background:rgba(255,255,255,.12);color:#fff;font-size:13px;font-weight:600;}
    .tu-meta{min-width:0;max-width:200px;line-height:1.25;}
    .tu-name{font-size:13.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .tu-sub{font-size:11.5px;color:rgba(255,255,255,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .tu-out{height:34px;padding:0 12px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:transparent;
            color:rgba(255,255,255,.75);font-family:var(--font);font-size:13px;cursor:pointer;transition:background .15s,color .15s;}
    .tu-out:hover{background:rgba(255,255,255,.08);color:#fff;}

    /* кнопка темы: значок вместо эмодзи */
    #themeBtn{position:static !important;top:auto !important;right:auto !important;margin:0;align-self:center;flex:none;
      width:34px;height:34px;padding:0;font-size:0 !important;border-radius:8px;
      background:transparent;border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.75);
      display:flex;align-items:center;justify-content:center;}
    #themeBtn:hover{background:rgba(255,255,255,.08);color:#fff;}

    /* содержимое: по центру, ограниченной ширины, под панелью */
    main#main{margin:60px auto 0;width:100%;max-width:1360px;padding:28px 32px 48px;min-height:calc(100vh - 60px);overflow-y:visible;}
    main#main.emp-split-view, main#main.admin-split-view{height:calc(100vh - 60px);padding-top:24px;padding-bottom:0;overflow-y:hidden;}
    .emp-dashboard-grid, .admin-dashboard-grid{height:calc(100vh - 60px - 64px);}
    #toastHost, #modalHost{left:0;}
    /* ровный фон страницы: без декоративного узора и без «полос» по краям центрированного содержимого */
    body{background:var(--bg1) !important;background-image:none !important;}
    main#main{background:transparent;}
  }

  /* ── Аналитика ── */
  .an-verdict{border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px;line-height:1.5;border:1px solid var(--bg3);border-left-width:4px;}
  .an-verdict.good{border-left-color:var(--green);background:rgba(29,185,84,.07);}
  .an-verdict.warn{border-left-color:var(--amber);background:rgba(245,158,11,.08);}
  .an-verdict.bad{border-left-color:var(--red);background:rgba(229,72,77,.07);}
  .an-verdict.info{border-left-color:var(--ink4);}
  .an-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:6px;}
  .an-stat{border:1px solid var(--bg3);border-radius:12px;padding:12px 14px;min-width:0;}
  .an-stat .l{font-size:11.5px;color:var(--ink3);margin-bottom:4px;}
  .an-stat .v{font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.2;}
  .an-stat .s{font-size:12px;color:var(--ink3);margin-top:3px;line-height:1.35;}
  .an-stat.good .v{color:var(--green);} .an-stat.warn .v{color:var(--amber);} .an-stat.bad .v{color:var(--red);}
  .an-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  .an-table th{font-size:11.5px;font-weight:600;color:var(--ink3);text-align:left;padding:0 10px 8px 0;white-space:nowrap;}
  .an-table td{padding:10px 10px 10px 0;border-top:1px solid var(--bg2);vertical-align:middle;white-space:nowrap;}
  .an-bar{height:8px;border-radius:4px;background:var(--bg2);overflow:hidden;}
  .an-bar i{display:block;height:100%;background:var(--p5);border-radius:4px;}
  .an-bad-text{color:var(--red);font-weight:700;}
  .an-dl-row{display:grid;grid-template-columns:120px 1fr;gap:4px 14px;padding:11px 0;border-top:1px solid var(--bg2);font-size:13.5px;}
  .an-dl-row:first-of-type{border-top:0;}
  .an-dl-date{font-weight:600;color:var(--ink2);}
  .an-dl-row.bad .an-dl-date{color:var(--red);}
  .an-dl-row.today .an-dl-date{color:var(--p6);}
  .an-dl-row.muted{opacity:.7;}
  .an-dl-who{font-size:12px;color:var(--ink3);margin-top:2px;}
  .an-flag{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:600;color:var(--amber);background:rgba(245,158,11,.12);}
  @media (max-width:600px){
    /* на телефоне оставляем главное: имя, в очереди, просрочено, ближайший срок */
    .an-table th:nth-child(2), .an-table td:nth-child(2), .an-table th:nth-child(n+6), .an-table td:nth-child(n+6){display:none;}
    .an-dl-row{grid-template-columns:96px 1fr;}
  }
  .an-how{margin-top:12px;}
  .an-how summary{cursor:pointer;font-size:12px;color:var(--ink3);user-select:none;}
  .an-note{font-size:12px;color:var(--ink3);line-height:1.5;margin-top:8px;}

  /* ═══ КНОПКИ — единственное место, где задаётся их цвет ═══════════════════
     Раньше цвет кнопок задавали три слоя стилей, и класс размера .small красил
     кнопку в зелёный, перебивая даже .secondary («Карточка» была зелёной).
     Теперь: размер — отдельно, цвет — только по смыслу.
       .btn            главное действие — фирменный фиолетовый
       .btn.secondary  второстепенное — нейтральная
       .btn.danger     удаление — красный контур
       .btn.small      на цвет не влияет (раньше именно он красил в зелёный)
     Зелёный и красный остаются для статусов (на смене, опоздание, план). */
  .btn{background:var(--p6);color:#fff;border:none;box-shadow:none;filter:none;}
  .btn:hover{background:var(--p7);filter:none;}
  .btn.teal{background:var(--p6);}
  .btn.teal:hover{background:var(--p7);}
  .btn.secondary{background:var(--bg1);color:var(--ink2);border:1px solid var(--bg3);}
  .btn.secondary:hover{background:var(--bg2);color:var(--ink);}
  .btn.danger{background:transparent;color:var(--red);border:1px solid rgba(229,72,77,.5);}
  .btn.danger:hover{background:rgba(229,72,77,.12);}
  .btn:disabled,.btn[disabled]{opacity:.5;cursor:default;transform:none;}
  .btn:focus-visible{outline:2px solid var(--p4);outline-offset:2px;}

  /* ── ОС: предупреждения и строка показателей ── */
  .os-alert{border:1px solid var(--bg3);border-left:4px solid var(--ink4);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13px;line-height:1.5;}
  .os-alert.amber{border-left-color:var(--amber);background:rgba(245,158,11,.07);}
  .os-alert.bad{border-left-color:var(--red);background:rgba(229,72,77,.06);}
  .os-alert ul{margin:6px 0 0 18px;padding:0;}
  .os-line{font-size:12px;color:var(--ink3);line-height:1.5;margin-top:4px;}
</style>
</head>

// =========================================================================
// ВХОД ПО ПОЧТЕ (Supabase Auth). Работает напрямую через REST, без SDK.
// Сессия хранится в localStorage; токен доступа обновляется сам.
// Роль администратора берётся из app_metadata.role === 'admin' — её нельзя
// изменить из браузера, её выставляет только владелец проекта в Supabase.
// =========================================================================
const AUTH_STORE = 'dramify-auth-v1';
const AUTH_FLASH = 'dramify-auth-msg';
let authSession = null;      // {access_token, refresh_token, expires_at(сек), user, needPw}
let authRefreshing = null;
let authBusy = false;

function authLoadSession(){
  try{ const raw = localStorage.getItem(AUTH_STORE); authSession = raw ? JSON.parse(raw) : null; }
  catch(e){ authSession = null; }
  return authSession;
}
function authSaveSession(sess){
  authSession = sess;
  try{ if(sess) localStorage.setItem(AUTH_STORE, JSON.stringify(sess)); else localStorage.removeItem(AUTH_STORE); }catch(e){}
}
function authFromResponse(j, keep){
  if(!j || !j.access_token) return null;
  return {
    access_token: j.access_token,
    refresh_token: j.refresh_token,
    expires_at: j.expires_at || (Math.floor(Date.now()/1000) + (j.expires_in || 3600)),
    user: j.user || (keep && keep.user) || null,
    needPw: keep ? !!keep.needPw : false
  };
}
function authEmail(){
  const u = authSession && authSession.user;
  return u && u.email ? String(u.email).trim().toLowerCase() : '';
}
function authIsAdmin(){
  const u = authSession && authSession.user;
  return !!(u && u.app_metadata && u.app_metadata.role === 'admin');
}

async function authRequest(path, method, body, token){
  const res = await fetch(SUPABASE_URL + '/auth/v1' + path, {
    method: method,
    headers: {
      'apikey': SUPABASE_ANON_KEY,
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + (token || SUPABASE_ANON_KEY)
    },
    body: body ? JSON.stringify(body) : undefined
  });
  let data = null;
  try{ data = await res.json(); }catch(e){}
  return { ok: res.ok, status: res.status, data: data };
}
function authErrText(r){
  const m = String((r.data && (r.data.error_description || r.data.msg || r.data.message || r.data.error)) || '');
  if(/invalid login credentials/i.test(m)) return 'Неверная почта или пароль';
  if(/email not confirmed/i.test(m)) return 'Почта не подтверждена. Откройте письмо-приглашение';
  if(/rate limit|too many|security purposes/i.test(m)) return 'Слишком много попыток. Подождите несколько минут';
  if(/at least \d+ char/i.test(m)) return 'Пароль слишком короткий — минимум 8 символов';
  if(/different from the old/i.test(m)) return 'Новый пароль должен отличаться от прежнего';
  if(/weak|easy to guess|pwned/i.test(m)) return 'Слишком простой пароль — придумайте посложнее';
  return m || ('Ошибка ' + r.status);
}

async function authSignIn(email, password){
  const r = await authRequest('/token?grant_type=password', 'POST', { email: String(email).trim(), password: password });
  if(!r.ok) return { error: authErrText(r) };
  authSaveSession(authFromResponse(r.data));
  return { ok: true };
}

// → 'ok' | 'denied' (сервер отказал: войти заново) | 'offline' (нет связи: сессию не трогаем)
function authRefresh(){
  if(authRefreshing) return authRefreshing;
  authRefreshing = (async function(){
    try{
      // другая вкладка могла уже обновить токен — берём её результат
      let stored = null;
      try{ stored = JSON.parse(localStorage.getItem(AUTH_STORE) || 'null'); }catch(e){}
      if(stored && stored.access_token && authSession && stored.access_token !== authSession.access_token
         && stored.expires_at * 1000 - Date.now() > 60000){
        authSession = stored; return 'ok';
      }
      const rt = authSession && authSession.refresh_token;
      if(!rt) return 'denied';
      const r = await authRequest('/token?grant_type=refresh_token', 'POST', { refresh_token: rt });
      if(r.ok){ authSaveSession(authFromResponse(r.data, authSession)); return 'ok'; }
      return (r.status === 400 || r.status === 401 || r.status === 403) ? 'denied' : 'offline';
    }catch(e){ return 'offline'; }
    finally{ authRefreshing = null; }
  })();
  return authRefreshing;
}
async function authToken(){
  if(!authSession) return SUPABASE_ANON_KEY;
  if(authSession.expires_at * 1000 - Date.now() < 60000) await authRefresh();
  return authSession ? authSession.access_token : SUPABASE_ANON_KEY;
}
async function sbHeaders(extra){
  const t = await authToken();
  return Object.assign({ 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + t }, extra || {});
}
let authUnauthHandling = false;
async function authOnUnauthorized(){
  if(authUnauthHandling || !authSession) return;
  authUnauthHandling = true;
  try{
    const st = await authRefresh();
    if(st === 'denied'){
      authSaveSession(null);
      try{ sessionStorage.setItem(AUTH_FLASH, 'Сессия истекла. Войдите снова'); }catch(e){}
      location.reload();
    }
  } finally { authUnauthHandling = false; }
}
async function authSignOut(){
  try{ if(authSession) await authRequest('/logout?scope=local', 'POST', null, authSession.access_token); }catch(e){}
  authSaveSession(null);
  // чужие закэшированные данные на общем устройстве не оставляем
  try{
    Object.keys(localStorage).forEach(function(k){ if(k.indexOf('lastgood:') === 0) localStorage.removeItem(k); });
  }catch(e){}
  location.reload();
}
async function authSendReset(email){
  const redirect = encodeURIComponent(location.origin + location.pathname);
  const r = await authRequest('/recover?redirect_to=' + redirect, 'POST', { email: String(email).trim() });
  return r.ok ? { ok: true } : { error: authErrText(r) };
}
async function authSetPassword(pw){
  const token = await authToken();
  const r = await authRequest('/user', 'PUT', { password: pw }, token);
  if(!r.ok) return { error: authErrText(r) };
  if(r.data && r.data.email && authSession){ authSession.user = r.data; }
  return { ok: true };
}

// Вход через Google: уводим на Supabase, он проведёт через Google и вернёт на этот же адрес
function authGoogleUrl(){
  return SUPABASE_URL + '/auth/v1/authorize?provider=google&redirect_to=' +
         encodeURIComponent(location.origin + location.pathname);
}

// Разбор ссылки из письма или возврата из Google. Токены приходят в #hash,
// а ошибки — то в #hash, то в ?query, поэтому смотрим оба места.
function authParseHash(){
  const h = (location.hash || '').replace(/^#/, '');
  const q = (location.search || '').replace(/^\?/, '');
  const clean = function(){ try{ history.replaceState(null, '', location.pathname); }catch(e){} };
  const pq = new URLSearchParams(q);
  if(pq.get('error') || pq.get('error_code')){
    const out = { error: pq.get('error_description') || pq.get('error') || 'Не удалось войти' };
    clean(); return out;
  }
  if(!h) return null;
  const p = new URLSearchParams(h);
  if(p.get('error') || p.get('error_code')){
    const out = { error: p.get('error_description') || p.get('error') || 'Ссылка недействительна' };
    clean(); return out;
  }
  if(p.get('access_token')){
    const sess = {
      access_token: p.get('access_token'),
      refresh_token: p.get('refresh_token'),
      expires_at: Number(p.get('expires_at')) || (Math.floor(Date.now()/1000) + Number(p.get('expires_in') || 3600)),
      user: null, needPw: false
    };
    const type = p.get('type') || '';
    clean(); return { session: sess, type: type };
  }
  return null;
}

// true → можно запускать приложение; false → показан экран входа / задания пароля
async function authBoot(){
  authLoadSession();
  let flash = '';
  try{ flash = sessionStorage.getItem(AUTH_FLASH) || ''; sessionStorage.removeItem(AUTH_FLASH); }catch(e){}
  const landing = authParseHash();

  if(landing && landing.error){
    const err = String(landing.error);
    const msg = /signup|sign up|not allowed|database error|unable to exchange/i.test(err)
      ? 'Этот Google-аккаунт не приглашён. Войдите с той почты, на которую вам дали доступ, или обратитесь к администратору.'
      : (/expired|invalid|otp/i.test(err)
        ? 'Ссылка устарела или уже использована. Нажмите «Забыли пароль?», чтобы получить новую.'
        : err);
    showAuthScreen('login', msg); return false;
  }
  if(landing && landing.session){
    const r = await authRequest('/user', 'GET', null, landing.session.access_token).catch(function(){ return { ok:false }; });
    if(!r.ok){ showAuthScreen('login', 'Не удалось открыть ссылку. Запросите новую через «Забыли пароль?».'); return false; }
    landing.session.user = r.data;
    landing.session.needPw = (landing.type === 'invite' || landing.type === 'recovery');
    authSaveSession(landing.session);
  }
  if(!authSession){ showAuthScreen('login', flash); return false; }
  if(authSession.needPw){ showAuthScreen('setpw'); return false; }
  if(authSession.expires_at * 1000 - Date.now() < 60000){
    const st = await authRefresh();
    if(st === 'denied'){ authSaveSession(null); showAuthScreen('login', 'Сессия истекла. Войдите снова'); return false; }
  }
  return true;
}

// =========================================================================
// ЗАЩИТА ОТ ПОТЕРИ ДАННЫХ
// Раньше storeGet возвращал null и когда данных нет, и когда запрос упал.
// Из-за этого при обрыве связи на старте приложение решало, что данных нет,
// заполняло месяц нулями и записывало эти нули в общее хранилище — цифры
// пропадали сразу у всех. Теперь ошибка чтения фиксируется отдельно, и пока
// состояние не прочитано успешно, запись важных ключей запрещена.
// =========================================================================
let storeReadFailed = false;   // была ли ошибка чтения в текущей серии
let pollFailStreak  = 0;       // сколько опросов подряд не прочитались
let stateLoaded = false;       // общее состояние успешно прочитано хотя бы раз

// Ключи, потеря которых необратима — их нельзя писать «вслепую»
const GUARDED_KEYS = [
  'app:kpiData', 'app:ledgerTotals', 'app:trackerData', 'app:cashTotals',
  'app:ordersData', 'app:ordersOverlay', 'app:employees', 'attendance:log',
  'app:schedules',
];

// Локальное зеркало общего хранилища. Каждое удачное чтение оседает здесь,
// и если база потом не ответила — отдаём последние известные хорошие данные,
// а не пустоту. Именно из-за пустоты приложение раньше подставляло демо-данные
// с чужими ID, и все цифры превращались в нули.
function cacheKey(key){ return 'lastgood:' + key; }
function cacheWrite(key, value){
  try{ localStorage.setItem(cacheKey(key), JSON.stringify({t: Date.now(), v: value})); }catch(e){}
}
function cacheRead(key){
  try{
    const raw = localStorage.getItem(cacheKey(key));
    if(!raw) return undefined;
    const parsed = JSON.parse(raw);
    return parsed && 'v' in parsed ? parsed.v : undefined;
  }catch(e){ return undefined; }
}

async function storeGet(key, shared){
  if(shared){
    try{
      const res = await fetch(`${SUPABASE_URL}/rest/v1/kv_store?key=eq.${encodeURIComponent(key)}&select=value`, {
        headers: await sbHeaders()
      });
      if(res.status === 401) authOnUnauthorized();
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if(!data || !data.length){
        // Ключа в базе нет. Если локально есть последнее хорошее значение —
        // отдаём его, но НЕ помечаем чтение как упавшее: связь-то в порядке.
        // Раньше этот флаг обрывал весь цикл синхронизации и блокировал запись,
        // из-за чего показатели то появлялись, то исчезали.
        const cached = cacheRead(key);
        if(cached !== undefined) return cached;
        return null;
      }
      const parsed = JSON.parse(data[0].value);
      cacheWrite(key, parsed);
      return parsed;
    }catch(e){
      console.error('storeGet failed', key, e);
      storeReadFailed = true;
      const cached = cacheRead(key);
      return cached !== undefined ? cached : null; // последние хорошие данные вместо пустоты
    }
  } else {
    try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }
    catch(e){ return null; }
  }
}

// Кто какие ключи может записывать. Зеркало правил доступа в базе (RLS,
// см. security.sql): там это и есть настоящая защита, а здесь — чтобы браузер
// сотрудника даже не пытался писать чужое (без лишних ошибок 403 в консоли).
// Синхронизацию с таблицами сотрудник всё равно видит — она считается у него
// в памяти, просто в базу её результат пишет только админ.
const STAFF_WRITE_KEYS = ['app:ordersOverlay'];
const TEAMLEAD_WRITE_KEYS = ['app:schedules', 'app:employees'];
function canWriteKey(key){
  if(authIsAdmin()) return true;
  if(STAFF_WRITE_KEYS.indexOf(key) >= 0 || String(key).indexOf('saletime:') === 0) return true;
  if(String(key).indexOf('att:') === 0) return true; // свои отметки; чужие база не пропустит
  const me = employees.find(e=>e.id===myEmployeeId);
  return !!(me && me.role==='teamlead' && TEAMLEAD_WRITE_KEYS.indexOf(key) >= 0);
}

async function storeSet(key, value, shared){
  if(shared){
    if(!canWriteKey(key) || appOutdated) return false;
    // Пока состояние не прочитано успешно — не трогаем важные ключи,
    // иначе можно затереть живые данные пустышкой.
    if(!stateLoaded && GUARDED_KEYS.indexOf(key) >= 0){
      console.warn('storeSet заблокирован — состояние ещё не загружено:', key);
      return false;
    }
    // Щит от обнуления: не отправляем пустые цифры, если локально
    // сохранена хорошая копия. Иначе нули разлетятся на все устройства.
    const shields = {
      'app:kpiData': kpiHasNumbers,
      'app:ledgerTotals': ledgerHasNumbers,
      'app:trackerData': trackerHasNumbers,
      'app:cashTotals': cashHasNumbers,
    };
    if(shields[key]){
      const good = cacheRead(key);
      if(good !== undefined && shields[key](good) && !shields[key](value)){
        console.warn('storeSet отклонён — попытка записать нули поверх живых данных:', key);
        return false;
      }
      if(shields[key](value)) cacheWrite(key, value); // запоминаем как последнее хорошее
    }
    for(let attempt=0; attempt<2; attempt++){
      try{
        const res = await fetch(`${SUPABASE_URL}/rest/v1/kv_store?on_conflict=key`, {
          method: 'POST',
          headers: await sbHeaders({
            'Content-Type': 'application/json',
            'Prefer': 'resolution=merge-duplicates,return=minimal'
          }),
          body: JSON.stringify([{ key, value: JSON.stringify(value), updated_at: new Date().toISOString() }])
        });
        if(res.ok) return true;
        if(res.status === 401) authOnUnauthorized();
        console.error('storeSet статус', res.status, 'для', key);
      }catch(e){ console.error('storeSet failed', key, e); }
      if(attempt===0) await new Promise(r=>setTimeout(r, 600));
    }
    return false;
  } else {
    try{ localStorage.setItem(key, JSON.stringify(value)); return true; }catch(e){ console.error(e); return false; }
  }
}

// ── Сохранение «только своей части» ────────────────────────────────────────
// Ссылки, KPI, итоги, заказы и т.п. лежат в базе одним объектом на ключ, а
// раньше каждый браузер перезаписывал объект ЦЕЛИКОМ своей копией. С несколькими
// админами (и вкладками, открытыми в фоне со вчерашнего дня) чужая устаревшая
// копия затирала свежие данные: пропадали вставленные ссылки, возвращались
// старые цифры в истории. Теперь перед записью берём свежий объект из базы и
// меняем в нём только свои пути (например ['2026-08','op']), остальное не трогаем.
async function storeGetFresh(key){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/kv_store?key=eq.${encodeURIComponent(key)}&select=value`, { headers: await sbHeaders() });
  if(res.status === 401) authOnUnauthorized();
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  return (data && data.length) ? JSON.parse(data[0].value) : null;
}
function getPath(obj, path){ return path.reduce((o,k)=> (o && typeof o==='object') ? o[k] : undefined, obj); }
function setPath(obj, path, val){
  let o = obj;
  for(let i=0;i<path.length-1;i++){
    if(!o[path[i]] || typeof o[path[i]] !== 'object' || Array.isArray(o[path[i]])) o[path[i]] = {};
    o = o[path[i]];
  }
  const last = path[path.length-1];
  if(val === undefined) delete o[last]; else o[last] = JSON.parse(JSON.stringify(val));
}
const mergeLocks = {};
// Возвращает обновлённый объект (свежий из базы + наши пути) или null, если записать не удалось.
function saveMerged(key, local, paths){
  const run = async ()=>{
    if(!canWriteKey(key) || appOutdated) return null;
    let fresh;
    try{ fresh = await storeGetFresh(key); }catch(e){ console.error('saveMerged: не прочитал', key, e); return null; }
    if(!fresh || typeof fresh !== 'object' || Array.isArray(fresh)) fresh = {};
    paths.forEach(p=> setPath(fresh, p, getPath(local, p)));
    const ok = await storeSet(key, fresh, SHARED);
    return ok ? fresh : null;
  };
  const p = (mergeLocks[key] || Promise.resolve()).then(run, run);
  mergeLocks[key] = p.catch(()=>{});
  return p;
}

// ── Устаревшая версия приложения ничего не пишет ────────────────────────────
// Вкладка, открытая до обновления сайта, работает на старом коде. Раз в 10 минут
// сверяем версию с сайтом; если она устарела — запись в базу выключается,
// в фоне вкладка перезагружается сама, на экране просим обновить страницу.
const APP_BUILD = '2026-10-03.4';

// ---------------------------------------------------------------------
// TG-уведомление: автозакрытие через 60 с, кнопка копирования
// ---------------------------------------------------------------------
let _tgTimerInterval = null;
let _tgSecsLeft = 60;

function buildTgText(payload, rates){
  const fmtAmt = (amt, symbol) => {
    if(!amt || isNaN(amt)) return null;
    let s = Number(amt).toLocaleString('ru-RU');
    if(symbol) s += ' ' + symbol;
    if(rates && rates.RUB && symbol === '₸'){
      const rub = Math.round(amt / rates.RUB);
      s += ' (' + Number(rub).toLocaleString('ru-RU') + ' ₽)';
    } else if(rates && rates.USD && symbol === '$'){
      const rub = Math.round(amt * rates.USD / rates.RUB);
      s += ' (' + Number(rub).toLocaleString('ru-RU') + ' ₽)';
    }
    return s;
  };

  // Определяем символ валюты по методу оплаты / стране
  let sym = '₸';
  const pm = (payload.payMethod||'').toLowerCase();
  if(pm.includes('usdt') || pm.includes('usd') || pm.includes('крипто')) sym = 'USDT';
  else if(pm.includes('₽') || pm.includes('руб')) sym = '₽';
  else if(pm.includes('$')) sym = '$';

  // Длительность: "1,5 мин+ЛЮКС" → "Lux 1,5 минуты"
  let dur = (payload.duration||'').trim();
  const isLux = dur.includes('+ЛЮКС') || dur.includes('+Lux');
  dur = dur.replace(/\+ЛЮКС/gi,'').replace(/\+Lux/gi,'').trim();
  // "1,5 мин" → "1,5 минуты", "2 мин" → "2 минуты"
  dur = dur.replace(/мин$/, 'минуты').trim();
  if(isLux) dur = 'Lux ' + dur;

  const lines = [];
  lines.push('ФИО : ' + (payload.clientName||'—'));
  if(payload.phone) lines.push('Номер для связи : ' + payload.phone);
  if(payload.prepayment) lines.push('Предоплата : ' + (fmtAmt(payload.prepayment, sym)||payload.prepayment));
  if(payload.remainder) lines.push('Остаток : ' + (fmtAmt(payload.remainder, sym)||payload.remainder));
  if(payload.total) lines.push('Полная сумма : ' + (fmtAmt(payload.total, sym)||payload.total));
  if(payload.deliveryDate) lines.push('Дата : ' + payload.deliveryDate);
  if(dur) lines.push('Длительность : ' + dur);
  if(payload.source) lines.push('Примечание : ' + payload.source);
  return lines.join('\n');
}

async function fetchRates(){
  // Используем open.er-api.com — бесплатный, без ключа, CORS-friendly
  try{
    const r = await fetch('https://open.er-api.com/v6/latest/RUB');
    if(!r.ok) return null;
    const d = await r.json();
    // d.rates содержит курсы относительно RUB
    // RUB→KZT: d.rates.KZT, RUB→USD: 1/d.rates.USD
    return d.rates || null;
  }catch(e){ return null; }
}

async function showTgNotif(payload){
  const overlay = document.getElementById('tgNotifOverlay');
  const textEl  = document.getElementById('tgNotifText');
  const timerEl = document.getElementById('tgNotifTimer');
  const fillEl  = document.getElementById('tgNotifTimerFill');
  const copyBtn = document.getElementById('tgCopyBtn');
  // ИСПРАВЛЕНО: проверялся только overlay, а обращались к copyBtn/textEl/timerEl/fillEl.
  // Если разметку модалки поменять — падало с TypeError уже после успешной отправки заявки.
  if(!overlay || !textEl || !timerEl || !fillEl || !copyBtn) return;

  // Сброс
  if(_tgTimerInterval) clearInterval(_tgTimerInterval);
  copyBtn.textContent = '📋 Скопировать';
  copyBtn.classList.remove('copied');

  // Текст без курса пока грузится
  let text = buildTgText(payload, null);
  textEl.textContent = text;
  overlay.classList.add('visible');

  // Таймер 60 сек
  _tgSecsLeft = 60;
  timerEl.textContent = _tgSecsLeft;
  fillEl.style.transition = 'none';
  fillEl.style.width = '100%';
  requestAnimationFrame(()=>{
    fillEl.style.transition = 'width 60s linear';
    fillEl.style.width = '0%';
  });
  _tgTimerInterval = setInterval(()=>{
    _tgSecsLeft--;
    timerEl.textContent = _tgSecsLeft;
    if(_tgSecsLeft <= 0){ closeTgNotif(); }
  }, 1000);

  // Загружаем курс асинхронно и обновляем текст
  fetchRates().then(rates => {
    if(!rates) return;
    // rates из open.er-api.com: RUB→X
    // Нам нужно KZT→RUB: 1 ₸ = 1/rates.KZT рублей
    // Переводим в удобный формат: сколько RUB за 1 KZT
    // open.er-api.com/latest/RUB: rates.KZT = сколько тенге за 1 рубль
    // Для buildTgText: normalized.RUB = сколько тенге за 1 рубль
    const normalized = { RUB: rates.KZT };
    text = buildTgText(payload, normalized);
    textEl.textContent = text;
  });
}

// ---------------------------------------------------------------------
// Модалка подтверждения вместо confirm() — с плавным появлением.
// ---------------------------------------------------------------------
function showConfirm(title, text, confirmLabel){
  return new Promise((resolve)=>{
    const host = document.getElementById('modalHost');
    if(!host){ resolve(false); return; }
    host.innerHTML = `
      <div class="modal-backdrop" data-modal-close></div>
      <div class="modal-sheet" role="dialog" aria-modal="true">
        <div class="modal-title">${escapeHtml(title)}</div>
        <div class="modal-text">${escapeHtml(text)}</div>
        <div class="modal-actions">
          <button class="btn secondary" data-modal-cancel>Отмена</button>
          <button class="btn danger" style="background:var(--rust);color:#fff;" data-modal-confirm>${escapeHtml(confirmLabel||'Удалить')}</button>
        </div>
      </div>`;
    requestAnimationFrame(()=> host.classList.add('open'));
    const close = (result)=>{
      host.classList.remove('open');
      setTimeout(()=>{ host.innerHTML=''; }, 260);
      resolve(result);
    };
    host.querySelector('[data-modal-confirm]').addEventListener('click', ()=>close(true), {once:true});
    host.querySelector('[data-modal-cancel]').addEventListener('click', ()=>close(false), {once:true});
    host.querySelector('[data-modal-close]').addEventListener('click', ()=>close(false), {once:true});
  });
}

// ---------------------------------------------------------------------
// Фоновая синхронизация: раньше данные с других устройств подтягивались
// только когда сотрудник нажимал «START/END», а вручную обновить общий
// прогресс можно было только кнопкой синхронизации с Google Таблицей.
// Теперь общее хранилище (сотрудники, KPI, логи, ссылки на таблицы)
// периодически перечитывается само, без участия пользователя.
// ---------------------------------------------------------------------
let isPolling = false;
let pollTimer = null;
let lastSyncSnapshot = '';

function isEditingSomething(){
  const a = document.activeElement;
  if(!a) return false;
  const tag = a.tagName;
  return (tag==='INPUT' || tag==='SELECT' || tag==='TEXTAREA') && document.getElementById('main').contains(a);
}

// =========================================================================
// ЩИТ ОТ ОБНУЛЕНИЯ
// Проверяем не «текущее против нового», а «последнее хорошее против нового».
// Если новые данные пустые там, где раньше были цифры — это регресс: мы его
// не принимаем и возвращаем в базу свою хорошую копию, чтобы вылечить остальных.
// =========================================================================
function kpiHasNumbers(obj){
  if(!obj) return false;
  return Object.keys(obj).some(mk=>{
    const month = obj[mk];
    if(!month || typeof month !== 'object') return false;
    return Object.keys(month).some(empId=>{
      const k = month[empId];
      if(!k || typeof k !== 'object') return false;
      return ['orders','netAmount','deals','revenue','completed','actualCash']
        .some(f => (Number(k[f])||0) > 0);
    });
  });
}
function ledgerHasNumbers(obj){
  if(!obj) return false;
  return Object.keys(obj).some(mk=>{
    const m = obj[mk] || {};
    return ['op','to'].some(d=>{
      const e = m[d];
      return e && ((Number(e.gross)||0)>0 || (Number(e.allGross)||0)>0 || (Number(e.allPrepaid)||0)>0);
    });
  });
}
function trackerHasNumbers(obj){
  if(!obj) return false;
  return Object.keys(obj).some(mk=>{
    const t = obj[mk];
    return t && ((Number(t.effectivePlan)||0)>0 || (Number(t.currentSum)||0)>0);
  });
}
function cashHasNumbers(obj){
  if(!obj) return false;
  return Object.keys(obj).some(mk=>{
    const t = obj[mk];
    return t && ((Number(t.prepaid)||0)>0 || (Number(t.pending)||0)>0);
  });
}

// Принять входящие данные, только если они не «хуже» текущих.
// Возвращает true, если наши данные лучше и их стоит записать обратно.
function guardRegression(incoming, current, hasNumbers, label){
  if(!incoming) return false;
  const incomingGood = hasNumbers(incoming);
  const currentGood = hasNumbers(current);
  if(!incomingGood && currentGood){
    console.warn('Отклонил обнулённые данные:', label);
    return true; // наши лучше — вернём их в базу
  }
  return false;
}

async function pollSharedData(){
  if(isPolling || document.visibilityState==='hidden') return;
  isPolling = true;
  try{
    storeReadFailed = false;
    const [freshEmployees, freshKpi, freshLogs, freshActiveMonth, freshAdminPin, freshSheetUrls, freshSchedules, freshLedger, freshTrackerUrl, freshTrackerData, freshOrdersCsv, freshOrdersOv, freshCashUrls, freshCashTotals, freshPlanOv] = await Promise.all([
      storeGet('app:employees', SHARED),
      storeGet('app:kpiData', SHARED),
      loadAttendance(),
      storeGet('app:activeMonth', SHARED),
      storeGet('app:adminPin', SHARED),
      storeGet('app:sheetUrls', SHARED),
      storeGet('app:schedules', SHARED),
      storeGet('app:ledgerTotals', SHARED),
      storeGet('app:trackerUrls', SHARED),
      storeGet('app:trackerData', SHARED),
      storeGet('app:ordersData', SHARED),
      storeGet('app:ordersOverlay', SHARED),
      storeGet('app:cashUrls', SHARED),
      storeGet('app:cashTotals', SHARED),
      storeGet('app:planOverrides', SHARED),
    ]);
    // Если чтение упало — данные могли прийти из локального кэша.
    // Применять их поверх текущих не нужно: в памяти уже актуальнее.
    if(storeReadFailed){
      // Одна сетевая ошибка из четырнадцати запросов — ещё не потеря связи.
      // Раньше любой единичный сбой сразу выключал сохранение и показывал
      // тревожный тост, а следующий успешный опрос возвращал всё обратно —
      // отсюда мигание «нет связи / связь восстановлена».
      // Теперь переходим в режим только чтения лишь после двух подряд.
      pollFailStreak++;
      if(pollFailStreak >= 2 && stateLoaded){
        stateLoaded = false;
        showToast('Нет связи с базой — сохранение приостановлено', 'error');
      }
      return;
    }
    pollFailStreak = 0;

    // Чтение прошло успешно — если раньше сидели в режиме «только чтение»,
    // связь вернулась, можно снова сохранять.
    if(!stateLoaded){
      stateLoaded = true;
      showToast('Связь с базой восстановлена', 'success');
    }

    const snapshot = JSON.stringify({freshEmployees, freshKpi, freshLogs, freshActiveMonth, freshAdminPin, freshSheetUrls, freshSchedules, freshLedger, freshTrackerUrl, freshTrackerData, freshOrdersCsv, freshOrdersOv, freshCashUrls, freshCashTotals, freshPlanOv});
    if(snapshot === lastSyncSnapshot) return;
    lastSyncSnapshot = snapshot;

    // Пустой массив — не повод стирать людей. Раньше проверка if(freshEmployees)
    // пропускала [] (пустой массив в JS истинный), и все имена исчезали.
    if(Array.isArray(freshEmployees) && freshEmployees.length > 0){
      employees = normalizeEmployees(freshEmployees);
      linkAuthIdentity(false);
    } else if(Array.isArray(freshEmployees) && freshEmployees.length === 0 && employees.length > 0){
      console.warn('Отклонил пустой список сотрудников — возвращаю свой в базу');
      if(stateLoaded) storeSet('app:employees', employees, SHARED);
    }

    // Щит: не принимаем обнулённые данные поверх живых, а свои — возвращаем в базу
    const healBack = [];
    if(guardRegression(freshKpi, kpiData, kpiHasNumbers, 'kpiData')) healBack.push(['app:kpiData', ()=>kpiData]);
    else if(freshKpi) kpiData = freshKpi;

    if(guardRegression(freshLedger, ledgerTotals, ledgerHasNumbers, 'ledgerTotals')) healBack.push(['app:ledgerTotals', ()=>ledgerTotals]);
    else if(freshLedger) ledgerTotals = freshLedger;

    if(guardRegression(freshTrackerData, trackerData, trackerHasNumbers, 'trackerData')) healBack.push(['app:trackerData', ()=>trackerData]);
    else if(freshTrackerData) trackerData = freshTrackerData;

    if(guardRegression(freshCashTotals, cashTotals, cashHasNumbers, 'cashTotals')) healBack.push(['app:cashTotals', ()=>cashTotals]);
    else if(freshCashTotals) cashTotals = Object.assign({}, cashTotals, freshCashTotals);

    if(healBack.length && stateLoaded){
      for(const [key, get] of healBack){ storeSet(key, get(), SHARED); }
    }

    if(Array.isArray(freshLogs)) logs = freshLogs;
    if(freshActiveMonth) activeMonth = freshActiveMonth;
    if(freshAdminPin) adminPin = freshAdminPin;
    if(freshSheetUrls) sheetUrls = Object.assign({}, sheetUrls, freshSheetUrls);
    if(freshSchedules && Object.keys(freshSchedules).length > 0) schedules = freshSchedules;
    if(freshTrackerUrl) trackerUrls = Object.assign({}, trackerUrls, freshTrackerUrl);
    if(freshCashUrls) cashUrls = Object.assign({}, cashUrls, freshCashUrls);
    if(freshPlanOv && typeof freshPlanOv === 'object') planOverrides = freshPlanOv;
    if(freshOrdersCsv && Object.keys(freshOrdersCsv).length > 0) ordersData = freshOrdersCsv;
    if(freshOrdersOv && Object.keys(freshOrdersOv).length > 0) ordersOverlay = freshOrdersOv;
    if(editingMonth === activeMonth || !kpiData[editingMonth]) editingMonth = activeMonth;

    // если сотрудника, под которым мы сейчас смотрим панель, удалили с другого устройства — выходим на выбор
    if(myEmployeeId && !employees.find(e=>e.id===myEmployeeId)){ myEmployeeId = null; }

    if(!isEditingSomething()) render();
  }catch(e){ console.error('pollSharedData failed', e); }
  finally{
    // хвосты времени продаж — отправляем, если были проблемы со связью
    if(stateLoaded) flushSaleTimeQueue();
    if(mode==='admin' && adminUnlocked) ensureSaleTimes(editingMonth);
    isPolling = false;
  }
}

function startBackgroundSync(){
  if(pollTimer) return;
  pollSharedData();
  pollTimer = setInterval(pollSharedData, 8000);
}
function stopBackgroundSync(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible'){ pollSharedData(); startBackgroundSync(); }
  else { stopBackgroundSync(); }
});
window.addEventListener('focus', pollSharedData);
window.addEventListener('pagehide', stopBackgroundSync);

// ---------------------------------------------------------------------
// Календарь / график смен
// ---------------------------------------------------------------------
function daysInMonthOf(monthKey){
  const [y,m] = monthKey.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}
function isOffDay(empId, monthKey, day){
  return !!(schedules[monthKey] && schedules[monthKey][empId] && schedules[monthKey][empId][day]);
}
async function toggleOffDay(empId, monthKey, day){
  if(!schedules[monthKey]) schedules[monthKey] = {};
  if(!schedules[monthKey][empId]) schedules[monthKey][empId] = {};
  if(schedules[monthKey][empId][day]) delete schedules[monthKey][empId][day];
  else schedules[monthKey][empId][day] = true;
  const m = await saveMerged('app:schedules', schedules, [[monthKey, empId]]);
  if(m) schedules = m;
}

// ── Время начала смены ─────────────────────────────────────────────────────
// Хранится в том же ключе app:schedules (его правят админ и тимлид):
//   schedules._shift[empId]               — обычное начало смены, 'ЧЧ:ММ'
//   schedules._shiftDay[mk][empId][day]   — другое время в конкретный день
// Опоздание — первый приход позже начала смены больше чем на LATE_GRACE_MIN.
const LATE_GRACE_MIN = 5;
let calMode = 'off';          // что делает клик по дню в редакторе: 'off' выходной | 'time' время смены
let calModeTime = '12:00';
function validHHMM(v){ return /^([01]\d|2[0-3]):[0-5]\d$/.test(String(v||'')); }
// Если админ/тимлид не задал время — смена начинается в 11:00
const DEFAULT_SHIFT_START = '11:00';
function shiftExplicit(empId){ const m = schedules._shift || {}; return validHHMM(m[empId]) ? m[empId] : null; }
function shiftDefault(empId){ return shiftExplicit(empId) || DEFAULT_SHIFT_START; }
function shiftOverride(empId, mk, day){
  const m = (((schedules._shiftDay||{})[mk])||{})[empId] || {};
  return validHHMM(m[day]) ? m[day] : null;
}
function shiftStartFor(empId, mk, day){ return shiftOverride(empId, mk, day) || shiftDefault(empId); }
async function setShiftDefault(empId, val){
  schedules._shift = Object.assign({}, schedules._shift||{});
  // время по умолчанию не храним: если общее время когда-то поменяется, сотрудник поедет вместе с ним
  if(validHHMM(val) && val !== DEFAULT_SHIFT_START) schedules._shift[empId] = val; else delete schedules._shift[empId];
  const m = await saveMerged('app:schedules', schedules, [['_shift', empId]]);
  if(m) schedules = m;
  return !!m;
}
async function toggleShiftDay(empId, mk, day, val){
  const all = schedules._shiftDay = schedules._shiftDay || {};
  const mm = all[mk] = all[mk] || {};
  const em = mm[empId] = mm[empId] || {};
  if(em[day] === val || !validHHMM(val)) delete em[day]; else em[day] = val;
  const m2 = await saveMerged('app:schedules', schedules, [['_shiftDay', mk, empId]]);
  if(m2) schedules = m2;
  return !!m2;
}
function hhmmToMin(v){ const [h,m] = v.split(':').map(Number); return h*60+m; }
function minToHHMM(x){ x = Math.round(x); return String(Math.floor(x/60)%24).padStart(2,'0') + ':' + String(x%60).padStart(2,'0'); }
function fmtLate(min){ return min>=60 ? Math.floor(min/60)+'ч '+(min%60)+'м' : min+' мин'; }

// Панель над редактируемым календарём: обычное начало смены и режим клика
function renderShiftEditor(empId){

    <div class="shift-mode">
      <button class="att-btn${calMode==='off'?' on':''}" data-calmode="off">Выходной</button>
      <button class="att-btn${calMode==='time'?' on':''}" data-calmode="time">Другое время</button>
      ${calMode==='time' ? `<input type="time" id="calModeTime" value="${calModeTime}">` : ''}
    </div>
    <div class="hint" style="margin:2px 0 0;">${calMode==='off'
      ? 'Нажимайте на дни, чтобы отметить выходной.'
      : `Нажимайте на дни, где смена начинается в ${calModeTime}. Повторное нажатие — вернуть обычное время.`}</div>

}

const WEEKDAY_LETTERS = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

// editable=true — календарь кликабельный (админка); иначе только для просмотра (сотрудник)
function renderCalendarGrid(empId, monthKey, editable){
  const total = daysInMonthOf(monthKey);
  const [y,m] = monthKey.split('-').map(Number);
  const firstWeekday = (new Date(y, m-1, 1).getDay() + 6) % 7; // 0=Пн
  const todayStr = new Date().toDateString();

  let cells = '';
  for(let i=0;i<firstWeekday;i++) cells += `<div class="cal-cell cal-empty"></div>`;
  for(let d=1; d<=total; d++){
    const off = isOffDay(empId, monthKey, d);
    const isToday = new Date(y, m-1, d).toDateString() === todayStr;
    const cls = ['cal-cell'];
    if(off) cls.push('off');
    if(isToday) cls.push('today');
    if(editable) cls.push('editable');
    const ov = !off ? shiftOverride(empId, monthKey, d) : null;
    if(ov) cls.push('shifted');
    cells += `<div class="${cls.join(' ')}" ${editable?`data-caltoggle="${empId}" data-calday="${d}" data-calmonth="${monthKey}"`:''}>${d}${ov?`<span class="cal-time">${ov}</span>`:''}</div>`;
  }
  const def = shiftDefault(empId);
  // Для сотрудника — список дней, когда смена начинается не как обычно
  let special = '';
  if(!editable){
    const todayD = new Date(); todayD.setHours(0,0,0,0);
    const items = [];
    for(let d=1; d<=total; d++){
      const ov = !isOffDay(empId, monthKey, d) ? shiftOverride(empId, monthKey, d) : null;
      if(!ov || ov===def) continue;
      const dt = new Date(y, m-1, d);
      const past = dt < todayD, isT = dt.getTime()===todayD.getTime();
      items.push(`<div class="shift-day${past?' past':''}${isT?' today':''}">
        <span>${dt.toLocaleDateString('ru-RU',{day:'numeric', month:'short', weekday:'short'})}${isT?' · сегодня':''}</span>
        <b>с ${ov}</b></div>`);
    }
    special = items.length
      ? `<div class="shift-days"><div class="shift-days-h">Смена не в ${def}</div>${items.join('')}</div>`
      : '';
  }
  return `
    ${!editable ? `<div class="hint" style="margin:-4px 0 8px;">Обычное начало смены: <b>${def}</b></div>` : ''}
    <div class="cal-wrap">
      <div class="cal-weekdays">${WEEKDAY_LETTERS.map(w=>`<div class="cal-wd">${w}</div>`).join('')}</div>
      <div class="cal-grid">${cells}</div>
    </div>
    ${special}`;
}

// ---------------------------------------------------------------------
// Финансы компании: грязная/чистая касса, остаток, прогноз к концу месяца
// ---------------------------------------------------------------------
// План делится поровну между сотрудниками отдела от одной и той же цели трекера:
// ОП продаёт, ТО делает — по факту это одна и та же сумма, просто у каждого отдела
// свой список людей, между которыми она делится.
// Ставки: процент выполнения → ставка. Границы: нижняя включается, «выше 140» — строго больше.
function rateFor(pct){
  if(pct==null || isNaN(pct)) return null;
  if(pct>140) return 13;
  if(pct>=120) return 12;
  if(pct>=100) return 11;
  if(pct>=83)  return 10;
  if(pct>=67)  return 8;
  return 6;
}
// Ставка сейчас: фикс-ставка важнее; иначе по сетке от выполнения плана.
// Процент НЕ ограничиваем сотней — от этого зависит ставка выше 100%.
// Одна функция для сводки отдела и личной карточки, чтобы цифры совпадали.
function currentRateFor(e, num, den){
  const fixed = empFixedRate(e);
  if(fixed!=null) return fixed;
  return den>0 ? rateFor(num/den*100) : null;
}
// Ступени сетки rateFor: нижняя граница включается, кроме «более 140» — строго больше.
const RATE_STEPS = [
  {pct:67,  rate:8,  label:'67%'},
  {pct:83,  rate:10, label:'83%'},
  {pct:100, rate:11, label:'100%'},
  {pct:120, rate:12, label:'120%'},
  {pct:140, rate:13, label:'более 140%', strict:true},
];
// Сколько ₸ не хватает до ближайшей ступени выше текущей. null — плана нет;
// {max:true} — ставка уже максимальная. Минимальную сумму подбираем через сам
// rateFor, чтобы граница совпадала с ним до тенге (без ошибок округления).
function nextRateStep(num, den){
  if(!(den>0)) return null;
  const cur = rateFor(num/den*100);
  const step = RATE_STEPS.find(s=> s.rate > cur);
  if(!step) return {max:true, rate:cur};
  let n = step.strict ? Math.floor(step.pct*den/100) + 1 : Math.ceil(step.pct*den/100);
  while(rateFor(n/den*100) < step.rate) n++;
  while(n-1 > num && rateFor((n-1)/den*100) >= step.rate) n--;
  return {rate: step.rate, label: step.label, need: Math.max(0, n - num), target: n};
}
// Роль и фиксированная ставка. role: 'teamlead' | '' ; fixedRate: число (%) или null.
// У тимлида ставка не зависит от выполнения плана.
function empRoleLabel(e){
  if(!e || e.role!=='teamlead') return '';
  return e.department==='to' ? 'Тимлид ТО' : e.department==='os' ? 'Тимлид ОС' : 'Тимлид';
}
function empFixedRate(e){
  if(!e || e.fixedRate==null || e.fixedRate==='') return null;
  const n = Number(e.fixedRate);
  return isNaN(n) ? null : n;
}
// Для уже сохранённого в базе списка, где у Алихана ещё нет полей роли.
// Как только админ сохранит список в «Сотрудники и PIN», role становится явной
// (даже пустой) и это правило больше не вмешивается.
function normalizeEmployees(list){
  if(!Array.isArray(list)) return list;
  list.forEach(e=>{
    if(e && e.department!==undefined){ const d = normDept(e.department); if(d !== e.department) e.department = d; }
    if(e && e.name==='Алихан' && e.department==='to' && e.role===undefined){
      e.role = 'teamlead';
      if(e.fixedRate===undefined) e.fixedRate = 8;
    }
  });
  return list;
}
// Вся выручка продаж: касса компании (включает основателей и продажи без имени)
// либо сумма по сотрудникам ОП — что больше.
function opRevenueTotal(monthKey){
  const mk = monthKey||activeMonth;
  const opSum = employees.filter(e=>e.department==='op')
    .reduce((s,e)=> s + (Number(getKpi(e.id,mk).revenue)||0), 0);
  const fin = companyFinance(mk);
  return Math.max(fin.netCash||0, opSum);
}
// Общая цель отдела: ОП — план из трекера, ТО — то, что сделали ОП.
function deptPlanTotal(deptKey, monthKey){
  const mk = monthKey||activeMonth;
  if(deptKey!=='op' && deptKey!=='to') return null; // у ОС плана нет
  if(deptKey==='to'){
    const base = opRevenueTotal(mk);
    return base>0 ? base : null;
  }
  const td = trackerData[mk];
  return (td && td.effectivePlan) ? td.effectivePlan : null;
}
// Ручной план сотрудника на месяц (или null — считается автоматически).
function planOverrideFor(empId, monthKey){
  const m = planOverrides[monthKey||activeMonth];
  if(!m || m[empId]==null || m[empId]==='') return null;
  const n = Number(m[empId]);
  return isNaN(n) || n<0 ? null : n;
}
// Раскладка цели отдела по людям. Кому план задан вручную — тому он и стоит,
// остаток цели делится поровну между остальными. Пример: новичку посреди
// месяца ставят 300 000, остальные автоматически добирают разницу.
function deptPlanSplit(deptKey, monthKey){
  const mk = monthKey||activeMonth;
  const list = employees.filter(e=>e.department===deptKey);
  const total = deptPlanTotal(deptKey, mk);
  const fixed = {};
  let fixedSum = 0;
  list.forEach(e=>{ const v = planOverrideFor(e.id, mk); if(v!=null){ fixed[e.id] = v; fixedSum += v; } });
  const autoCount = list.length - Object.keys(fixed).length;
  const autoEach = (total!=null && autoCount>0) ? Math.round(Math.max(0, total - fixedSum) / autoCount) : null;
  const plans = {};
  list.forEach(e=>{
    plans[e.id] = fixed[e.id]!=null ? fixed[e.id] : autoEach;
  });
  return { total, fixedSum, autoEach, autoCount, plans, fixed, overflow: total!=null && fixedSum>total };
}
// План конкретного сотрудника: ручной или его доля в раскладке отдела.
function planFor(empOrId, monthKey){
  const e = typeof empOrId==='object' ? empOrId : employees.find(x=>x.id===empOrId);
  if(!e) return null;
  const v = deptPlanSplit(e.department, monthKey).plans[e.id];
  return v==null ? null : v;
}

function companyFinance(monthKey){
  ensureMonth(monthKey);
  const lt = ledgerTotals[monthKey] || {};
  const to = lt.to || null;
  const td = trackerData[monthKey];

  let netCash, pendingCash, grossCash, totalPlan, source;

  if(td){
    netCash = td.currentSum || 0;
    totalPlan = td.effectivePlan || 0;
    pendingCash = Math.max(0, td.remainingToPlan || 0);
    grossCash = netCash + pendingCash;
    source = 'tracker';
  } else if(to){
    netCash = to.net;
    pendingCash = to.pending;
    grossCash = to.gross;
    totalPlan = 0;
    employees.forEach(e=>{
      if(e.department==='to'){
        const k = getKpi(e.id, monthKey);
        totalPlan += Number(k.plan)||0;
      }
    });
    source = 'ledger';
  } else {
    netCash = 0; pendingCash = 0; totalPlan = 0;
    employees.forEach(e=>{
      if(e.department==='to'){
        const k = getKpi(e.id, monthKey);
        netCash += Number(k.netAmount)||0;
        pendingCash += Number(k.pending)||0;
        totalPlan += Number(k.plan)||0;
      }
    });
    grossCash = netCash + pendingCash;
    source = 'cards';
  }

  const planPct = totalPlan>0 ? Math.round(netCash/totalPlan*100) : 0;
  const trendPct = (source==='tracker' && td) ? td.trendPct : planPct;
  // Чистая касса и висящий остаток. Приоритет — отдельный лист «Касса»
  // (там просто суммы колонок). Если его нет — считаем по листам ОП/ТО.
  const ct = cashTotals[monthKey];
  let sheetPrepaid = null, sheetOutstanding = null, cashSource = null;
  if(ct && (ct.prepaid>0 || ct.pending>0)){
    sheetPrepaid = ct.prepaid; sheetOutstanding = ct.pending; cashSource = 'cash-sheet';
  } else {
    const cands = [lt.op, lt.to].filter(x=>x && x.allRows>0).sort((a,b)=>b.allRows-a.allRows);
    if(cands[0]){ sheetPrepaid = cands[0].allPrepaid; sheetOutstanding = cands[0].allPending; cashSource = 'ledger'; }
  }
  return {netCash, pendingCash, grossCash, totalPlan, planPct, trendPct, source, hasLedger: !!to, toBreakdown: to, sheetPrepaid, sheetOutstanding, cashSource};
}

// Общий план (цель из трекера) делится ПОРОВНУ между сотрудниками внутри
// каждого отдела отдельно — у ОП и у ТО берётся одна и та же сумма цели
// (ОП продаёт, ТО делает — деньги одни и те же), просто делится каждая
// на свою численность отдела.
// ---------------------------------------------------------------------
// Сводка по отделу для обзорной панели админа: суммарные цифры отдела
// плюс построчный список сотрудников с их ключевой метрикой.
// ---------------------------------------------------------------------
// Среднее время выполнения заказа сотрудником за месяц.
// Берём finalTime — он проставляется, когда заказ переходит в финальный статус.
function avgCompletionTime(empId, monthKey){
  const times = getOrdersForEmp(empId, monthKey)
    .map(o=>o.finalTime)
    .filter(t=>t!=null && t>0);
  if(!times.length) return null;
  return {ms: times.reduce((a,b)=>a+b,0)/times.length, count: times.length};
}

// Личная тенденция: сколько сотрудник сделал против того, сколько должен был
// сделать к этому дню месяца. Рабочие дни считаем по его личному календарю,
// чтобы выходные не портили картину.
function personalTrend(empId, monthKey, value, plan){
  if(!plan || plan<=0) return null;
  if(monthKey !== currentMonthKey()) return null; // тенденция имеет смысл только для текущего месяца
  const total = daysInMonthOf(monthKey);
  const today = Math.min(new Date().getDate(), total);
  let workedSoFar = 0, workTotal = 0;
  for(let d=1; d<=total; d++){
    if(isOffDay(empId, monthKey, d)) continue;
    workTotal++;
    if(d<=today) workedSoFar++;
  }
  if(workTotal<=0 || workedSoFar<=0) return null;
  const expected = plan * (workedSoFar/workTotal);
  if(expected<=0) return null;
  return {
    pct: Math.round(value/expected*100),
    expected: Math.round(expected),
    workedSoFar, workTotal,
  };
}

// Сколько сотруднику нужно делать в день до конца месяца, чтобы выйти в план.
// Остаток плана делим на оставшиеся рабочие дни по его календарю (сегодня включительно).
function dailyNeed(empId, monthKey, value, plan){
  if(!plan || plan<=0) return null;
  if(monthKey !== currentMonthKey()) return null;
  const total = daysInMonthOf(monthKey);
  const today = Math.min(new Date().getDate(), total);
  let daysLeft = 0;
  for(let d=today; d<=total; d++){ if(!isOffDay(empId, monthKey, d)) daysLeft++; }
  const remaining = Math.max(0, plan - (Number(value)||0));
  return {
    remaining: Math.round(remaining),
    daysLeft,
    perDay: remaining<=0 ? 0 : Math.round(remaining / Math.max(1, daysLeft)),
  };
}
// Ставка (% от продажи), если сотрудник продолжит в том же темпе:
// берём % тенденции и прогоняем через ту же сетку ставок. Фикс-ставка важнее.
function trendRateFor(e, trend){
  if(empFixedRate(e)!=null) return empFixedRate(e);
  return trend ? rateFor(trend.pct) : null;
}

function deptOverview(dept, monthKey){
  const def = DEPARTMENTS[dept];
  if(!def || !def.ratio) return null; // ОС — своя плашка (renderOsPlate), без плана
  const list = employees.filter(e=>e.department===dept);
  if(!list.length) return null;

  const split = deptPlanSplit(dept, monthKey);
  const numKey = def.ratio.num;
  const unassigned = dept==='op'
    ? Math.max(0, opRevenueTotal(monthKey) - list.reduce((a,e)=> a + (Number(getKpi(e.id,monthKey).revenue)||0), 0))
    : 0;

  const totals = {};
  def.fields.forEach(f=>{ if(f.type==='number') totals[f.key] = 0; });

  const people = list.map(e=>{
    const k = getKpi(e.id, monthKey);
    const autoPlan = split.plans[e.id]!=null ? split.plans[e.id] : null;
    def.fields.forEach(f=>{
      if(f.type!=='number') return;
      if(f.key==='plan' && autoPlan!=null) totals.plan += autoPlan;
      else totals[f.key] += Number(k[f.key])||0;
    });
    const num = Number(k[numKey])||0;
    const den = autoPlan!=null ? autoPlan : (Number(k.plan)||0);
    const trend = personalTrend(e.id, monthKey, num, den);
    return {
      id: e.id,
      name: e.name,
      onShift: isCheckedIn(e.id),
      value: num,
      plan: den,
      pct: den>0 ? Math.round(num/den*100) : null,
      roleLabel: empRoleLabel(e),
      fixedRate: empFixedRate(e),
      rate: currentRateFor(e, num, den),
      orders: dept==='to' ? (Number(k.orders)||0) : (Number(k.deals)||0),
      avgTime: avgCompletionTime(e.id, monthKey),
      trend,
      trendRate: dept==='op' ? trendRateFor(e, trend) : null,
      need: dept==='op' ? dailyNeed(e.id, monthKey, num, den) : null,
      best: false,
    };
  }).sort((a,b)=> b.value - a.value);

  // Лучший на текущий момент: наибольший % выполнения плана.
  // Если планов нет — просто наибольшая абсолютная цифра.
  const ranked = people.filter(p=> p.value>0);
  if(ranked.length){
    const byPct = ranked.filter(p=>p.pct!=null);
    const leader = byPct.length
      ? byPct.reduce((a,b)=> (b.pct>a.pct || (b.pct===a.pct && b.value>a.value)) ? b : a)
      : ranked[0];
    leader.best = true;
  }

  // Среднее время выполнения по отделу
  const allTimes = people.map(p=>p.avgTime).filter(Boolean);
  const deptAvgTime = allTimes.length
    ? {
        ms: allTimes.reduce((s,t)=> s + t.ms*t.count, 0) / allTimes.reduce((s,t)=> s + t.count, 0),
        count: allTimes.reduce((s,t)=> s + t.count, 0),
      }
    : null;

  if(unassigned>0) totals.revenue = (totals.revenue||0) + unassigned;
  const totalNum = totals[numKey] || 0;
  const totalPlan = totals.plan || 0;
  return {
    dept,
    label: def.label,
    people,
    totalNum,
    totalPlan,
    totalPct: totalPlan>0 ? Math.round(totalNum/totalPlan*100) : null,
    numLabel: (def.fields.find(f=>f.key===numKey)||{}).label || '',
    totals,
    deptAvgTime,
    onShiftCount: people.filter(p=>p.onShift).length,
    unassigned,
  };
}

// Заказы, требующие внимания: просроченный дедлайн или долгая пауза.
function attentionItems(monthKey){
  const overdue = [], paused = [];
  const today = new Date(); today.setHours(0,0,0,0);
  const PAUSE_ALERT_MS = 24*3600000; // пауза дольше суток

  employees.forEach(e=>{
    if(e.department!=='to') return; // задерживать заказы может только ТО
    getOrdersForEmp(e.id, monthKey).forEach(o=>{
      if(o.isDone) return;
      if(String(o.status||'').toLowerCase().includes('оплат')) return; // «Ждёт оплату» — не задержка
      if(o.paused && o.pausedAt && (Date.now()-o.pausedAt) > PAUSE_ALERT_MS){
        paused.push({emp:e.name, client:o.client, reason:o.pauseReason, since:o.pausedAt});
        return;
      }
      const dm = String(o.deadline||'').match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/);
      if(dm){
        const dl = new Date(Number(dm[3]), Number(dm[2])-1, Number(dm[1]));
        if(dl < today){
          overdue.push({emp:e.name, client:o.client, deadline:o.deadline, days:Math.round((today-dl)/86400000)});
        }
      }
    });
  });
  overdue.sort((a,b)=>b.days-a.days);
  paused.sort((a,b)=>a.since-b.since);
  return {overdue, paused};
}

// Предыдущий месяц по ключу: '2026-08' → '2026-07'
function prevMonthKey(mk){
  const [y,m] = mk.split('-').map(Number);
  const d = new Date(y, m-2, 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}

// Сравнение текущего месяца с предыдущим: касса, план, отделы, тенденция.
// Для честного сравнения с незакрытым месяцем считаем ещё и «темп»:
// сколько было у прошлого месяца на этот же день.
function monthComparison(mk){
  const prev = prevMonthKey(mk);
  if(!kpiData[prev]) return null;

  const cur = companyFinance(mk);
  const old = companyFinance(prev);

  const isCurrentMonth = mk === currentMonthKey();
  const dayNow = isCurrentMonth ? new Date().getDate() : daysInMonthOf(mk);
  const prevTotal = daysInMonthOf(prev);
  // где прошлый месяц был к этому же дню (линейная оценка — точных дневных срезов не храним)
  const prevAtSameDay = old.netCash * (Math.min(dayNow, prevTotal)/prevTotal);

  const delta = (now, before)=>{
    if(!before) return null;
    return Math.round((now-before)/before*100);
  };

  const depts = ['op','to'].map(d=>{
    const a = deptOverview(d, mk);
    const b = deptOverview(d, prev);
    if(!a || !b) return null;
    return {
      label: a.label,
      now: a.totalNum,
      before: b.totalNum,
      deltaPct: delta(a.totalNum, b.totalNum),
      avgNow: a.deptAvgTime ? a.deptAvgTime.ms : null,
      avgBefore: b.deptAvgTime ? b.deptAvgTime.ms : null,
    };
  }).filter(Boolean);

  return {
    prevKey: prev,
    isCurrentMonth, dayNow,
    cash: {now: cur.netCash, before: old.netCash, deltaPct: delta(cur.netCash, old.netCash)},
    pace: isCurrentMonth ? {now: cur.netCash, before: Math.round(prevAtSameDay), deltaPct: delta(cur.netCash, prevAtSameDay)} : null,
    plan: {now: cur.totalPlan, before: old.totalPlan, deltaPct: delta(cur.totalPlan, old.totalPlan)},
    planPct: {now: cur.planPct, before: old.planPct},
    depts,
  };
}

function monthEndProjection(monthKey, netCash, totalPlan){
  if(monthKey !== currentMonthKey()) return null; // прогноз имеет смысл только для текущего месяца
  const today = new Date();
  const dayOfMonth = today.getDate();
  const total = daysInMonthOf(monthKey);
  if(dayOfMonth<=0) return null;
  const projectedNet = netCash / dayOfMonth * total;
  const projectedPct = totalPlan>0 ? Math.round(projectedNet/totalPlan*100) : 0;
  return {dayOfMonth, total, projectedNet, projectedPct};
}

  catch(e){ console.error('saveOverlay failed', e); }
}

// Возвращает заказы сотрудника за конкретный месяц с наложенным overlay
function getOrdersForEmp(empId, monthKey){
  const mk = monthKey || empViewMonth || activeMonth;
  const list = (ordersData[mk] && ordersData[mk][empId]) || [];
  return list.map(o => {
    const ov = ordersOverlay[o.id] || {};
    // Статус: если сотрудник менял вручную — берём из overlay, иначе из CSV
    const status      = ov.status      || o.status      || '';
    const statusSince = ov.statusSince || o.statusSince || Date.now();
    // Успешные заказы теперь отображаются в колонке «Успешные» — не скрываем
    return Object.assign({}, o, {
      status,
      statusSince,
      paused:      ov.paused      || false,
      pauseReason: ov.pauseReason || '',
      pausedAt:    ov.pausedAt    || null,
      comment:     ov.comment     || '',
      finalTime:   ov.finalTime   != null ? ov.finalTime : null,
    });
  }).filter(Boolean);
}

function orderElapsed(order){
  // если на паузе — время замораживаем (показываем сколько было до паузы)
  if(order.paused){
    return (order.pausedAt||Date.now()) - (order.statusSince||Date.now());
  }
  return Date.now() - (order.statusSince||Date.now());
}

function fmtOrderTime(ms){
  if(ms < 0) ms = 0;
  const h = Math.floor(ms / 3600000);
  const m = Math.floor((ms % 3600000) / 60000);
  return h > 0 ? `${h}ч ${m}м` : `${m}м`;
}

// Краткий класс таймера по степени «зависания»
function timerClass(ms){
  if(ms >= ORDER_OVERDUE_MS) return 'overdue';
  if(ms >= ORDER_OVERDUE_MS * 0.6) return 'warn';
  return '';
}

// ИСПРАВЛЕНО (и вынесено из двух копий в одну функцию):
//  1) ссылки вида «wa.me/7700…» без протокола вставлялись в href как есть и
//     открывались как путь на самом сайте — теперь подставляется https://
//  2) href не экранировался: кавычка в ячейке таблицы ломала вёрстку карточки
//     и позволяла вставить произвольный HTML. Теперь экранируется.
function renderPhoneLink(raw){
  raw = String(raw||'').trim();
  if(!raw) return '';
  const hasProto = /^https?:\/\//i.test(raw);
  const bareDomain = /^(wa\.me|t\.me|vk\.com|instagram\.com|tiktok\.com)/i.test(raw);
  if(hasProto || bareDomain){
    const fullUrl = hasProto ? raw : 'https://' + raw;
    const short = fullUrl.replace(/^https?:\/\//i,'').split('/')[0].replace(/^www\./,'');
    return `\ud83d\udcde <a href="${escapeHtml(fullUrl)}" target="_blank" rel="noopener noreferrer" style="color:var(--teal-dark);text-decoration:underline;text-underline-offset:2px;">${escapeHtml(short)}</a>`;
  }
  const tel = raw.replace(/[^+\d]/g,'');
  if(tel.length >= 7){
    return `\ud83d\udcde <a href="tel:${escapeHtml(tel)}" style="color:var(--teal-dark);text-decoration:underline;text-underline-offset:2px;">${escapeHtml(raw)}</a>`;
  }
  return `\ud83d\udcde ${escapeHtml(raw)}`;
}

// Рендер одной карточки заказа
function renderOrderCard(o, empId, showTimer){
  const elapsed = orderElapsed(o);
  const tc = o.paused ? 'warn' : timerClass(elapsed);
  const isOverdue = !o.paused && elapsed >= ORDER_OVERDUE_MS;
  const timerLabel = o.paused ? `⏸ ${fmtOrderTime(elapsed)}` : fmtOrderTime(elapsed);

  // Для финальных статусов (Ждём оплату / Успешно) — скрываем плашки паузы и просрочки
  const isFinalStatus = !showTimer; // showTimer=false для done и paying секций

  let pauseInfo = '';
  if(!isFinalStatus && o.paused && o.pauseReason){
    pauseInfo = `<span class="order-pause-reason">⏸️ ${escapeHtml(o.pauseReason)}</span>`;
  }

  // Плашка с финальным временем выполнения
  let finalTimeInfo = '';
  if(isFinalStatus && o.finalTime != null){
    finalTimeInfo = `<span class="order-pause-reason" style="background:rgba(100,100,100,.08);color:var(--ink3);">⏱ ${fmtOrderTime(o.finalTime)}</span>`;
  }

  // Пауза — отображается, но некликабельна (pointer-events:none)
  const pauseOrResume = o.paused
    ? `<button class="order-btn resume-btn" data-order-resume="${o.id}" data-emp-id="${empId}">▶ Возобновить</button>`
    : `<button class="order-btn pause-btn" data-order-pause="${o.id}" data-emp-id="${empId}">⏸ Пауза</button>`;

  const commentSaved = `<div class="order-comment-saved" id="saved-${empId}-${o.id}">✓ сохранено</div>`;

  const metaLine = [
    o.gross     ? `💰 ${fmtMoney(o.gross)}`              : '',
    o.payMethod ? `${escapeHtml(o.payMethod)}`             : '',
    o.duration  ? `⏱ ${escapeHtml(o.duration)}`               : '',
    o.deadline  ? `📅 Сдать: ${escapeHtml(o.deadline)}`   : '',
    o.dateCreated ? `🗓 Принят: ${escapeHtml(o.dateCreated)}` : '',
  ].filter(Boolean).join('  ·  ');

  // Строка «Место общения + примечания»
  function renderContactLine(o){
    const parts = [];
    if(o.contactPlace) parts.push(`📍 ${escapeHtml(o.contactPlace)}`);
    if(o.notes) parts.push(`📝 ${escapeHtml(o.notes)}`);
    return parts.length ? parts.join('  ·  ') : '';
  }


  const contactLine = renderContactLine(o);
  const phoneHtml   = renderPhoneLink(o.phone||'');

  const timerHtml = showTimer
    ? `<span class="order-timer ${tc}" data-order-timer="${o.id}" data-timer-start="${o.statusSince||Date.now()}" data-paused="${o.paused?'1':'0'}" data-paused-at="${o.pausedAt||''}">${timerLabel}</span>`
    : '';

  return `<div class="order-item${isOverdue?' overdue':''}${o.paused?' paused-item':''}${!showTimer?' done-item':''}" data-order-id="${o.id}">
    <div class="order-header">
      <span class="order-client">${escapeHtml(o.client||'—')}</span>
      ${timerHtml}
    </div>
    ${metaLine ? `<div class="order-meta">${metaLine}</div>` : ''}
    ${contactLine ? `<div class="order-contact-line">${contactLine}</div>` : ''}
    ${phoneHtml ? `<div class="order-phone-line">${phoneHtml}</div>` : ''}
    <div class="order-status-row">
      <button type="button" class="order-status-badge" data-order-status="${o.id}" data-emp-id="${empId}" title="Нажмите, чтобы сменить статус" style="cursor:pointer;font-family:inherit;">${escapeHtml(o.status||'—')} ▾</button>
      ${pauseInfo}
      ${!isFinalStatus && isOverdue ? '<span class="order-pause-reason" style="background:#FDEAE4;color:var(--rust);">⚠️ Завис более 8ч</span>' : ''}
      ${finalTimeInfo}
    </div>
    ${showTimer ? `<div class="order-actions">${pauseOrResume}</div>` : ''}
    <div class="order-comment-wrap">
      <textarea placeholder="Комментарий по заказу…" data-order-comment="${o.id}" data-emp-id="${empId}" rows="2">${escapeHtml(o.comment||'')}</textarea>
      ${commentSaved}
    </div>
  </div>`;
}

// Рендер блока «Текущие заказы» для одного сотрудника
function renderOrdersBlock(empId, monthKey){
  const allOrders = getOrdersForEmp(empId, monthKey);

  // Разбиваем по колонкам
  // 1. В работе — не пауза, не успешно, не ждёт оплату, не новый (распределён)
  const isSuccessful = o => o.status.toLowerCase().includes('успешно') || o.status === 'Выполнен';
  const isPayWait = o => o.status.toLowerCase().includes('оплат');
  const isNew = o => o.status === 'Новый';

  const working  = allOrders.filter(o => !isSuccessful(o) && !isPayWait(o) && !isNew(o));
  const newOrds  = allOrders.filter(o => isNew(o));
  const paying   = allOrders.filter(o => isPayWait(o) && !isSuccessful(o));
  const done     = allOrders.filter(o => isSuccessful(o));

  if(allOrders.length === 0){
    return `<div class="card" id="orders-card-${empId}">
      <h2>Текущие заказы</h2>
      <div class="orders-empty">Нет активных заказов</div>
    </div>`;
  }

  return `
    <div class="card" id="orders-card-${empId}">
      <h2>Текущие заказы</h2>
      ${renderOrdersSection('working-'+empId, 'sec-working', icon('play',15), 'В работе', working, empId, true, false)}
      ${renderOrdersSection('new-'+empId,     'sec-new',     icon('clipboard',15), 'Взять в работу', newOrds, empId, false, false)}

      ${renderOrdersSection('done-'+empId,    'sec-done',    icon('check',15), 'Успешные', done, empId, false, true)}
    </div>`;
}

function tickOrderTimers(){
  document.querySelectorAll('[data-order-timer]').forEach(el => {
    const paused = el.dataset.paused === '1';
    const start = parseInt(el.dataset.timerStart) || Date.now();
    const pausedAt = el.dataset.pausedAt ? parseInt(el.dataset.pausedAt) : null;
    const elapsed = paused ? (pausedAt ? pausedAt - start : 0) : (Date.now() - start);
    if(elapsed < 0) return;
    const h = Math.floor(elapsed / 3600000);
    const m = Math.floor((elapsed % 3600000) / 60000);
    const txt = (h > 0 ? `${h}ч ${m}м` : `${m}м`);
    el.textContent = paused ? `⏸ ${txt}` : txt;
    el.className = 'order-timer ' + (paused ? 'warn' : timerClass(elapsed));
    // подсветка карточки при превышении порога
    const card = el.closest('.order-item');
    if(card && !paused){
      if(elapsed >= ORDER_OVERDUE_MS){
        card.classList.add('overdue');
        // показываем предупреждение, если ещё нет
        const row = card.querySelector('.order-status-row');
        if(row && !row.querySelector('.overdue-warn')){
          const sp = document.createElement('span');
          sp.className = 'order-pause-reason overdue-warn';
          sp.style.cssText = 'background:#FDEAE4;color:var(--rust);';
          sp.textContent = '⚠️ Завис более 8 часов';
          row.appendChild(sp);
        }
      }
    }
  });
}

// Модалка «Пауза» — выбор причины
function showPauseModal(empId, orderId){
  return new Promise(resolve => {
    const host = document.getElementById('modalHost');
    if(!host){ resolve(null); return; }
    let selected = '';
    const closeModal = (result) => {
      host.classList.remove('open');
      setTimeout(() => { host.innerHTML = ''; }, 260);
      resolve(result);
    };
    const renderModal = () => {
      host.innerHTML = `
        <div class="pause-modal">
          <div class="pause-modal-backdrop" id="pauseBackdrop"></div>
          <div class="pause-modal-sheet">
            <div class="pause-modal-title">⏸ Причина паузы</div>
            <div class="pause-reasons">
              ${PAUSE_REASONS.map(r => `<button class="pause-reason-btn${selected===r?' selected':''}" data-reason="${escapeHtml(r)}">${escapeHtml(r)}</button>`).join('')}
            </div>
            <div class="pause-other-input" id="pauseOtherWrap" style="${selected==='Другое'?'display:block':'display:none'}">
              <textarea id="pauseOtherText" placeholder="Опишите причину…" rows="2"></textarea>
            </div>
            <div class="pause-modal-actions">
              <button class="btn secondary small" id="pauseCancelBtn">Отмена</button>
              <button class="btn small" id="pauseConfirmBtn">Поставить на паузу</button>
            </div>
          </div>
        </div>`;
      requestAnimationFrame(() => host.classList.add('open'));
      host.querySelectorAll('.pause-reason-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          selected = btn.dataset.reason;
          renderModal();
          if(selected === 'Другое'){
            setTimeout(()=>{ const t = document.getElementById('pauseOtherText'); if(t) t.focus(); }, 50);
          }
        });
      });
      document.getElementById('pauseBackdrop').addEventListener('click', () => closeModal(null));
      document.getElementById('pauseCancelBtn').addEventListener('click', () => closeModal(null));
      document.getElementById('pauseConfirmBtn').addEventListener('click', () => {
        if(!selected){ showToast('Выберите причину паузы', 'error'); return; }
        let reason = selected;
        if(selected === 'Другое'){
          const txt = (document.getElementById('pauseOtherText')||{}).value||'';
          if(!txt.trim()){ showToast('Опишите причину в поле «Другое»', 'error'); return; }
          reason = txt.trim();
        }
        closeModal(reason);
      });
    };
    renderModal();
  });
}

    const loadedEmp = await storeGet('app:employees', SHARED);
    if(loadedEmp){ employees = normalizeEmployees(loadedEmp); }
    else if(!storeReadFailed){
      // База ответила, и там правда пусто — первый запуск, ставим стартовый набор
      employees = SEED_EMPLOYEES;
      await storeSet('app:employees', employees, SHARED);
    }
    // Если чтение упало — НИКОГДА не подменяем демо-данными: у них другие ID,
    // и весь KPI, записанный на настоящие ID, перестаёт находиться → нули.
  } catch(e) { console.error(e); }

  try {
    const loadedKpi = await storeGet('app:kpiData', SHARED);

      // Если из базы пришли нули, а локально сохранена хорошая копия —

        console.warn('В базе нули — восстанавливаю KPI из локальной копии');
        kpiData = good;
        needsHeal.push('app:kpiData');
      } else {
        kpiData = loadedKpi;

    else if(!storeReadFailed){
      kpiData = { [currentMonthKey()]: SEED_MONTH_DATA };
      await storeSet('app:kpiData', kpiData, SHARED);
    }
  } catch(e) { console.error(e); }

  let storedActive = null;
  try { storedActive = await storeGet('app:activeMonth', SHARED); } catch(e) { console.error(e); }
  
  activeMonth = storedActive || currentMonthKey();
  if(!kpiData[activeMonth]) ensureMonth(activeMonth);
  // Всегда гарантируем, что текущий календарный месяц существует в kpiData
  const nowMonthKey = currentMonthKey();
  if(!kpiData[nowMonthKey]) ensureMonth(nowMonthKey);
  editingMonth = activeMonth;

  try { logs = await loadAttendance(); } catch(e) { console.error(e); }

  myEmployeeId = null;   // определяется по почте после входа (linkAuthIdentity)

  try {
    const storedAdminPin = await storeGet('app:adminPin', SHARED);

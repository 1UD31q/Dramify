// История сотрудника: выполнение плана по месяцам (последние 6 месяцев с данными)
function renderHistoryCard(emp){
  const dept = DEPARTMENTS[emp.department] || DEPARTMENTS.op;
  if(!dept.ratio) return ''; // ОС — без плана, история выполнения не нужна
  const months = historyMonths();
  const rows = months.map(mk=>{
    const k = getKpi(emp.id, mk);
    const num = Number(k[dept.ratio.num])||0;
    const p = planFor(emp, mk);
    const den = (dept.ratio.den==='plan' && p!=null) ? p : (Number(k[dept.ratio.den])||0);
    const pct = den>0 ? Math.round(num/den*100) : null;
    const rate = empFixedRate(emp)!=null ? empFixedRate(emp) : (pct!=null ? rateFor(pct) : null);
    const allTo = emp.department==='to' ? num + (Number(k.pending)||0) : null;
    return { mk, num, den, pct, rate, allTo, orders: Number(k.orders)||0, completed: Number(k.completed)||0 };
  });
  if(!rows.some(r=> r.num>0 || r.den>0)) return '';
  const top = Math.max(120, ...rows.map(r=> r.pct||0));
  const AREA = 110; // px под столбики (высота графика минус подпись значения)
  const px = v => Math.round(Math.min(1, v/top) * AREA);
  const short = mk => monthLabel(mk).slice(0,3).toLowerCase() + ' ' + mk.slice(2,4);
  const cols = rows.map(r=>`
    <div class="hist-col${r.mk===currentMonthKey()?' cur':''}" tabindex="0">
      <div class="hist-val">${r.pct!=null ? r.pct+'%' : '—'}</div>
      <div class="hist-bar" style="height:${r.pct!=null ? px(r.pct) : 0}px"></div>
      <div class="hist-tip"><b>${monthLabel(r.mk)}</b>${r.mk===currentMonthKey()?' · идёт':''}<br>
        ${fmtMoney(r.num)}${r.den>0 ? ' из ' + fmtMoney(r.den) : ' · план не задан'}<br>
        ${r.allTo!=null ? `выполнено ${r.completed} из ${r.orders} заказов · всего на ${fmtMoney(r.allTo)}<br>` : ''}
        ${r.pct!=null ? 'выполнение ' + r.pct + '%' : ''}${r.rate!=null ? ' · ставка ' + r.rate + '%' : ''}</div>
    </div>`).join('');
  const done = rows.filter(r=> r.pct!=null && r.mk!==currentMonthKey());
  const avg = done.length ? Math.round(done.reduce((a,r)=>a+r.pct,0)/done.length) : null;
  const best = done.length ? done.reduce((a,b)=> b.pct>a.pct ? b : a) : null;
  return `<div class="card">
    <h2>История по месяцам</h2>
    <div class="hist-chart">
      <div class="hist-goal" style="bottom:${px(100)}px"><span>план 100%</span></div>
      ${cols}
    </div>
    <div class="hist-axis">${rows.map(r=>`<span>${short(r.mk)}</span>`).join('')}</div>
    <div class="hist-sum">
      <span>${avg!=null ? 'В среднем за закрытые месяцы: <b>' + avg + '%</b> плана' : 'Закрытых месяцев пока нет'}</span>
      ${best ? `<span>Лучший: ${monthLabel(best.mk)} — ${best.pct}%</span>` : ''}
    </div>
    ${historySyncing ? '<div class="hint" style="margin-top:6px;">Пересчитываю прошлые месяцы по таблицам…</div>' : ''}
  </div>`;
}

// ── Проверка подсчёта по таблице ─────────────────────────────────────────
// Заново читает таблицу отдела и показывает по сотруднику каждую строку:
// засчитана или нет и почему. Плюс похожие имена, которые не совпали.
let sheetCheck = {};   // 'empId|mk' -> {loading, error, res}
function nameSimilar(a, b){
  if(!a || !b || a===b) return false;
  const fa = a.split(' ')[0], fb = b.split(' ')[0];
  if(fa.length>=3 && fa===fb) return true;
  if(Math.abs(a.length-b.length) > 2) return false;
  const d = Array.from({length:a.length+1}, (_,i)=>[i]);
  for(let j=1;j<=b.length;j++) d[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++)
    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length] <= 2;
}
async function runSheetCheck(emp, mk){
  const key = emp.id + '|' + mk;
  sheetCheck[key] = {loading:true};
  renderNow();
  try{
    const url = getSheetUrl(emp.department, mk);
    if(!url) throw new Error('Для этого месяца не указана ссылка на таблицу ' + deptLabel(emp.department));
    const rows = await fetchLedgerRows(url);
    if(rows.length < 2) throw new Error('Таблица пустая');
    const hl = rows[0].map(h=>String(h||'').trim().toLowerCase());
    const findCol = ps => { for(const p of ps){ const i = hl.findIndex(h=>h.includes(p)); if(i>=0) return i; } return -1; };
    const actorCol = findCol([emp.department==='op' ? 'кто продал' : 'кто делает']);
    if(actorCol<0) throw new Error('Не нашёл колонку «' + (emp.department==='op'?'Кто продал':'Кто делает') + '»');
    const statusCol = findCol(['статус']), grossCol = findCol(['сумма общая','сумма']);
    const dateCol = findCol(['дата оформления','дата']), dlCol = emp.department==='to' ? findCol(['дата сдачи','дедлайн','срок']) : -1;
    const nameCol = findCol(['имя','name']);
    const me = normName(emp.name);
    const wholeTab = isDedicatedTab(emp.department, mk);
    const list = [], similar = {};
    let total = 0, count = 0, other = 0;
    for(let r=1;r<rows.length;r++){
      const row = rows[r], actorRaw = String(row[actorCol]||'').trim(), actor = normName(actorRaw);
      if(!actor) continue;
      if(actor !== me){
        if(nameSimilar(actor, me)) similar[actorRaw] = (similar[actorRaw]||0) + 1;
        continue;
      }
      const dateRaw = dateCol>=0 ? String(row[dateCol]||'').trim() : '';
      const dlRaw = dlCol>=0 ? String(row[dlCol]||'').trim() : '';
      const status = statusCol>=0 ? String(row[statusCol]||'').trim() : '';
      const gross = grossCol>=0 ? parseNum(row[grossCol]) : 0;
      const rowMk = wholeTab ? mk : (emp.department==='to' ? toOrderMonth(row, dateCol, dlCol)
        : (dateRaw ? sheetDateMonth(dateRaw) : currentMonthKey()));
      let reason = '';
      if(!wholeTab && dateRaw && !sheetDateMonth(dateRaw) && !(emp.department==='to' && sheetDateMonth(dlRaw))) reason = 'дата не распознана: «' + dateRaw + '»';
      else if(rowMk !== mk){ other++; continue; }
      else if(isCancelledStatus(status)) reason = 'отменён / возврат';
      else if(!dateRaw && !(emp.department==='to' && dlRaw)) reason = '';
      const counted = !reason;
      const isDone = status.toLowerCase().includes('успешно');
      const sum = emp.department==='to' ? (isDone ? gross : 0) : gross;
      if(counted){ total += sum; count++; }
      list.push({ r: r + 1 + (rows.rowOffset||0), client: nameCol>=0 ? String(row[nameCol]||'').trim() : '', date: dateRaw || (dlRaw ? 'сдача ' + dlRaw : 'без даты'),
        gross, status, counted, reason, done: isDone, noDate: !dateRaw });
    }
    sheetCheck[key] = {res:{list, similar, total, count, other}};
  }catch(e){
    sheetCheck[key] = {error: e.message};
  }
  renderNow();
}
function renderSheetCheck(emp, mk){
  const st = sheetCheck[emp.id + '|' + mk] || {};
  const k = getKpi(emp.id, mk);
  const appVal = emp.department==='to' ? (Number(k.netAmount)||0) : (Number(k.revenue)||0);
  const appCnt = emp.department==='to' ? (Number(k.orders)||0) : (Number(k.deals)||0);
  const what = emp.department==='to' ? 'выполнено (успешно завершённые)' : 'продажи';
  let body = '';
  if(st.loading) body = '<div class="empty">Читаю таблицу…</div>';
  else if(st.error) body = `<div class="sc-warn">${escapeHtml(st.error)}</div>`;
  else if(st.res){
    const r = st.res;
    const sim = Object.keys(r.similar);
    body = `
      <div class="sc-sum">По таблице сейчас: <b>${fmtMoney(r.total)}</b> ${what}, строк: <b>${r.count}</b>
        <span>В приложении: ${fmtMoney(appVal)}, ${emp.department==='to'?'заказов':'сделок'}: ${appCnt}</span></div>
      ${sim.length ? `<div class="sc-warn">Похожие имена в таблице, которые <b>не</b> засчитываются этому сотруднику: ${sim.map(n=>`«${escapeHtml(n)}» (${r.similar[n]})`).join(', ')}. Если это он — исправьте имя в таблице или в «Сотрудники и доступ».</div>` : ''}
      ${r.list.length ? `<div class="sc-list">${r.list.map(x=>`
        <div class="sc-row${x.counted?'':' off'}">
          <span class="sc-n">стр. ${x.r}</span>
          <span class="sc-c">${escapeHtml(x.client||'—')}<small>${escapeHtml(x.date)}${x.status?' · '+escapeHtml(x.status):''}</small></span>
          <span class="sc-v">${fmtMoney(x.gross)}<small>${x.counted ? (emp.department==='to' && !x.done ? 'в работе' : (x.noDate ? 'засчитано (без даты — в текущий месяц)' : 'засчитано')) : escapeHtml(x.reason)}</small></span>
        </div>`).join('')}</div>` : '<div class="empty">За этот месяц строк с этим именем нет</div>'}
      ${r.other ? `<div class="hint">Ещё строк этого сотрудника в других месяцах: ${r.other}</div>` : ''}`;
  }
  return `<div class="card">
    <h2>Проверка по таблице · ${monthLabel(mk)}</h2>
    <div class="hint" style="margin-top:-4px;">Заново читает таблицу ${escapeHtml(deptLabel(emp.department))} и показывает, какие строки засчитаны этому сотруднику.</div>
    <button class="btn secondary small" data-sheetcheck="${emp.id}" data-sheetcheck-mk="${mk}" style="margin:10px 0 6px;">${st.res||st.error ? 'Проверить ещё раз' : 'Проверить по таблице'}</button>
    ${body}
  </div>`;
}

// ── Проверка таблиц по всем месяцам истории (вкладка «Данные») ──────────────
// Для каждого месяца и отдела: прочиталась ли таблица, где шапка, какие колонки
// найдены, сколько строк за месяц, чьи имена не совпали, строки без суммы/даты.
let sheetsAudit = null;   // {loading} | {at, months:[...]}
async function analyzeLedger(dept, mk){
  const url = getSheetUrl(dept, mk);
  if(!url) return { dept, missing:true };
  try{
    const rows = await fetchLedgerRows(url);
    const hl = rows[0].map(h=>String(h||'').trim().toLowerCase());
    const findCol = ps => { for(const p of ps){ const i = hl.findIndex(h=>h.includes(p)); if(i>=0) return i; } return -1; };
    const col = i => i<0 ? null : (rows[0][i] || '') ;
    const actorCol = findCol([dept==='op' ? 'кто продал' : 'кто делает']);
    const grossCol = findCol(['сумма общая','сумма']), dateCol = findCol(['дата оформления','дата']);
    const statusCol = findCol(['статус']), dlCol = dept==='to' ? findCol(['дата сдачи','дедлайн','срок']) : -1;
    const res = { dept, via: rows.via, headerRow: rows.headerRow, cols: { actor: col(actorCol), gross: col(grossCol), date: col(dateCol), status: col(statusCol) },
      rows: 0, inMonth: 0, badDate: 0, noActor: 0, noSum: 0, otherMonth: 0, otherSample: '', unmatched: {}, byEmp: {} };
    if(actorCol<0 || grossCol<0) return res;
    const emps = employees.filter(e=>e.department===dept);
    res.wholeTab = isDedicatedTab(dept, mk);
    for(let r=1;r<rows.length;r++){
      const row = rows[r];
      if(!row.some(c=>String(c).trim())) continue;
      res.rows++;
      const dateRaw = dateCol>=0 ? String(row[dateCol]||'').trim() : '';
      if(!res.wholeTab && dateRaw && !sheetDateMonth(dateRaw)) res.badDate++;
      const inMonth = res.wholeTab || (dept==='to' ? toOrderMonth(row, dateCol, dlCol)===mk : rowInMonth(row, dateCol, mk));
      if(!inMonth){
        if(dateRaw && sheetDateMonth(dateRaw)){ res.otherMonth++; if(!res.otherSample) res.otherSample = dateRaw; }
        continue;
      }
      res.inMonth++;
      const actorRaw = String(row[actorCol]||'').trim();
      if(!actorRaw || /^[-—–]$/.test(actorRaw)){ res.noActor++; continue; }
      const st = statusCol>=0 ? String(row[statusCol]||'') : '';
      if(isCancelledStatus(st)) continue;
      const gross = parseNum(row[grossCol]);
      const emp = emps.find(e=> normName(e.name)===normName(actorRaw));
      if(!emp){ res.unmatched[actorRaw] = (res.unmatched[actorRaw]||0) + 1; continue; }
      if(!gross) res.noSum++;
      const b = res.byEmp[emp.id] = res.byEmp[emp.id] || {count:0, sum:0};
      b.count++;
      if(dept==='op' || st.toLowerCase().includes('успешно')) b.sum += gross;
    }
    return res;
  }catch(e){ return { dept, error: e.message }; }
}
async function runSheetsAudit(){
  sheetsAudit = {loading:true};
  renderNow();
  const months = Array.from(new Set(historyMonths().concat([activeMonth]))).sort().reverse();
  const out = [];
  for(const mk of months){
    out.push({ mk, plan: (trackerData[mk]||{}).effectivePlan || 0, trackerUrl: !!(trackerUrls[mk]||'').trim(),
      depts: [await analyzeLedger('op', mk), await analyzeLedger('to', mk)] });
  }
  sheetsAudit = {at: Date.now(), months: out};
  renderNow();
}
function renderSheetsAudit(){
  const a = sheetsAudit;
  const warn = t => `<div class="au-w">⚠ ${t}</div>`;
  const deptBlock = (d, mk) => {
    const label = deptLabel(d.dept);
    if(d.missing) return `<div class="au-d"><b>${label}</b> <span class="au-m">ссылка не указана</span></div>`;
    if(d.error) return `<div class="au-d"><b>${label}</b>${warn('не прочиталась: ' + escapeHtml(d.error) + '. Проверьте доступ «Все, у кого есть ссылка» и что ссылка ведёт на нужную вкладку.')}</div>`;
    const c = d.cols, issues = [];
    if(!c.actor) issues.push(warn('не нашёл колонку «' + (d.dept==='op'?'Кто продал':'Кто делает') + '» в строке ' + d.headerRow));
    if(!c.gross) issues.push(warn('не нашёл колонку «Сумма общая»'));
    if(!c.date && !d.wholeTab) issues.push(warn('не нашёл колонку даты — строки не делятся по месяцам'));
    if(d.inMonth===0 && d.rows>0) issues.push(warn('ни одна строка не относится к ' + monthLabel(mk) + ' — проверьте даты (год, формат) и что ссылка на вкладку нужного месяца'));
    if(d.badDate) issues.push(warn('даты не распознаны в ' + d.badDate + ' строк(ах) — такие строки не считаются'));
    if(d.otherMonth) issues.push(warn('строк с датой другого месяца: ' + d.otherMonth + ' (например, «' + escapeHtml(d.otherSample) + '») — в ' + monthLabel(mk) + ' они не считаются. Если это опечатка в годе или месяце — исправьте дату в таблице.'));
    const um = Object.keys(d.unmatched);
    if(um.length) issues.push(warn('имена не совпали ни с одним сотрудником: ' + um.slice(0,6).map(n=>'«'+escapeHtml(n)+'» ('+d.unmatched[n]+')').join(', ')));
    if(d.noSum) issues.push(warn('строк без суммы у сотрудников: ' + d.noSum));
    const emps = employees.filter(e=>e.department===d.dept).map(e=>{
      const b = d.byEmp[e.id] || {count:0, sum:0};
      const k = getKpi(e.id, mk), app = d.dept==='to' ? (Number(k.netAmount)||0) : (Number(k.revenue)||0);
      const diff = Math.round(app) !== Math.round(b.sum);
      return `<span class="au-e${diff?' diff':''}">${escapeHtml(e.name)}: ${fmtMoney(b.sum)} (${b.count})${diff ? ' · в приложении ' + fmtMoney(app) : ''}</span>`;
    }).join('');
    return `<div class="au-d"><b>${label}</b> <span class="au-m">прочитано${d.headerRow>1 ? ', шапка найдена в строке ' + d.headerRow : ''}; ${d.wholeTab ? 'своя вкладка — считаются все строки (' + d.inMonth + ')' : 'общая вкладка — по датам: строк ' + d.rows + ', за месяц ' + d.inMonth}</span>
      <div class="au-m">Колонки: ${['actor','gross','date','status'].map(k=>c[k] ? '«'+escapeHtml(c[k])+'»' : '—').join(' · ')}</div>
      ${issues.join('')}
      <div class="au-emps">${emps}</div></div>`;
  };
  let body = '';
  if(a && a.loading) body = '<div class="empty">Читаю таблицы всех месяцев…</div>';
  else if(a) body = a.months.map(m=>`<div class="au-mon">
      <div class="au-h">${monthLabel(m.mk)} <span class="au-m">${m.plan ? 'план ' + fmtMoney(m.plan) : (m.trackerUrl ? 'трекер есть, но план не прочитан' : 'нет ссылки на трекер — план не задан')}</span></div>
      ${m.depts.map(d=>deptBlock(d, m.mk)).join('')}
    </div>`).join('') + '<div class="hint">Красным — сотрудники, у которых цифра в приложении отличается от таблицы. После исправлений нажмите «Синхронизировать» у месяца или просто откройте приложение заново.</div>';
  return `<div class="card">
    <h2>Проверка таблиц</h2>
    <div class="hint" style="margin-top:-4px;">Читает таблицы всех месяцев истории и показывает, что приложение в них видит и что мешает правильному подсчёту.</div>
    <button class="btn small" id="sheetsAuditBtn" style="margin:10px 0 4px;" ${a&&a.loading?'disabled':''}>${a && !a.loading ? 'Проверить ещё раз' : 'Проверить таблицы'}</button>
    ${body}
  </div>`;
}

function empKpiPct(e, mk){
  const dept = DEPARTMENTS[e.department]; if(!dept || !dept.ratio) return null;
  const k = getKpi(e.id, mk), plan = planFor(e, mk);
  const num = Number(k[dept.ratio.num])||0;
  const den = (dept.ratio.den==='plan' && plan!=null) ? plan : (Number(k[dept.ratio.den])||0);
  return { num, den, pct: den>0 ? Math.round(num/den*100) : null };
}

// ── Тимлид управляет сотрудниками ТОЛЬКО своего отдела ────────────────────────
// Что можно: добавить сотрудника своего отдела и вписать/изменить его почту.
// Чего нельзя: менять роль, фикс-ставку, отдел, имя, удалять, трогать чужой отдел
// и свою собственную почту. Все проверки здесь, в коде действия, — не только в
// интерфейсе, поэтому подмена полей в браузере не помогает.
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
function teamLeadMe(){
  const me = employees.find(e=>e.id===myEmployeeId);
  return (me && me.role==='teamlead' && DEPARTMENTS[me.department]) ? me : null;
}
// Читаем свежий список из базы, применяем правку, пишем назад: так мы не затираем
// то, что админ изменил, пока у тимлида была открыта страница.
async function teamMutateEmployees(mutator){
  const fresh = await storeGet('app:employees', SHARED);
  if(!Array.isArray(fresh)) return { error:'Не удалось прочитать список сотрудников. Проверьте связь и повторите' };
  const list = normalizeEmployees(fresh);
  const err = mutator(list);
  if(err) return { error: err };
  const ok = await storeSet('app:employees', list, SHARED);
  if(!ok) return { error:'Не удалось сохранить: нет связи или нет прав на запись' };
  employees = list;
  return { ok:true };
}
async function teamSaveEmails(){
  const me = teamLeadMe();
  if(!me){ showToast('Нет прав на это действие', 'error'); return; }
  const wanted = {};
  document.querySelectorAll('[data-tmemail]').forEach(i=>{ wanted[i.dataset.tmemail] = i.value.trim().toLowerCase(); });
  const r = await teamMutateEmployees(list=>{
    for(const id of Object.keys(wanted)){
      const emp = list.find(e=>e.id===id);
      if(!emp) continue;
      if(emp.department !== me.department) return 'Можно менять почты только сотрудников своего отдела';
      if(emp.id === me.id) return 'Свою почту менять нельзя';
      if(wanted[id] && !EMAIL_RE.test(wanted[id])) return 'Некорректная почта у «' + emp.name + '»';
    }
    const seen = {};
    for(const e of list){
      const v = (wanted[e.id] !== undefined) ? wanted[e.id] : String(e.email||'').toLowerCase();
      if(!v) continue;
      if(seen[v]) return 'Почта ' + v + ' уже используется';
      seen[v] = true;
    }
    for(const id of Object.keys(wanted)){ const emp = list.find(e=>e.id===id); if(emp) emp.email = wanted[id]; }
    return null;
  });
  if(r.error){ showToast(r.error, 'error'); return; }
  showToast('Почты сохранены', 'success');
  renderNow();
}
async function teamAddEmployee(){
  const me = teamLeadMe();
  if(!me){ showToast('Нет прав на это действие', 'error'); return; }
  const nEl = document.getElementById('tmNewName'), eEl = document.getElementById('tmNewEmail');
  const name = (nEl ? nEl.value : '').trim().replace(/\s+/g, ' ');
  const email = (eEl ? eEl.value : '').trim().toLowerCase();
  if(name.length < 2 || name.length > 40){ showToast('Укажите имя от 2 до 40 символов', 'error'); return; }
  if(!EMAIL_RE.test(email)){ showToast('Укажите корректную почту', 'error'); return; }
  const r = await teamMutateEmployees(list=>{
    if(list.some(e=>String(e.name||'').trim().toLowerCase() === name.toLowerCase())) return 'Сотрудник с таким именем уже есть';
    if(list.some(e=>String(e.email||'').toLowerCase() === email)) return 'Почта ' + email + ' уже используется';
    // отдел — всегда свой; роль и фикс-ставку задаёт только админ
    list.push({ id:'e' + Date.now(), name, department: me.department, email });
    return null;
  });
  if(r.error){ showToast(r.error, 'error'); return; }
  try{ ensureMonth(editingMonth); const nk = employees[employees.length-1]; const m = await saveMerged('app:kpiData', kpiData, nk ? [[editingMonth, nk.id]] : []); if(m) kpiData = m; }catch(e){}
  showToast('Сотрудник добавлен', 'success');
  renderNow();
}

// =========================================================================
// ВРЕМЯ ПРОДАЖ ОП
// Каждая оформленная продажа пишется отдельной строкой в kv_store с ключом
// saletime:ГГГГ-ММ:<id>. Отдельная строка на продажу — чтобы два менеджера,
// оформившие продажу одновременно, не затёрли записи друг друга.
// Время считается по Алматы (UTC+5), независимо от часового пояса телефона.
// =========================================================================
const SALE_TZ = 'Asia/Almaty';
const SALE_PARTS = [
  {key:'night',   label:'Ночь',  range:'00:00–06:00', from:0,  to:6},
  {key:'morning', label:'Утро',  range:'06:00–12:00', from:6,  to:12},
  {key:'day',     label:'День',  range:'12:00–18:00', from:12, to:18},
  {key:'evening', label:'Вечер', range:'18:00–24:00', from:18, to:24},
];
const SALE_QUEUE_KEY = 'pending:saletimes';
let saleTimes = {};           // mk -> [записи]
let saleTimesFetchedAt = {};  // mk -> ms
let saleTimesLoading = {};
let saleTimesEmpFilter = 'all';
let saleTimesManage = false;   // скрытый режим удаления записей
let saleTimesTitleClicks = 0;
let saleTimesTitleTimer = null;

function saleZoned(ts){
  const parts = new Intl.DateTimeFormat('en-GB', {
    timeZone: SALE_TZ, year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', hourCycle:'h23',
  }).formatToParts(new Date(ts));
  const g = t => (parts.find(p=>p.type===t)||{}).value || '00';
  return { mk: g('year')+'-'+g('month'), hour: Number(g('hour'))%24, hhmm: g('hour')+':'+g('minute') };
}

function readSaleQueue(){
  try{ return JSON.parse(localStorage.getItem(SALE_QUEUE_KEY)||'[]') || []; }catch(e){ return []; }
}
function writeSaleQueue(q){
  try{ localStorage.setItem(SALE_QUEUE_KEY, JSON.stringify(q)); }catch(e){}
}

// Отправляем накопленные записи. Если связи нет — они ждут в localStorage
// и уйдут при следующей синхронизации.
let saleQueueFlushing = false;
async function flushSaleTimeQueue(){
  if(saleQueueFlushing) return;
  const q = readSaleQueue();
  if(!q.length) return;
  saleQueueFlushing = true;
  const left = [];
  for(const item of q){
    const ok = await storeSet(item.key, item.rec, SHARED);
    if(!ok) left.push(item);
  }
  // за время отправки могли добавиться новые — сохраняем и их
  const added = readSaleQueue().filter(n=>!q.some(o=>o.key===n.key));
  writeSaleQueue(left.concat(added));
  saleQueueFlushing = false;
}

function recordSaleTime(payload){
  const ts = Date.now();
  const z = saleZoned(ts);
  const id = ts.toString(36) + Math.random().toString(36).slice(2,7);
  const rec = {
    id, ts, mk: z.mk, hour: z.hour, time: z.hhmm,
    empId: myEmployeeId || '', empName: payload.whoSold || '',
    client: payload.clientName || '', total: Number(payload.total)||0,
    saleDate: payload.date || '',
  };
  const key = `saletime:${z.mk}:${id}`;
  // сразу показываем локально, не дожидаясь базы
  (saleTimes[z.mk] = saleTimes[z.mk] || []).push(rec);
  const q = readSaleQueue(); q.push({key, rec}); writeSaleQueue(q);
  flushSaleTimeQueue();
  return rec;
}

async function loadSaleTimes(mk){
  if(saleTimesLoading[mk]) return;
  saleTimesLoading[mk] = true;
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/kv_store?key=like.${encodeURIComponent('saletime:'+mk+':')}*&select=value&limit=10000`, {
      headers: await sbHeaders()
    });
    if(res.status === 401) authOnUnauthorized();
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const rows = await res.json();
    const list = [];
    rows.forEach(r=>{ try{ const v = JSON.parse(r.value); if(v && v.ts && !v.deleted) list.push(v); }catch(e){} });
    // добавляем то, что ещё не долетело до базы с этого устройства
    readSaleQueue().forEach(it=>{
      if(it.rec && it.rec.mk===mk && !list.some(x=>x.id===it.rec.id)) list.push(it.rec);
    });
    const before = JSON.stringify(saleTimes[mk]||[]);
    saleTimes[mk] = list;
    saleTimesFetchedAt[mk] = Date.now();
    if(before !== JSON.stringify(list) && mode==='admin' && adminUnlocked && !isEditingSomething()) render();
  }catch(e){
    console.error('loadSaleTimes failed', e);
    saleTimesFetchedAt[mk] = Date.now(); // не долбим базу при ошибке
  }finally{ saleTimesLoading[mk] = false; }
}

// Удаление записи (например, тестовой продажи). Если база запрещает DELETE —
// перезаписываем строку меткой deleted, при чтении такие записи пропускаются.
async function deleteSaleTime(mk, id){
  const key = `saletime:${mk}:${id}`;
  // убираем из локальной очереди, если ещё не улетела
  writeSaleQueue(readSaleQueue().filter(it=>it.key!==key));
  let ok = false;
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/kv_store?key=eq.${encodeURIComponent(key)}`, {
      method:'DELETE',
      headers: await sbHeaders({ 'Prefer':'return=minimal' })
    });
    ok = res.ok;
  }catch(e){ console.error('deleteSaleTime', e); }
  if(!ok) ok = await storeSet(key, {id, mk, ts: Date.now(), deleted:true}, SHARED);
  if(ok) saleTimes[mk] = (saleTimes[mk]||[]).filter(r=>r.id!==id);
  return ok;
}

function ensureSaleTimes(mk){
  const age = Date.now() - (saleTimesFetchedAt[mk]||0);
  if(age > 20000) loadSaleTimes(mk);
}

function saleTimeStats(mk, empFilter){
  const all = saleTimes[mk] || [];
  const list = empFilter && empFilter!=='all'
    ? all.filter(r => r.empId===empFilter || (!r.empId && r.empName===(employees.find(e=>e.id===empFilter)||{}).name))
    : all;
  const hours = Array.from({length:24}, ()=>({count:0, sum:0}));
  list.forEach(r=>{
    const h = Number.isFinite(r.hour) ? r.hour : saleZoned(r.ts).hour;
    hours[h].count++; hours[h].sum += Number(r.total)||0;
  });
  const parts = SALE_PARTS.map(p=>{
    let count=0, sum=0;
    for(let h=p.from; h<p.to; h++){ count+=hours[h].count; sum+=hours[h].sum; }
    return Object.assign({}, p, {count, sum, pct: list.length ? Math.round(count/list.length*100) : 0});
  });
  const topPart = parts.reduce((a,b)=> b.count>a.count ? b : a, parts[0]);
  let topHour = 0;
  hours.forEach((h,i)=>{ if(h.count > hours[topHour].count) topHour = i; });
  // лучшее окно из 3 часов подряд — полезнее одиночного часа
  let topWin = 0, topWinCount = -1;
  for(let i=0;i<24;i++){
    const c = hours[i].count + hours[(i+1)%24].count + hours[(i+2)%24].count;
    if(c > topWinCount){ topWinCount = c; topWin = i; }
  }
  return { total:list.length, sum:list.reduce((s,r)=>s+(Number(r.total)||0),0), hours, parts, topPart, topHour, topWin, topWinCount };
}

async function submitSalesForm(){
  if(salesSubmitting) return;
  const url = salesScriptUrl.trim();
  if(!url){ showToast('Не указан URL скрипта отчёта (Админ → Отчёт продаж)','error'); return; }

  // Читаем поля формы
  syncSalesFormFromDom();

  // Финальная длительность: если "Другое" — берём кастомное значение
  const durationFinal = salesForm.duration === 'Другое'
    ? (salesForm.durationCustom || 'Другое')
    : salesForm.duration;
  // Страна: если выбрано "Другое" — берём то что вписали руками
  const targetFinal = salesForm.target === 'Другое'
    ? (salesForm.targetCustom || 'Другое')
    : salesForm.target;
  // Доп. услуга
  const addonFinal = salesForm.addon === 'Другое'
    ? (salesForm.addonCustom || '')
    : salesForm.addon;
  // Склеиваем: "2,5 мин+Диктор" или просто "2,5 мин"
  const durationFull = addonFinal ? durationFinal + addonFinal : durationFinal;

  if(!salesForm.clientName){ showToast('Введите имя клиента','error'); return; }
  if(!salesForm.total){ showToast('Введите сумму','error'); return; }

  const total  = parseFloat(salesForm.total)||0;
  const prep   = parseFloat(salesForm.prepayment)||0;
  const remain = Math.max(0, total - prep);
  const empName = salesEmpName();

  const payload = {
    clientName:   salesForm.clientName,
    date:         salesForm.date,
    target:       targetFinal,
    source:       salesForm.source,
    phone:        salesForm.phone,
    total:        total,
    prepayment:   prep,
    remainder:    remain,
    whoSold:      empName,
    status:       'Взять в работу',
    duration:     durationFull,
    payMethod:    salesForm.payMethod,
    earnings:     parseFloat(salesForm.earnings)||0,
    deliveryDate: salesForm.deliveryDate,
    sheetMonth:   salesForm.sheetMonth,
    // время оформления (по Алматы) — Apps Script может записать его в отдельную колонку
    saleTime:     saleZoned(Date.now()).hhmm,
    createdAt:    new Date().toISOString(),
  };

  salesSubmitting = true;
  salesResult = '';
  renderNow();

  try{
    const resp = await fetch(url, {
      method:'POST',
      body: JSON.stringify(payload),
      // Content-Type не указываем — GAS блокирует preflight CORS для application/json
    });
    const text = await resp.text();
    // GAS Web App может вернуть JSON или просто 'ok'
    let ok = resp.ok;
    try{ const j = JSON.parse(text); if(j && j.status) ok = j.status==='ok'; } catch(e){}
    if(ok){
      salesResult = 'ok';
      salesResultMsg = 'Запись добавлена в отчёт!';
      // Фиксируем время продажи для статистики в админке
      try{ recordSaleTime(payload); }catch(e){ console.error('recordSaleTime', e); }
      // Показываем TG-уведомление
      showTgNotif(payload);
      // Сброс формы (кроме таргета и метода оплаты)
      salesForm = {
        clientName:'', date: new Date().toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'}).replace(/\./g,'.'),
        target: salesForm.target, source:'', phone:'', total:'', prepayment:'',
        targetCustom:'',
        duration: salesForm.duration, durationCustom:'',
        addon:'', addonCustom:'',
        payMethod: salesForm.payMethod, earnings:'', deliveryDate:'',
        sheetMonth: salesForm.sheetMonth,
      };
    } else {
      salesResult = 'err';
      salesResultMsg = 'Ошибка: ' + (text||resp.statusText||'неизвестная ошибка');
    }
  } catch(e){
    salesResult = 'err';
    salesResultMsg = 'Не удалось отправить: ' + e.message;
  }
  salesSubmitting = false;
  renderNow();
}

// ═══════════════════════════════════════════════════════════════════════════
// АНАЛИТИКА: прогноз месяца, загрузка ТО, календарь дедлайнов, цикл заказа.
// Расчёты — чистые функции от данных приложения; «сейчас» передаётся параметром,
// поэтому их можно проверять тестами на любой дате.
// ═══════════════════════════════════════════════════════════════════════════
const DAY_MS = 86400000;
function parseRuDate(str){            // «дд.мм.гггг» (допускаем «дд.мм.гг»), иначе null
  const m = String(str||'').match(/^\s*(\d{1,2})\.(\d{1,2})\.(\d{4}|\d{2})(?!\d)/);   // сначала 4 цифры года, потом 2
  if(!m) return null;
  let y = Number(m[3]); if(y < 100) y += 2000;
  const d = new Date(y, Number(m[2]) - 1, Number(m[1]));
  return (d.getMonth() === Number(m[2]) - 1 && d.getDate() === Number(m[1])) ? d : null;
}
function dayStart(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function daysBetween(a, b){ return Math.round((dayStart(b).getTime() - dayStart(a).getTime()) / DAY_MS); }
function anPlural(n, one, few, many){
  const a = Math.abs(n) % 100, b = a % 10;
  if(a > 10 && a < 20) return many;
  if(b > 1 && b < 5) return few;
  if(b === 1) return one;
  return many;
}
function anPluralNum(n, one, few, many){   // дробные числа: «5,6 заказа», целые — по обычным правилам
  const r = Math.round(n * 10) / 10;
  return Number.isInteger(r) ? anPlural(r, one, few, many) : few;
}
function anNum(n, digits){ return Number(n).toLocaleString('ru-RU', { maximumFractionDigits: digits == null ? 1 : digits }); }
function anMedian(arr){
  if(!arr.length) return null;
  const a = arr.slice().sort((x, y) => x - y), h = Math.floor(a.length / 2);
  return a.length % 2 ? a[h] : (a[h - 1] + a[h]) / 2;
}
function anAvg(arr){ return arr.length ? arr.reduce((s, x) => s + x, 0) / arr.length : null; }
function anDuration(ms){                 // «1 д 4 ч», «5 ч 20 м»
  if(ms == null) return '—';
  const h = Math.round(ms / 3600000);
  if(h >= 24){ const d = Math.floor(h / 24), r = h % 24; return d + ' д' + (r ? ' ' + r + ' ч' : ''); }
  if(h >= 1) return h + ' ч';
  return Math.max(1, Math.round(ms / 60000)) + ' мин';
}
function anDayLabel(d, today){
  const MON = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  const WD = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
  const off = daysBetween(today, d), base = d.getDate() + ' ' + MON[d.getMonth()];
  if(off === 0) return 'Сегодня, ' + base;
  if(off === 1) return 'Завтра, ' + base;
  return WD[d.getDay()] + ', ' + base;
}
// Куда относится заказ по статусу (так же, как на экране сотрудника)
function orderBucketOf(status){
  const s = String(status || '').toLowerCase();
  if(s.includes('успешно') || s === 'выполнен') return 'done';
  if(s.includes('оплат')) return 'pay';       // работа ТО закончена, ждём оплату клиента
  return 'open';                              // новый, в работе, проверка, ждёт материалы
}
// Все заказы отдела из данных приложения (все месяцы, без дублей) с учётом правок статуса
function collectDeptOrders(dept){
  const emps = {}; employees.forEach(e => { if(e.department === dept) emps[e.id] = e; });
  const seen = {}, out = [];
  Object.keys(ordersData || {}).forEach(mk => {
    const byEmp = ordersData[mk] || {};
    Object.keys(byEmp).forEach(empId => {
      if(!emps[empId]) return;
      (byEmp[empId] || []).forEach(o => {
        if(!o || seen[o.id]) return;
        seen[o.id] = true;
        const ov = ordersOverlay[o.id] || {};
        const status = ov.status || o.status || '';
        out.push({
          id: o.id, empId, emp: emps[empId].name, client: o.client || '', status,
          bucket: orderBucketOf(status), gross: Number(o.gross) || 0,
          created: parseRuDate(o.dateCreated), deadline: parseRuDate(o.deadline),
          finalTime: (ov.finalTime != null && ov.finalTime > 0) ? ov.finalTime : null
        });
      });
    });
  });
  return out;
}
// Нагрузка отдела: очередь по людям, темп сдачи, просрочка
function deptLoad(dept, mk, now){
  const today = dayStart(now);
  const emps = employees.filter(e => e.department === dept);
  const orders = collectDeptOrders(dept);
  const [y, m] = mk.split('-').map(Number);
  const isCur = (now.getFullYear() === y && now.getMonth() + 1 === m);
  const elapsed = isCur ? now.getDate() : daysInMonthOf(mk);     // календарных дней с начала месяца
  const monthList = ordersData[mk] || {};
  const rows = emps.map(e => {
    const mine = orders.filter(o => o.empId === e.id && o.bucket === 'open');
    const doneMonth = (monthList[e.id] || []).filter(o => orderBucketOf((ordersOverlay[o.id] || {}).status || o.status) !== 'open').length;
    const dls = mine.filter(o => o.deadline).map(o => o.deadline.getTime());
    return {
      id: e.id, name: e.name, open: mine.length,
      openSum: mine.reduce((s, o) => s + o.gross, 0),
      overdue: mine.filter(o => o.deadline && o.deadline < today).length,
      nearest: dls.length ? new Date(Math.min.apply(null, dls)) : null,
      doneMonth, pace: elapsed >= 3 ? doneMonth / elapsed : null
    };
  });
  const open = orders.filter(o => o.bucket === 'open');
  const teamDone = rows.reduce((s, r) => s + r.doneMonth, 0);
  const teamPace = (elapsed >= 3 && teamDone > 0) ? teamDone / elapsed : null;
  return {
    rows, open, openCount: open.length, openSum: open.reduce((s, o) => s + o.gross, 0),
    overdue: rows.reduce((s, r) => s + r.overdue, 0), teamDone, teamPace, elapsed,
    producers: rows.filter(r => r.doneMonth > 0).length,
    queueDays: (teamPace && open.length) ? open.length / teamPace : null,
    hasOrders: orders.length > 0, today
  };
}
// Сроки: просроченные, по дням на горизонт, позже, без срока
function deadlineBuckets(open, today, horizon){
  const overdue = [], byDay = {}, later = [], nodate = [];
  open.forEach(o => {
    if(!o.deadline){ nodate.push(o); return; }
    const off = daysBetween(today, o.deadline);
    if(off < 0) overdue.push(o);
    else if(off <= horizon) (byDay[off] = byDay[off] || []).push(o);
    else later.push(o);
  });
  return { overdue, byDay, later, nodate };
}
// Хватает ли темпа на сроки. Для каждого срока: заказов к этому сроку / дней до него.
// Максимум из этих нагрузок = нужный темп в день. Просроченное — «на сегодня».
function capacityVerdict(open, today, teamPace, producers){
  const offs = open.filter(o => o.deadline).map(o => Math.max(0, daysBetween(today, o.deadline)));
  if(!offs.length) return { status: 'nodeadlines' };
  if(!teamPace) return { status: 'nodata' };
  const uniq = Array.from(new Set(offs)).sort((a, b) => a - b);
  let required = 0, worstOff = 0;
  uniq.forEach(k => {
    const need = offs.filter(x => x <= k).length / (k + 1);
    if(need > required){ required = need; worstOff = k; }
  });
  const perPerson = teamPace / Math.max(1, producers);
  if(required <= teamPace) return { status: 'ok', required, teamPace, reserve: Math.round((teamPace / required - 1) * 100), worstOff };
  const extraRate = required - teamPace;
  return { status: 'short', required, teamPace, extraRate, extraPeople: extraRate / perPerson, worstOff };
}
// Цикл заказа
function deptCycle(dept, now){
  const today = dayStart(now), orders = collectDeptOrders(dept);
  const planned = orders.filter(o => o.created && o.deadline).map(o => daysBetween(o.created, o.deadline)).filter(n => n >= 0 && n <= 120);
  const ages = orders.filter(o => o.bucket === 'open' && o.created).map(o => Math.max(0, daysBetween(o.created, today)));
  const finals = orders.filter(o => o.finalTime).map(o => o.finalTime);
  return {
    planned: { n: planned.length, avg: anAvg(planned), median: anMedian(planned) },
    ages: { n: ages.length, avg: anAvg(ages), max: ages.length ? Math.max.apply(null, ages) : null },
    finals: { n: finals.length, avg: anAvg(finals), median: anMedian(finals) },
    total: orders.length
  };
}
// Прогноз месяца. Если есть трекер — берём его цифры (так считает ваша таблица),
// иначе — по календарному темпу кассы.
function monthForecast(mk, now){
  const f = companyFinance(mk), td = trackerData[mk];
  const [y, m] = mk.split('-').map(Number);
  const isCur = (now.getFullYear() === y && now.getMonth() + 1 === m);
  const dim = daysInMonthOf(mk);
  const plan = f.totalPlan || 0, fact = f.netCash || 0;
  const res = { mk, isCur, plan, fact, factPct: plan > 0 ? Math.round(fact / plan * 100) : 0, mode: 'none' };
  if(plan > 0 && td && td.plan > 0){
    res.mode = 'tracker';
    res.shouldBeNow = td.shouldBeNow || 0;
    res.diff = td.diff || 0;
    res.forecastPct = td.trendPct || 0;
    res.forecastTotal = td.forecastTotal || Math.round(plan * (td.trendPct || 0) / 100);
    res.daysLeft = td.workDaysLeft || 0;
    res.remaining = Math.max(0, td.remainingToPlan != null ? td.remainingToPlan : plan - fact);
    res.dailyNeeded = td.dailyTargetNeeded > 0 ? td.dailyTargetNeeded : (res.daysLeft > 0 ? res.remaining / res.daysLeft : res.remaining);
    res.daysLabel = 'раб.';
  } else if(plan > 0 && isCur){
    const elapsed = now.getDate(), left = dim - elapsed;
    res.mode = 'pace';
    res.forecastTotal = fact / elapsed * dim;
    res.forecastPct = Math.round(res.forecastTotal / plan * 100);
    res.daysLeft = left;
    res.remaining = Math.max(0, plan - fact);
    res.dailyNeeded = left > 0 ? res.remaining / left : res.remaining;
    res.daysLabel = 'кал.';
  } else if(plan > 0){
    res.mode = 'closed';
  }
  // средний чек — из заказов ТО этого месяца (иначе из всех)
  const withSum = collectDeptOrders('to').filter(o => o.gross > 0);
  const inMonth = withSum.filter(o => o.created && o.created.getFullYear() === y && o.created.getMonth() + 1 === m);
  const base = inMonth.length >= 3 ? inMonth : withSum;
  res.avgCheck = base.length ? anAvg(base.map(o => o.gross)) : null;
  res.ordersPerDay = (res.avgCheck > 0 && res.dailyNeeded > 0) ? res.dailyNeeded / res.avgCheck : null;
  return res;
}

    : 'Трекера нет, поэтому считаем по календарному темпу кассы: касса ÷ прошедшие дни × дней в месяце. Выходные и неравномерность не учитываются. Заказы в день = нужная сумма в день ÷ средний чек.';
  return '<div class="card"><h2>' + title + '</h2>' +
    '<div class="an-verdict ' + cls + '">' + verdict + '</div>' +
    '<div class="an-stats">' +
      '<div class="an-stat"><div class="l">Касса сейчас</div><div class="v">' + fmtMoney(fc.fact) + '</div><div class="s">' + fc.factPct + '% от плана ' + fmtMoney(fc.plan) + '</div></div>' +
      diffTxt +
      '<div class="an-stat ' + cls + '"><div class="l">Прогноз на конец месяца</div><div class="v">≈ ' + fmtMoney(fc.forecastTotal) + '</div><div class="s">' + p + '% плана</div></div>' +
      '<div class="an-stat"><div class="l">Нужно в день до конца</div><div class="v">' + fmtMoney(fc.dailyNeeded) + '</div>' + perDay + '</div>' +
      '<div class="an-stat"><div class="l">Осталось до плана</div><div class="v">' + fmtMoney(fc.remaining) + '</div><div class="s">' + fc.daysLeft + ' ' + fc.daysLabel + ' ' + anPlural(fc.daysLeft, 'день', 'дня', 'дней') + '</div></div>' +
    '</div>' + anHow(how) + '</div>';
}

  return '<div class="card"><h2>' + title + '</h2>' + verdict + stats +

function renderDeadlinesCard(dept, mk){
  const now = new Date(), L = deptLoad(dept, mk, now), today = L.today;
  const title = 'Календарь сдачи · ' + deptLabel(dept);
  if(!L.hasOrders) return '<div class="card"><h2>' + title + '</h2><div class="empty">Нет данных о заказах.</div></div>';
  const B = deadlineBuckets(L.open, today, 13);
  const norm = L.teamPace ? Math.max(2, Math.ceil(L.teamPace * 1.5)) : null;     // день «тяжелее нормы»
  const who = list => { const c = {}; list.forEach(o => { c[o.emp] = (c[o.emp] || 0) + 1; }); return Object.keys(c).map(n => escapeHtml(n) + (c[n] > 1 ? ' ×' + c[n] : '')).join(', '); };
  const sum = list => list.reduce((s, o) => s + o.gross, 0);
  const row = (label, list, cls, flag) => '<div class="an-dl-row ' + (cls || '') + '"><div class="an-dl-date">' + label + '</div><div><b>' + list.length + ' ' + anPlural(list.length, 'заказ', 'заказа', 'заказов') + '</b>' +
    (sum(list) ? ' · ' + fmtMoney(sum(list)) : '') + (flag ? ' <span class="an-flag">выше нормы дня</span>' : '') + '<div class="an-dl-who">' + who(list) + '</div></div></div>';
  let rows = '';
  if(B.overdue.length) rows += row('Просрочено', B.overdue, 'bad', false);
  for(let k = 0; k <= 13; k++){
    const list = B.byDay[k]; if(!list) continue;
    const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() + k);
    rows += row(anDayLabel(d, today), list, k === 0 ? 'today' : '', norm != null && list.length > norm);
  }
  if(B.later.length) rows += row('Позже, чем через 2 недели', B.later, '', false);
  if(B.nodate.length) rows += row('Срок не указан', B.nodate, 'muted', false);
  if(!rows) rows = '<div class="empty">Открытых заказов нет.</div>';
  const how = 'Открытые заказы сгруппированы по сроку сдачи на ближайшие 14 дней. «Выше нормы дня» — если заказов на один день больше, чем 1,5 × средний дневной темп команды (минимум 2).';
  return '<div class="card"><h2>' + title + '</h2>' + rows + anHow(how) + '</div>';
}

// Плашка ОС в сводке: люди и смена. Показатели работы добавятся, когда подключим
// листы апсейлов/реакций. Никаких денег, ставок и плана.
// ═══════════════════════════════════════════════════════════════════════════
// ОС: принятые заказы, объём (V), апсейлы, видеореакции — из таблиц.
// Только показатели работы: ни выплат, ни зарплаты, ни штрафов здесь нет.
// Источники: колонка «ОС» в листе «Отчёт по продажам», лист апсейлов, лист видеореакций.
// ═══════════════════════════════════════════════════════════════════════════
// Три ссылки ОС, которые задаёт админ. У ОС своя таблица — не та, откуда берём ТО и ОП.
function osKinds(){
  return {
    sales: { key:'app:osSalesUrls', cls:'ossales-url-input', get:()=>osSalesUrls, set:v=>{ osSalesUrls = v; } },
    ups:   { key:'app:upsellUrls',  cls:'ups-url-input',     get:()=>upsellUrls, set:v=>{ upsellUrls = v; } },
    react: { key:'app:reactUrls',   cls:'react-url-input',   get:()=>reactUrls,  set:v=>{ reactUrls = v; } },
  };
}
// Вкладка «Отчёт по продажам» из таблицы ОС: своя у месяца, если на неё не смотрит другой месяц
function osSalesDedicated(url, mk){
  const key = sheetTabKey(url);
  return !Object.keys(osSalesUrls).some(m=> m!==mk && sheetTabKey(osSalesUrls[m])===key);
}
function osEmpMap(){
  const m = {};
  employees.filter(e=>e.department==='os').forEach(e=>{ m[normName(e.name)] = e.id; });
  return m;
}
function osHeaderIdx(hl){ return hl.findIndex(h=>{ const t = String(h||'').replace(/\s+/g,' ').trim(); return t==='ос' || t==='os'; }); }
// «Сдали» — только точное значение: «не сдали» сюда попадать не должно
function osIsDone(v){ const t = String(v||'').toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ').trim(); return t==='сдали' || t==='сдан' || t==='сдано' || t==='сдана'; }
// Невидимые символы (нулевой пробел и т.п.) делают «пустую» ячейку непустой — чистим
function osClean(v){ return String(v==null ? '' : v).replace(/[\u200b-\u200f\u2060\ufeff\u202a-\u202e]/g, '').replace(/\u00a0/g, ' ').trim(); }
// Похоже ли на имя человека: буквы, 1–3 слова, без цифр. «6» или «скинул сценарий и персов» — это заметки, а не имя.
function osLooksLikeName(t){ t = osClean(t); return t.length > 0 && t.length <= 40 && /^[A-Za-zА-Яа-яЁё][A-Za-zА-Яа-яЁё.'’\-]*(\s+[A-Za-zА-Яа-яЁё.'’\-]+){0,2}$/.test(t); }
function osNameFromRow(row, col){ return col>=0 ? osClean(row[col]) : ''; }

// Лист с шапкой «где-то в первых строках»: ищем строку, где есть все нужные подписи
async function osLoadGrid(url, needles){
  let rows = null;
  try{
    rows = await fetchSheetRows(url, true, true);
    if(rows && rows.length && /^\s*</.test(String((rows[0]||[])[0]||''))) rows = null;   // пришла страница входа, а не таблица
  }catch(e){ rows = null; }
  if(!rows || rows.length < 1) rows = await fetchSheetRows(url);
  rows = (rows||[]).map(r=> (r||[]).map(c=> String(c==null ? '' : c)));
  let best = -1;
  for(let i=0; i<Math.min(rows.length, 15); i++){
    const hl = rows[i].map(h=>h.trim().toLowerCase());
    if(needles.every(n=> hl.some(h=>h.includes(n)))){ best = i; break; }
  }
  if(best < 0) return { rows: rows, header: -1 };
  return { rows: rows.slice(best), header: best };
}

// Лист продаж бывает двух видов:
//  • с шапкой («Имя», «Сумма», «Статус», … «ОС») — как «Отчёт по продажам <Месяц>»;
//  • вкладка «ОС»: шапки нет, сверху название блока («ВЗЯТЬ В РАБОТУ»…), потом заказы, все месяцы подряд.
async function osLoadSalesGrid(url){
  let rows = null;
  try{
    rows = await fetchSheetRows(url, true, true);
    if(rows && rows.length && /^\s*</.test(String((rows[0]||[])[0]||''))) rows = null;   // страница входа вместо таблицы
  }catch(e){ rows = null; }
  if(!rows || rows.length < 1) rows = await fetchSheetRows(url);
  rows = (rows||[]).map(r=> (r||[]).map(c=> String(c==null ? '' : c)));
  for(let i=0; i<Math.min(rows.length, 15); i++){
    const hl = rows[i].map(h=>osClean(h).toLowerCase());
    if(hl.some(h=>h.includes('имя')) && hl.some(h=>h.includes('сумма') || h.includes('дата') || h.includes('статус'))) return { mode:'header', rows: rows.slice(i) };
  }
  return { mode:'tab', rows: rows };
}

const OS_TAB_STATUS = ['взять в работу', 'в работе', 'ждём оплату', 'ждем оплату', 'успешно завершено'];
// Вкладка «ОС» без шапки. Колонки как в скрипте: A имя, B дата оформления, F сумма, K статус, S имя ОС.
// Месяц — по дате оформления (B): во вкладке все месяцы подряд.
function parseOsTab(rows, mk, empMap){
  const out = { per:{}, unassigned:{count:0, sum:0, list:[]}, unknown:{}, badSums:0, badDates:0, rows:0, warn:'', tab:true };
  const orders = rows.filter(r => OS_TAB_STATUS.indexOf(osClean((r||[])[10]).toLowerCase()) >= 0 && osClean((r||[])[0]));
  if(!orders.length){ out.warn = 'Во вкладке не нашёл заказов (ожидаю имя в колонке A, дату оформления в B, статус в K — как во вкладке «ОС»)'; return out; }
  const okDate = orders.filter(r => sheetDateMonth(osClean(r[1]))).length;
  const okSum = orders.filter(r => /\d/.test(String(r[5]==null ? '' : r[5]))).length;
  if(okDate / orders.length < 0.7 || okSum / orders.length < 0.7){ out.warn = 'Структура вкладки не похожа на «ОС»: ожидаю дату оформления в колонке B и сумму в F'; return out; }
  // Имя ОС — колонка S. Скрытые колонки Q и R (лист и строка) в выгрузке бывают и не бывают,
  // поэтому S то 19-я, то 17-я колонка. Определяем по Q: там название листа «Отчёт по продажам …».
  const hiddenExported = orders.some(r => /^отч[её]т по продажам/i.test(osClean(r[16])));
  let osCol = hiddenExported ? 18 : 16;
  const hits = c => orders.filter(r => empMap[normName(osClean(r[c]))]).length;
  const alt = osCol === 18 ? 16 : 18;
  if(hits(osCol) === 0 && hits(alt) > 0) osCol = alt;
  for(const r of orders){
    const rowMk = sheetDateMonth(osClean(r[1]));
    if(!rowMk){ out.badDates++; continue; }
    if(rowMk !== mk) continue;
    const rawSum = String(r[5]==null ? '' : r[5]).trim(), gross = parseNum(rawSum);
    if(rawSum && !/\d/.test(rawSum)){ out.badSums++; continue; }
    if(gross <= 0) continue;                                      // без суммы — не заказ
    out.rows++;
    const who = osClean(r[osCol]);
    const id = empMap[normName(who)];
    if(id){ const p = out.per[id] || (out.per[id] = { accepted:0, volume:0 }); p.accepted++; p.volume += gross; continue; }
    if(who && osLooksLikeName(who)){ out.unknown[who] = (out.unknown[who]||0) + 1; continue; }
    out.unassigned.count++; out.unassigned.sum += gross;          // пусто или заметка вместо имени — ОС не выбран
    if(out.unassigned.list.length < 30) out.unassigned.list.push({ name: osClean(r[0]) || '—', date: osClean(r[1]), sum: gross });
  }
  return out;
}

function parseOsSales(rows, mk, wholeTab, empMap){
  const out = { per:{}, unassigned:{count:0, sum:0, list:[]}, unknown:{}, badSums:0, rows:0, warn:'' };
  if(!rows || rows.length < 1){ out.warn = 'Лист «Отчёт по продажам» пустой или не найден'; return out; }
  const hl = rows[0].map(h=>String(h||'').trim().toLowerCase());
  const find = ps => { for(const p of ps){ const i = hl.findIndex(h=>h.includes(p)); if(i>=0) return i; } return -1; };
  const osCol = osHeaderIdx(hl);
  if(osCol < 0){ out.warn = 'В листе продаж нет колонки «ОС» (заголовок должен быть ровно «ОС»)'; return out; }
  const nameCol = find(['имя','name']), grossCol = find(['сумма общая','сумма']);
  const dateCol = find(['дата оформления','дата']), statusCol = find(['статус']);
  for(let r=1; r<rows.length; r++){
    const row = rows[r] || [];
    const nm = nameCol>=0 ? String(row[nameCol]||'').trim() : '';
    const rawSum = grossCol>=0 ? String(row[grossCol]||'').trim() : '';
    const gross = parseNum(rawSum);
    if(!nm && !rawSum) continue;                                      // пустая строка
    if(!(wholeTab || rowInMonth(row, dateCol, mk))) continue;         // чужой месяц
    if(statusCol>=0 && isCancelledStatus(row[statusCol])) continue;   // отменённые и возвраты не считаем
    if(rawSum && !/\d/.test(rawSum)){ out.badSums++; continue; }     // «договорная» — сумму не понять, показываем счётчиком
    if(grossCol>=0 ? gross <= 0 : !nm) continue;                      // без суммы — черновик, а не заказ
    const who = osNameFromRow(row, osCol);
    out.rows++;
    if(!who){
      out.unassigned.count++; out.unassigned.sum += gross;
      if(out.unassigned.list.length < 30) out.unassigned.list.push({ name: nm || '—', date: dateCol>=0 ? String(row[dateCol]||'').trim() : '', sum: gross });
      continue;
    }
    const id = empMap[normName(who)];
    if(!id){ out.unknown[who] = (out.unknown[who]||0) + 1; continue; }
    const p = out.per[id] || (out.per[id] = { accepted:0, volume:0 });
    p.accepted++; p.volume += gross;
  }
  return out;
}

function parseOsUpsell(rows, empMap){
  const out = { per:{}, unknown:{}, badSums:0, noWho:0, rows:0, warn:'' };
  if(!rows || rows.length < 1){ out.warn = 'Лист апсейлов пустой или не найден'; return out; }
  const hl = rows[0].map(h=>String(h||'').trim().toLowerCase());
  const whoCol = hl.findIndex(h=>h.includes('чей'));
  const stCol = hl.findIndex(h=>h.includes('сдали') || h.includes('сдан'));
  const sumCol = hl.findIndex(h=>h.includes('сумма') && !h.includes('лид'));
  const miss = [whoCol<0 ? '«Чей»' : '', sumCol<0 ? '«Сумма»' : '', stCol<0 ? '«Сдали/не сдали»' : ''].filter(Boolean);
  if(miss.length){ out.warn = 'В листе апсейлов не нашёл колонки: ' + miss.join(', '); return out; }
  for(let r=1; r<rows.length; r++){
    const row = rows[r] || [];
    const who = osNameFromRow(row, whoCol), rawSum = String(row[sumCol]||'').trim();
    if(!who && !rawSum) continue;
    if(rawSum && !/\d/.test(rawSum)) out.badSums++;                   // «пять тысяч» — сумму не понять
    const sum = parseNum(rawSum);
    if(!who){ out.noWho++; continue; }
    const id = empMap[normName(who)];
    if(!id){ out.unknown[who] = (out.unknown[who]||0) + 1; continue; }
    const p = out.per[id] || (out.per[id] = { done:0, pending:0, n:0 });
    if(osIsDone(row[stCol])) p.done += sum; else p.pending += sum;    // «не сдали» и пусто — «ожидает»
    p.n++; out.rows++;
  }
  return out;
}

function parseOsReactions(rows, empMap){
  const out = { per:{}, unknown:{}, rows:0, warn:'' };
  if(!rows || rows.length < 1){ out.warn = 'Лист видеореакций пустой или не найден'; return out; }
  const hl = rows[0].map(h=>String(h||'').trim().toLowerCase());
  let whoCol = hl.findIndex(h=>h.includes('чей'));
  if(whoCol < 0) whoCol = osHeaderIdx(hl);
  if(whoCol < 0){ out.warn = 'В листе видеореакций нет колонки «Чей»'; return out; }
  for(let r=1; r<rows.length; r++){
    const who = osNameFromRow(rows[r] || [], whoCol);
    if(!who) continue;                                                // каждая строка с именем = одна видеореакция
    const id = empMap[normName(who)];
    if(!id){ out.unknown[who] = (out.unknown[who]||0) + 1; continue; }
    out.per[id] = (out.per[id]||0) + 1; out.rows++;
  }
  return out;
}

async function syncOsData(mk, silent){
  mk = mk || editingMonth;
  if(osSyncing[mk]) return;
  osSyncing[mk] = true;
  if(!silent) render();
  const prev = osParts[mk] || {};
  const P = { sales: prev.sales || null, ups: prev.ups || null, react: prev.react || null,
              err: { sales:'', ups:'', react:'' }, link: { sales:false, ups:false, react:false }, at: Date.now() };
  try{
    // свежие ссылки (их задаёт админ; остальные только читают)
    try{
      const K = osKinds();
      const got = await Promise.all([storeGet(K.sales.key, SHARED), storeGet(K.ups.key, SHARED), storeGet(K.react.key, SHARED)]);
      [K.sales, K.ups, K.react].forEach((k, i)=>{ const v = got[i]; if(v && typeof v === 'object' && !Array.isArray(v)) k.set(Object.assign({}, k.get(), v)); });
    }catch(e){}
    const empMap = osEmpMap();
    // 1) лист продаж: колонка «ОС». Источник по порядку: ссылка на месяц → общая ссылка
    //    «на все месяцы» (вкладка «ОС») → листы ТО/ОП из раздела Google Таблица
    const ownUrl = (osSalesUrls[mk]||'').trim(), allUrl = (osSalesUrls['*']||'').trim();
    const sdept = getSheetUrl('to', mk) ? 'to' : (getSheetUrl('op', mk) ? 'op' : '');
    const salesUrl = ownUrl || allUrl || (sdept ? getSheetUrl(sdept, mk) : '');
    if(salesUrl){
      P.link.sales = true;
      try{
        const g = await osLoadSalesGrid(salesUrl);
        const whole = ownUrl ? osSalesDedicated(ownUrl, mk) : (allUrl ? false : isDedicatedTab(sdept, mk));
        P.sales = g.mode === 'header' ? parseOsSales(g.rows, mk, whole, empMap) : parseOsTab(g.rows, mk, empMap);
      }catch(e){ P.err.sales = 'Не получилось прочитать лист продаж: ' + e.message; }
    } else { P.sales = null; }
    // 2) лист апсейлов
    const uUrl = (upsellUrls[mk]||'').trim();
    if(uUrl){
      P.link.ups = true;
      try{
        const g = await osLoadGrid(uUrl, ['чей','сумма']);
        P.ups = g.header < 0 ? { per:{}, unknown:{}, badSums:0, noWho:0, rows:0, warn:'В листе апсейлов не нашёл строку с заголовками «Сумма», «Сдали/не сдали», «Чей»' } : parseOsUpsell(g.rows, empMap);
      }catch(e){ P.err.ups = 'Не получилось прочитать лист апсейлов: ' + e.message; }
    } else { P.ups = null; }
    // 3) лист видеореакций
    const rUrl = (reactUrls[mk]||'').trim();
    if(rUrl){
      P.link.react = true;
      try{
        const g = await osLoadGrid(rUrl, ['чей']);
        P.react = g.header < 0 ? { per:{}, unknown:{}, rows:0, warn:'В листе видеореакций не нашёл колонку «Чей»' } : parseOsReactions(g.rows, empMap);
      }catch(e){ P.err.react = 'Не получилось прочитать лист видеореакций: ' + e.message; }
    } else { P.react = null; }
  } finally {
    osParts[mk] = P;
    osSyncing[mk] = false;
    render();
  }
}
// Подтянуть данные, если их ещё нет или они старше 5 минут (и не чаще раза в минуту при ошибках)
function ensureOsData(mk){
  if(osSyncing[mk]) return;
  const P = osParts[mk];
  if(P && Date.now() - P.at < 5*60000) return;
  if(osAutoTried[mk] && Date.now() - osAutoTried[mk] < 60000) return;
  osAutoTried[mk] = Date.now();
  syncOsData(mk, true);
}
function osMetrics(empId, mk){
  const P = osParts[mk];
  const s = (P && P.sales && P.sales.per[empId]) || { accepted:0, volume:0 };
  const u = (P && P.ups && P.ups.per[empId]) || { done:0, pending:0 };
  const r = (P && P.react && P.react.per[empId]) || 0;
  return { accepted: s.accepted, volume: s.volume, upsDone: u.done, upsPending: u.pending, reactions: r };
}
function osUnknownNote(map, where){
  const names = Object.keys(map||{});
  if(!names.length) return '';
  return where + ': имя не найдено среди сотрудников ОС — ' + names.map(n=>'«' + escapeHtml(n) + '» (' + map[n] + ')').join(', ') + '. Проверьте написание (регистр и точка не важны).';
}
// Предупреждения и «заказы без ОС».
// staffView=true — карточка ОС: только «Заказы без ОС». Технические сообщения
// (лист не прочитался, строки без даты, непонятные суммы, неизвестные имена)
// — только админу в сводке, в карточке ОС их не показываем.
function renderOsAlerts(mk, staffView){
  const P = osParts[mk];
  if(!P) return '';
  const out = [];
  if(!P.link.sales) out.push(['amber', 'Таблица ОС («Отчёт по продажам») на этот месяц не подключена: админка → Данные → «Таблица ОС».']);
  else if(P.err.sales) out.push(['amber', escapeHtml(P.err.sales)]);
  else if(P.sales && P.sales.warn) out.push(['amber', escapeHtml(P.sales.warn)]);
  if(P.sales && !P.sales.warn){
    const un = P.sales.unassigned, cur = (mk === currentMonthKey());
    if(un.count){
      const items = un.list.map(x=>'<li>' + escapeHtml(x.name) + (x.date ? ' · ' + escapeHtml(x.date) : '') + (x.sum ? ' · ' + fmtMoney(x.sum) : '') + '</li>').join('');
      const more = '<details style="margin-top:6px;"><summary style="cursor:pointer;color:var(--ink3);font-size:12px;">Показать заказы</summary><ul>' + items + (un.count > un.list.length ? '<li>… и ещё ' + (un.count - un.list.length) + '</li>' : '') + '</ul></details>';
      out.push(cur
        ? ['bad', '<b>Заказы без ОС: ' + un.count + '</b> на ' + fmtMoney(un.sum) + '. Выберите ОС в таблице (колонка «ОС»).' + more]
        : ['info', 'Не привязаны к ОС (прошлый месяц): ' + un.count + ' на ' + fmtMoney(un.sum) + '.' + more]);
    }
    if(P.sales.badSums) out.push(['amber', 'Лист продаж: ' + P.sales.badSums + ' ' + anPlural(P.sales.badSums, 'строка', 'строки', 'строк') + ' с непонятной суммой — не учтено.']);
    if(P.sales.badDates) out.push(['amber', 'Лист продаж: ' + P.sales.badDates + ' ' + anPlural(P.sales.badDates, 'строка', 'строки', 'строк') + ' без понятной даты оформления — не учтено.']);
    const note = osUnknownNote(P.sales.unknown, 'Лист продаж'); if(note) out.push(['amber', note]);
  }
  if(!P.link.ups) out.push(['info', 'Лист апсейлов не подключён — апсейл появится, когда админ добавит ссылку.']);
  else if(P.err.ups) out.push(['amber', escapeHtml(P.err.ups)]);
  else if(P.ups){
    if(P.ups.warn) out.push(['amber', escapeHtml(P.ups.warn)]);
    if(P.ups.badSums) out.push(['amber', 'Лист апсейлов: ' + P.ups.badSums + ' ' + anPlural(P.ups.badSums, 'строка', 'строки', 'строк') + ' с непонятной суммой — не учтено.']);
    if(P.ups.noWho) out.push(['amber', 'Лист апсейлов: ' + P.ups.noWho + ' ' + anPlural(P.ups.noWho, 'строка', 'строки', 'строк') + ' без «Чей» — не привязано ни к кому.']);
    const note = osUnknownNote(P.ups.unknown, 'Лист апсейлов'); if(note) out.push(['amber', note]);
  }
  if(!P.link.react) out.push(['info', 'Лист видеореакций не подключён — видеореакции считаются как 0.']);
  else if(P.err.react) out.push(['amber', escapeHtml(P.err.react)]);
  else if(P.react){
    if(P.react.warn) out.push(['amber', escapeHtml(P.react.warn)]);
    const note = osUnknownNote(P.react.unknown, 'Лист видеореакций'); if(note) out.push(['amber', note]);
  }
  const shown = staffView ? out.filter(a=> a[0]==='bad' || a[0]==='info' && /^Не привязаны к ОС/.test(a[1])) : out;
  return shown.map(a=>'<div class="os-alert ' + a[0] + '">' + a[1] + '</div>').join('');
}
// Карточка самого ОС (и админа, когда он смотрит карточку)
function renderOsCard(emp, mk){
  ensureOsData(mk);
  const P = osParts[mk], m = osMetrics(emp.id, mk), busy = !!osSyncing[mk];
  const box = (label, value, sub) => '<div class="kpi-box"><div class="label">' + label + '</div><div class="value">' + value + '</div>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>';
  let grid;
  if(!P){
    grid = '<div class="empty">Считаю показатели…</div>';
  } else {
    const salesOk = !!(P.sales && !P.sales.warn), upsOk = !!(P.ups && !P.ups.warn), reactOk = !!(P.react && !P.react.warn);
    grid = '<div class="kpi-grid">' +
      box('Принято заказов', salesOk ? m.accepted : '—', salesOk ? '' : 'нет данных листа продаж') +
      box('Объём клиентов (V)', salesOk ? fmtMoney(m.volume) : '—', salesOk ? 'сумма принятых заказов' : '') +
      box('Апсейл сдан', upsOk ? fmtMoney(m.upsDone) : '—', upsOk ? '' : (P.link.ups ? 'нет данных' : 'лист не подключён')) +
      box('Апсейл ожидает', upsOk ? fmtMoney(m.upsPending) : '—', upsOk ? 'не сдали или без отметки' : '') +
      box('Видеореакции', reactOk ? m.reactions : '—', reactOk ? '' : (P.link.react ? 'нет данных' : 'лист не подключён')) +
      '</div>';
  }
  const refresh = '<div class="kpi-refresh"><span>' + (busy ? 'Обновляю…' : (P ? 'обновлено в ' + fmtTime(P.at) : 'ещё не обновлялось')) + '</span>' +
    '<button class="att-btn" id="osRefreshBtn" data-month="' + mk + '" ' + (busy ? 'disabled' : '') + '>Обновить сейчас</button></div>';
  return grid + renderOsAlerts(mk, true) + refresh;
}

            ${P && url ? `<div class="hint" style="margin-top:4px;">Обновлено в ${fmtTime(P.at)}</div>` : ''}
